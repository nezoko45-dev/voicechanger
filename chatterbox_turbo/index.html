<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatterbox Turbo Voice Changer</title><style>body{font:16px system-ui;background:#111;color:#eee;max-width:900px;margin:auto;padding:24px}button,input,select{font:inherit;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #555;background:#1d1d1d;color:#fff}button{cursor:pointer}.card{background:#1b1b1b;padding:18px;border-radius:14px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-top:8px}.status{padding:12px;background:#080808;border-radius:8px;white-space:pre-wrap}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><h1>🎙️ Chatterbox Turbo Voice Changer</h1><div class="card"><label>Reference WAV</label><input id="wav" type="file" accept="audio/*"><label>Text to speak</label><input id="text" value="Hello! This is my cloned voice."><br><button id="load">Load Chatterbox Turbo</button><button id="generate" disabled>Generate cloned voice</button><audio id="audio" controls></audio></div><div class="card"><div class="row"><div><label>Microphone</label><select id="mic"></select></div><div><label>Output</label><select id="out"></select></div></div><button id="refresh">Refresh devices</button><button id="micTest">Test microphone</button></div><div class="card"><strong>Status</strong><div id="status" class="status">Ready. Chatterbox Turbo runs locally in Chrome using WebGPU/WASM. First model load downloads and caches the model.</div></div><script type="module" src="./app.js"></script></body></html>
