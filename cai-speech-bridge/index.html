<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAI Offline Speech Bridge</title><style>
body{font:16px system-ui;background:#111827;color:#f3f4f6;max-width:760px;margin:30px auto;padding:20px}button{padding:12px 16px;margin:5px;border:0;border-radius:9px;background:#374151;color:white;cursor:pointer;font-size:16px}.primary{background:#2563eb}.voice{background:#7c3aed}textarea,pre{box-sizing:border-box;width:100%;padding:13px;background:#1f2937;color:white;border:1px solid #374151;border-radius:10px;font:inherit}textarea{min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.panel{background:#182233;border:1px solid #293548;border-radius:13px;padding:15px;margin:14px 0}small{color:#9ca3af}
</style></head><body><h1>🎙 CAI Offline Speech Bridge</h1><p>Uses Vosk inside CAI-Bridge.exe. No Chrome/Google SpeechRecognition.</p>
<section class="panel"><h2>Connection</h2><button id="check">Check EXE</button><pre id="status">Connecting…</pre></section>
<section class="panel"><h2>Offline microphone</h2><button class="primary" id="start">🎙 Start offline listening</button><button id="stop">Stop</button><pre id="mic">Idle</pre><pre id="last">Recognized phrase appears in EXE log</pre></section>
<section class="panel"><h2>Character.AI</h2><button class="voice" id="voice">Toggle CAI voice</button><textarea id="text" placeholder="Type a message…"></textarea><button class="primary" id="send">Send + Enter</button><small>Vosk phrases are automatically pasted and sent by the EXE.</small></section>
<script>
const $=s=>document.querySelector(s);async function api(path,body){const r=await fetch('http://127.0.0.1:8788'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let j;try{j=await r.json()}catch{throw Error('Helper HTTP '+r.status)}if(!r.ok||j.ok===false)throw Error(j.error||j.result||('HTTP '+r.status));return j}
async function check(){try{let j=await api('/status');$('#status').textContent='✅ '+j.message+' — EXE connected'}catch(e){$('#status').textContent='❌ '+e.message+'\nRun CAI-Bridge.exe and allow Chrome local-network access.'}}
$('#check').onclick=check;check();$('#start').onclick=async()=>{try{let j=await api('/listen/start',{});$('#mic').textContent=j.message||'Listening offline — Vosk'}catch(e){$('#mic').textContent='ERROR: '+e.message}};$('#stop').onclick=async()=>{try{let j=await api('/listen/stop',{});$('#mic').textContent=j.message||'Stopped'}catch(e){$('#mic').textContent='ERROR: '+e.message}};$('#voice').onclick=async()=>{try{let j=await api('/voice/toggle',{});$('#status').textContent='Voice: '+j.result}catch(e){$('#status').textContent=e.message}};$('#send').onclick=async()=>{let t=$('#text').value.trim();if(!t)return;try{await api('/transcript',{text:t});$('#text').value='';$('#status').textContent='Sent to CAI'}catch(e){$('#status').textContent='Send error: '+e.message}};
</script></body></html>
