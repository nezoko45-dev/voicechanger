<!doctype html><html><meta charset="utf-8"><title>CAI Speech Recognition</title><body style="font:16px Segoe UI;background:#151515;color:#eee;padding:24px"><h2>Chrome Speech Recognition</h2><p id="status">Starting microphone…</p><pre id="words"></pre><script>(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let latestSpeech="",rec;if(!SR){document.getElementById('status').textContent="Chrome SpeechRecognition unavailable";return;}rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=true;rec.onstart=()=>document.getElementById('status').textContent="Listening (keep this tab open)";rec.onerror=e=>document.getElementById('status').textContent="Speech error: "+e.error;rec.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t.trim()){latestSpeech=t.trim();document.title="SPEECH:"+latestSpeech;document.getElementById('words').textContent=latestSpeech;}};rec.onend=()=>setTimeout(()=>{try{rec.start()}catch{}},500);try{rec.start()}catch{}window.getLatestSpeech=()=>{const x=latestSpeech;latestSpeech="";document.title="CAI Speech Recognition";return x;};})();</script></body></html>
