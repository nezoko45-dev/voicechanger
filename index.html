<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceChanger — AssemblyAI</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08070b;color:#f7f3ff}.card{width:min(820px,100%);padding:28px;border:1px solid #30273b;border-radius:22px;background:#121017;box-shadow:0 24px 80px #0009}.title{font-size:32px;font-weight:800}.sub{margin:6px 0 24px;color:#9e96a8}.controls{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 18px;font-weight:750;font-size:15px;cursor:pointer;background:#8b5cf6;color:white}button.alt{background:#29242f}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:16px;padding:13px;border-radius:12px;background:#0c0a0f;color:#c9c1d1}.meter{height:7px;margin-top:10px;border-radius:99px;overflow:hidden;background:#29232f}.meter i{display:block;width:0;height:100%;background:#a78bfa;transition:width .08s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.panel{min-height:115px;padding:16px;border:1px solid #30273b;border-radius:15px;background:#0e0c12}.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#817889;margin-bottom:9px}.text{font-size:17px;line-height:1.45;white-space:pre-wrap}.debug{margin-top:14px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#92899b;white-space:pre-wrap}.note{margin-top:16px;color:#817889;font-size:12px;line-height:1.5}</style></head><body><main class="card"><div class="title">🎙️ VoiceChanger</div><div class="sub">Microphone → AssemblyAI Universal-3.5 Pro WebSocket</div><div class="controls"><button id="start">🎤 Start</button><button id="stop" class="alt" disabled>⏹ Stop</button></div><div class="meter"><i id="meter"></i></div><div id="status" class="status">Ready — press Start.</div><div class="grid"><section class="panel"><div class="label">Transcript</div><div id="transcript" class="text">—</div></section><section class="panel"><div class="label">Voice</div><div id="voice" class="text">Waiting…</div></section></div><div id="debug" class="debug">WebSocket: idle</div><div class="note">Uses a short-lived AssemblyAI token from the secure Netlify function. Your permanent AssemblyAI API key is never sent to the browser.</div></main><script>
'use strict';const $=id=>document.getElementById(id),start=$('start'),stop=$('stop'),status=$('status'),meter=$('meter'),transcript=$('transcript'),voice=$('voice'),debug=$('debug');let running=false,stream=null,ctx=null,source=null,processor=null,socket=null;
const setStatus=(t,p)=>{status.textContent=t;if(p!==undefined)meter.style.width=p+'%'};
function stopAudio(){if(processor){try{processor.disconnect()}catch{}processor.onaudioprocess=null;processor=null}if(source){try{source.disconnect()}catch{}source=null}if(ctx){try{ctx.close()}catch{}ctx=null}}
function closeSocket(){const s=socket;socket=null;if(s){try{if(s.readyState===WebSocket.OPEN)s.send(JSON.stringify({type:'Terminate'}))}catch{}try{s.close()}catch{}}}
function stopAll(){running=false;stopAudio();closeSocket();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}speechSynthesis.cancel();start.disabled=false;stop.disabled=true;meter.style.width='0';debug.textContent='WebSocket: stopped';setStatus('Ready.',0)}
stop.onclick=stopAll;
start.onclick=async()=>{if(running)return;try{setStatus('🎤 Requesting microphone…',10);stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});running=true;start.disabled=true;stop.disabled=false;transcript.textContent='—';voice.textContent='Listening…';await openAssembly();setStatus('🎤 Connected — listening…',100)}catch(e){debug.textContent='ERROR: '+e.message;stopAll();setStatus('❌ '+e.message,0)}};
async function getToken(){setStatus('🔐 Getting temporary AssemblyAI token…',20);const r=await fetch('https://voicechanger-token.netlify.app/.netlify/functions/assembly-token',{cache:'no-store'}).catch(()=>null);if(!r)throw new Error('Could not reach the token service.');if(!r.ok)throw new Error('Token service returned HTTP '+r.status+'. Make sure the Netlify function has ASSEMBLYAI_API_KEY configured.');const d=await r.json();if(!d.token)throw new Error(d.error||'Token service returned no token.');return d.token}
function openAssembly(){return getToken().then(token=>new Promise((resolve,reject)=>{const url='wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&speech_model=universal-3-5-pro&token='+encodeURIComponent(token);let opened=false;setStatus('🔌 Connecting AssemblyAI…',35);debug.textContent='WebSocket: connecting…';try{socket=new WebSocket(url)}catch(e){reject(e);return}const s=socket,timer=setTimeout(()=>{if(!opened){try{s.close()}catch{}reject(new Error('AssemblyAI WebSocket timed out.'))}},10000);s.onopen=()=>{if(s!==socket||!running)return;opened=true;clearTimeout(timer);debug.textContent='WebSocket: OPEN';startAudio();resolve()};s.onmessage=e=>handleMessage(e.data);s.onerror=()=>{if(s===socket&&running){debug.textContent='WebSocket: ERROR';setStatus('❌ AssemblyAI WebSocket error.',0)}};s.onclose=e=>{clearTimeout(timer);if(s!==socket)return;socket=null;stopAudio();debug.textContent='WebSocket: CLOSED '+e.code+' '+(e.reason||'(no reason)');if(running){running=false;start.disabled=false;stop.disabled=true;setStatus('❌ AssemblyAI disconnected ('+e.code+').',0)}}}))}
function startAudio(){if(!running||!stream||!socket||socket.readyState!==WebSocket.OPEN)return;ctx=new(window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);const rate=ctx.sampleRate;processor.onaudioprocess=e=>{if(!running||!socket||socket.readyState!==WebSocket.OPEN)return;const input=e.inputBuffer.getChannelData(0),n=Math.max(1,Math.round(input.length*16000/rate)),pcm=new Int16Array(n);for(let i=0;i<n;i++){const pos=i*rate/16000,a=Math.floor(pos),b=Math.min(a+1,input.length-1),f=pos-a,v=input[a]*(1-f)+input[b]*f;pcm[i]=Math.max(-32768,Math.min(32767,Math.round(v*32767)))}try{socket.send(pcm.buffer)}catch{}};source.connect(processor);processor.connect(ctx.destination);ctx.resume().catch(()=>{})}
function handleMessage(raw){if(typeof raw!=='string')return;let d;try{d=JSON.parse(raw)}catch{return}if(d.type==='Begin'){debug.textContent='WebSocket: OPEN — session '+(d.id||'ready');return}if(d.type==='Turn'){if(d.transcript)transcript.textContent=d.transcript;if(d.end_of_turn){voice.textContent='🔊 Speaking…';speak(d.transcript);setStatus('✅ Turn complete — listening…',100)}else{voice.textContent='Listening…';setStatus('📝 Transcribing…',100)}return}if(d.type==='Termination'){debug.textContent='WebSocket: TERMINATED';return}if(d.type==='Error'){debug.textContent='AssemblyAI ERROR: '+(d.error||d.message||JSON.stringify(d));setStatus('❌ '+(d.error||d.message||'AssemblyAI error'),0)}}
function speak(text){if(!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;u.onend=()=>voice.textContent='✅ Finished.';speechSynthesis.speak(u)}
window.addEventListener('beforeunload',()=>{running=false;stopAudio();closeSocket()});
</script></body></html>
