<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepgram Voice — Amalthea</title>
<style>
body{margin:0;background:#080b11;color:#fff;font:16px Arial,sans-serif}
main{max-width:620px;margin:50px auto;padding:20px}
.card{background:#121824;border:1px solid #303a4d;border-radius:18px;padding:24px}
input{width:100%;padding:13px;margin:8px 0 16px;box-sizing:border-box;background:#080d15;color:#fff;border:1px solid #40506a;border-radius:10px}
button{padding:14px 20px;border:0;border-radius:10px;background:#765cff;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#stop{background:#a43d55;margin-left:8px}
#status,#transcript{margin-top:16px;padding:13px;background:#080d15;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<main><div class="card">
<h1>Amalthea Voice</h1>
<p>Continuous Deepgram Flux STT → Deepgram Aura-2 Amalthea TTS</p>
<label>Deepgram API key / temporary token</label>
<input id="key" type="password" placeholder="Paste your Deepgram key or token">
<button id="start" type="button">Start listening</button>
<button id="stop" type="button" disabled>Stop</button>
<div id="status">Ready.</div>
<div id="transcript">—</div>
</div></main>

<script>
(function(){
"use strict";
var running=false,ctx=null,stream=null,source=null,processor=null,stt=null,tts=null,playAt=0;
var lastSpoken="";
var sentenceBuffer="";

function $(id){return document.getElementById(id)}
function status(s){$("status").textContent=s}
function auth(k){return ["token",k]}

function downsample(a,rate){
  var ratio=rate/16000,n=Math.floor(a.length/ratio),o=new Int16Array(n);
  for(var i=0;i<n;i++){
    var p=i*ratio,j=Math.floor(p),f=p-j;
    var x=(a[j]||0)+((a[j+1]||a[j]||0)-(a[j]||0))*f;
    o[i]=Math.max(-32768,Math.min(32767,Math.round(x*32767)));
  }
  return o.buffer;
}

/* Remove immediate repeated words such as:
   "hello hello how are you" -> "hello how are you" */
function removeRepeatedWords(text){
  var words=text.trim().split(/\s+/),out=[];
  for(var i=0;i<words.length;i++){
    var current=words[i];
    var previous=out.length?out[out.length-1]:"";
    if(current.replace(/[.,!?;:]+$/,"").toLowerCase()===
       previous.replace(/[.,!?;:]+$/,"").toLowerCase()) continue;
    out.push(current);
  }
  return out.join(" ");
}

/* Return exactly one complete sentence, if one exists. */
function firstCompleteSentence(text){
  var m=text.match(/^\s*(.+?[.!?](?:["'”’)]*)?)(?:\s|$)/);
  return m?m[1].trim():"";
}

function play(buf){
  if(!ctx||!running)return;
  var pcm=new Int16Array(buf),f=new Float32Array(pcm.length);
  for(var i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;
  var b=ctx.createBuffer(1,f.length,24000);
  b.copyToChannel(f,0);
  var n=ctx.createBufferSource();
  n.buffer=b;n.connect(ctx.destination);
  if(playAt<ctx.currentTime+.01)playAt=ctx.currentTime+.01;
  n.start(playAt);playAt+=b.duration;
}

function connectSTT(key){
  return new Promise(function(resolve,reject){
    var q=new URLSearchParams({
      model:"flux-general-en",
      encoding:"linear16",
      sample_rate:"16000"
    });
    stt=new WebSocket("wss://api.deepgram.com/v2/listen?"+q,auth(key));
    stt.onopen=function(){status("Deepgram Flux connected — continuously listening.");resolve()};
    stt.onmessage=function(e){
      if(typeof e.data!=="string")return;
      var m;try{m=JSON.parse(e.data)}catch(_){return}
      if(m.type==="TurnInfo"){
        var text=removeRepeatedWords(String(m.transcript||"").trim());
        if(!text)return;

        sentenceBuffer=text;
        var sentence=firstCompleteSentence(sentenceBuffer);

        /* Only send one complete sentence to Amalthea.
           This prevents partial-turn repeats and repeated TTS. */
        if(sentence){
          var clean=removeRepeatedWords(sentence);
          var keyText=clean.toLowerCase().replace(/\s+/g," ");
          if(keyText!==lastSpoken){
            lastSpoken=keyText;
            $("transcript").textContent=clean;
            speak(clean);
          }
          sentenceBuffer=sentenceBuffer.slice(sentence.length).trim();
        }else{
          $("transcript").textContent=text;
        }
      }
      if(m.type==="Error")status("STT error: "+(m.description||"Unknown error"));
    };
    stt.onerror=function(){reject(new Error("Deepgram STT WebSocket connection failed"))};
    stt.onclose=function(){if(running)status("Deepgram STT disconnected.")};
  });
}

function connectTTS(key){
  return new Promise(function(resolve,reject){
    var q=new URLSearchParams({
      model:"aura-2-amalthea-en",
      encoding:"linear16",
      sample_rate:"24000"
    });
    tts=new WebSocket("wss://api.deepgram.com/v1/speak?"+q,auth(key));
    tts.binaryType="arraybuffer";
    tts.onopen=function(){status("Flux STT + Amalthea TTS connected.");resolve()};
    tts.onmessage=function(e){
      if(typeof e.data==="string"){
        try{
          var m=JSON.parse(e.data);
          if(m.type==="Error")status("Amalthea TTS error: "+(m.description||m.message||"Unknown error"));
        }catch(_){}
      }else if(e.data instanceof ArrayBuffer)play(e.data);
      else if(e.data&&e.data.arrayBuffer)e.data.arrayBuffer().then(play);
    };
    tts.onerror=function(){reject(new Error("Amalthea TTS WebSocket connection failed"))};
    tts.onclose=function(){if(running)status("Amalthea TTS disconnected.")};
  });
}

function speak(text){
  if(tts&&tts.readyState===WebSocket.OPEN){
    tts.send(JSON.stringify({type:"Speak",text:text}));
    tts.send(JSON.stringify({type:"Flush"}));
  }
}

async function start(){
  if(running)return;
  var key=$("key").value.trim();
  if(!key){status("Enter your Deepgram API key or temporary token first.");$("key").focus();return}
  $("start").disabled=true;$("stop").disabled=false;running=true;playAt=0;lastSpoken="";sentenceBuffer="";
  try{
    ctx=new AudioContext({latencyHint:"interactive"});
    await ctx.resume();
    stream=await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    source=ctx.createMediaStreamSource(stream);
    await connectTTS(key);
    await connectSTT(key);
    processor=ctx.createScriptProcessor(4096,1,1);
    processor.onaudioprocess=function(e){
      if(running&&stt&&stt.readyState===WebSocket.OPEN)
        stt.send(downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate));
    };
    var mute=ctx.createGain();mute.gain.value=0;
    source.connect(processor);processor.connect(mute);mute.connect(ctx.destination);
    status("RUNNING — one complete sentence at a time.");
  }catch(e){stop();status("Start failed: "+(e.message||e))}
}

function stop(){
  running=false;sentenceBuffer="";lastSpoken="";
  try{if(stt&&stt.readyState===WebSocket.OPEN)stt.send(JSON.stringify({type:"CloseStream"}))}catch(_){}
  try{if(tts&&tts.readyState===WebSocket.OPEN)tts.send(JSON.stringify({type:"Close"}))}catch(_){}
  try{if(processor)processor.disconnect()}catch(_){}
  try{if(source)source.disconnect()}catch(_){}
  try{if(stream)stream.getTracks().forEach(function(t){t.stop()})}catch(_){}
  try{if(ctx)ctx.close()}catch(_){}
  try{if(stt)stt.close()}catch(_){}
  try{if(tts)tts.close()}catch(_){}
  stt=null;tts=null;processor=null;source=null;stream=null;ctx=null;
  $("start").disabled=false;$("stop").disabled=true;status("Stopped. Ready.");
}

window.addEventListener("DOMContentLoaded",function(){
  $("start").disabled=false;$("stop").disabled=true;
  $("start").onclick=start;$("stop").onclick=stop;
});
})();
</script>
</body>
</html>
