<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGPU Voice Cloner</title><style>:root{color-scheme:dark}body{margin:0;background:#090d14;color:#eef2f7;font:15px system-ui,sans-serif}main{max-width:620px;margin:48px auto;padding:0 18px}.card{background:#121925;border:1px solid #293449;border-radius:18px;padding:22px}h1{margin:0 0 8px}p{color:#9eabc0;line-height:1.5}input{width:100%;box-sizing:border-box;background:#0a1019;color:#fff;border:1px solid #344057;border-radius:10px;padding:12px}button{border:0;border-radius:10px;padding:12px 18px;background:#705cff;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.stop{background:#a23d55}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{margin-top:16px;white-space:pre-wrap;background:#090e16;border-radius:10px;padding:12px;font:12px ui-monospace,monospace;line-height:1.5}.small{font-size:12px}.ok{border:1px solid #2d8a5b}.err{border:1px solid #9c3c54}</style></head>
<body><main><div class="card"><h1>WebGPU Voice Cloner</h1>
<p>Pick your RVC voice model once. Chrome remembers it locally, automatically gets the required support models, and keeps your headset mic running continuously.</p>
<input id="model" type="file" accept=".onnx,.pth"><div class="row"><button id="load">Build voice model once</button><button id="start" disabled>Start</button><button id="stop" class="stop" disabled>Stop</button></div>
<div id="status" class="status">Choose an RVC v2 voice model.</div><p class="small">Audio path: headset mic → WebGPU/WASM RVC → Chrome output → Voicemeeter → VRChat.</p>
</div></main><script type="module" src="./app.js"></script></body></html>
