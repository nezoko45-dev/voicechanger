<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local HF Repeat Voice</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101014;color:#eee;font:15px system-ui,sans-serif}
.card{width:min(620px,92vw);padding:25px;background:#1b1b21;border:1px solid #383842;border-radius:18px;box-shadow:0 18px 60px #0008}
h1{margin:0 0 5px;font-size:25px}.sub{color:#aaa;margin-bottom:20px}
label{display:block;color:#bbb;margin:13px 0 6px}
select,button{width:100%;box-sizing:border-box;border-radius:10px;padding:12px;border:1px solid #444}
select{background:#101014;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;margin-top:20px}.actions button{cursor:pointer;font-weight:700}
#start{background:#f2a6ff;color:#171019;border:0}.stop{background:#333;color:#fff}
.status{margin-top:18px;background:#101014;padding:12px;border-radius:10px;color:#aaa}
.good{color:#9cffbd}.bad{color:#ff9696}
#heard{margin-top:12px;color:#ddd;min-height:24px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#292933;color:#bbb;font-size:12px}
small{color:#888}
</style>
</head>
<body>
<div class="card">
<h1>🎀 Local Hugging Face Repeat Voice</h1>
<div class="sub">Mic → local STT → repeat-only agent → female Kokoro voice → Windows output</div>

<div class="row">
<div>
<label>Microphone</label>
<select id="input"></select>
</div>
<div>
<label>Output</label>
<select id="output"></select>
</div>
</div>

<label>Female voice</label>
<select id="voice">
<option value="af_heart">af_heart — warm female</option>
<option value="af_bella">af_bella — expressive female</option>
<option value="af_sarah">af_sarah — conversational female</option>
<option value="af_nicole">af_nicole — friendly female</option>
<option value="af_nova">af_nova — clear female</option>
</select>

<div class="actions">
<button id="start">Start</button>
<button id="stop" class="stop">Stop</button>
</div>

<div class="status" id="status"><span class="pill">LOCAL</span> Starting server…</div>
<div id="heard"></div>
<small>First launch downloads the Hugging Face models. After they are cached, the voice pipeline runs locally.</small>
</div>
<script src="/app.js"></script>
</body>
</html>
