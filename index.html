<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenVoice V2 Clone</title>
<style>
body{margin:0;background:#080b11;color:#fff;font:16px Arial}main{max-width:620px;margin:50px auto;padding:20px}
.card{background:#121824;border:1px solid #303a4d;border-radius:18px;padding:26px}
input{width:100%;box-sizing:border-box;padding:13px;margin:10px 0 16px;background:#080d15;color:#fff;border:1px solid #40506a;border-radius:10px}
button{padding:13px 20px;border:0;border-radius:10px;background:#765cff;color:#fff;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.45;cursor:not-allowed}.box{margin-top:14px;padding:13px;background:#080d15;border-radius:10px;white-space:pre-wrap}
small{color:#aeb8c9;line-height:1.55}
</style></head><body><main><div class="card">
<h1>OpenVoice V2 Voice Clone</h1>
<p>Reference WAV → reusable OpenVoice voice embedding.</p>
<input id="voice" type="file" accept=".wav,audio/wav">
<button id="clone" disabled>Clone this voice</button>
<div id="status" class="box">Choose a WAV file.</div>
<div class="box"><small>No external API. The page connects only to the local OpenVoice service. Start clone.bat before pressing Clone.</small></div>
</div></main>
<script>
(function(){
"use strict";
var voice=document.getElementById("voice"),btn=document.getElementById("clone"),status=document.getElementById("status");
var base="http://127.0.0.1:8000";
function setStatus(s){status.textContent=s}
function localFetch(path,options){
 options=options||{};
 options.mode="cors";
 options.targetAddressSpace="loopback";
 return fetch(base+path,options);
}
voice.onchange=function(){
 btn.disabled=!voice.files.length;
 setStatus(voice.files.length?"Ready: "+voice.files[0].name:"Choose a WAV file.");
};
btn.onclick=async function(){
 if(!voice.files.length)return;
 btn.disabled=true;
 setStatus("Checking local OpenVoice service…");
 try{
  var h=await localFetch("/health",{method:"GET"});
  if(!h.ok)throw Error("Service returned HTTP "+h.status);
  setStatus("Creating voice clone…");
  var fd=new FormData();
  fd.append("reference",voice.files[0],voice.files[0].name);
  var r=await localFetch("/clone",{method:"POST",body:fd});
  var raw=await r.text();
  var data;
  try{data=JSON.parse(raw)}catch(_){throw Error("Service returned invalid data: "+raw.slice(0,180))}
  if(!r.ok||!data.ok)throw Error(data.error||("Service returned HTTP "+r.status));
  setStatus("Clone complete!\nSaved: cloned_voice\\voice_embedding.pth");
 }catch(e){
  var m=String(e&&e.message||e);
  if(m==="Failed to fetch"||/NetworkError|Load failed/i.test(m))
    m="Cannot reach OpenVoice locally. Double-click clone.bat and leave its window open, then press Clone again.";
  setStatus("Clone error: "+m);
 }finally{btn.disabled=false}
};
})();
</script></body></html>
