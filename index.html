<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketTTS Voice</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0f;color:#eee;font:15px system-ui,Segoe UI,sans-serif}
.card{width:min(620px,92vw);padding:28px;border:1px solid #29292f;border-radius:20px;background:#17171b}
h1{margin:0 0 6px;font-size:28px}.sub{margin:0 0 24px;color:#999}
label{display:block;margin:14px 0 7px;color:#aaa;font-size:13px}
select,textarea,button{width:100%;padding:12px;border:1px solid #36363e;border-radius:10px;background:#0f0f12;color:#fff;font:inherit}
textarea{min-height:110px;resize:vertical}
button{margin-top:12px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#7040ff;border-color:#8055ff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{margin-top:18px;padding:12px;border-radius:10px;background:#0f0f12;color:#aaa;min-height:44px}
audio{width:100%;margin-top:14px}
.small{margin-top:12px;color:#777;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<h1>🎙 PocketTTS Voice</h1>
<p class="sub">Simple local microphone + PocketTTS voice cloning</p>

<label>Microphone</label>
<select id="mic"><option>Choose microphone…</option></select>

<label>Output</label>
<select id="output"><option>Default output</option></select>

<div class="row">
<button id="micTest">TEST MIC</button>
<button id="stopMic" disabled>STOP MIC</button>
</div>

<label>Text for PocketTTS</label>
<textarea id="text" placeholder="Type what you want your cloned voice to say…">Hello! This is my local PocketTTS voice.</textarea>

<button class="primary" id="generate">GENERATE VOICE</button>

<div class="status" id="status">Starting local PocketTTS…</div>
<audio id="player" controls></audio>

<div class="small">
Reference voice: <b>Recording (10).wav</b><br>
The WAV is used locally as PocketTTS's voice reference. No STT, Deepgram, cloud API, or Internet service is used by the app.
</div>
</main>
<script src="app.js"></script>
</body>
</html>
