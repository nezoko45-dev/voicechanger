<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceChanger — Deepgram Flux</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0f;color:#f5f7fb}.card{width:min(820px,94vw);padding:28px;border:1px solid #252b36;border-radius:22px;background:#11151c}.title{font-size:30px;font-weight:800}.sub{margin:6px 0 22px;color:#9da7b5}.box,.panel{padding:18px;border:1px solid #252b36;border-radius:14px;background:#0d1117}.label{font-size:12px;font-weight:800;color:#aab4c2;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}.row{display:flex;gap:10px}.row>*{min-width:0}input,select{flex:1;padding:12px 14px;border:1px solid #303846;border-radius:10px;background:#080b10;color:#fff}button{border:0;border-radius:10px;padding:12px 16px;background:#6d5dfc;color:#fff;font-weight:750;cursor:pointer}button.alt{background:#252c38}button:disabled{opacity:.45}.voice{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-top:14px}.controls{display:flex;gap:10px;margin:18px 0}.status{padding:12px;border-radius:10px;background:#0b0e13;color:#c5ceda}.meter{height:8px;background:#202632;border-radius:99px;overflow:hidden;margin:14px 0}.meter i{display:block;width:0;height:100%;background:#6d5dfc}.transcript{white-space:pre-wrap;color:#e3e8ef;line-height:1.55;min-height:70px}.debug{margin-top:14px;font:12px ui-monospace,monospace;color:#778292;white-space:pre-wrap;max-height:190px;overflow:auto}@media(max-width:650px){.row,.voice{display:grid;grid-template-columns:1fr}.controls{flex-wrap:wrap}}</style></head><body><main class="card"><div class="title">🎙️ VoiceChanger</div><div class="sub">Deepgram Flux speech recognition + Aura speech output</div><section class="box"><div class="label">Deepgram API key</div><div class="row"><input id="key" type="password" placeholder="Paste your Deepgram API key"><button id="save">Save key</button></div><div class="voice"><div><div class="label">TTS voice</div><select id="voice"><option value="aura-2-amalthea-en">Amalthea — Filipino accent 🇵🇭</option><option value="aura-2-thalia-en">Thalia — clear, confident</option><option value="aura-2-andromeda-en">Andromeda — casual, expressive</option><option value="aura-2-helena-en">Helena — caring, raspy</option><option value="aura-2-asteria-en">Asteria — energetic, knowledgeable</option><option value="aura-2-luna-en">Luna — friendly, natural</option></select></div><div><div class="label">Format</div><select id="format"><option value="mp3">MP3</option><option value="linear16">Linear16</option></select></div></div></section><div class="controls"><button id="start">🎤 Start listening</button><button id="stop" class="alt" disabled>⏹ Stop</button></div><div class="meter"><i id="meter"></i></div><div id="status" class="status">Ready — enter your Deepgram key and press Start listening.</div><section class="panel" style="margin-top:14px"><div class="label">Transcript</div><div id="transcript" class="transcript">Nothing heard yet.</div></section><div id="debug" class="debug">Flux: idle\nMicrophone: idle\nTTS: idle</div><audio id="audio"></audio></main><script>(()=>{const S='voicechanger.deepgram.key',RATE=16000,PACKET=2560,MAX=64000,RETRY=5000,MAX_RETRY=3,$=x=>document.getElementById(x),key=$('key'),save=$('save'),voice=$('voice'),format=$('format'),start=$('start'),stop=$('stop'),status=$('status'),transcript=$('transcript'),debug=$('debug'),meter=$('meter'),audio=$('audio');key.value=localStorage.getItem(S)||'';let run=false,manual=false,stream,ctx,src,proc,gain,ws,timer,flushTimer,attempt=0,buf=[],bytes=0,carry=new Uint8Array(0),last='',ttsUrl,ttsId=0;function k(){return key.value.trim()||localStorage.getItem(S)||''}function stat(x){status.textContent=x}function log(x){debug.textContent=(debug.textContent+'\n'+x).slice(-6000);debug.scrollTop=debug.scrollHeight}function clearTimer(){if(timer){clearTimeout(timer);timer=null}}function down(a,ir,or){if(ir===or)return a;let r=ir/or,n=Math.floor(a.length/r),o=new Float32Array(n);for(let i=0;i<n;i++){let p=i*r,j=Math.floor(p),f=p-j,x=a[j]||0,y=a[j+1]??x;o[i]=x+(y-x)*f}return o}function pcm(a){let p=new Int16Array(a.length);for(let i=0;i<a.length;i++){let v=Math.max(-1,Math.min(1,a[i]));p[i]=v<0?v*32768:v*32767}return new Uint8Array(p.buffer)}function queue(p){if(!p.length||!run)return;if(ws?.readyState===1){try{ws.send(p.buffer);return}catch{}}let q=p.slice();buf.push(q);bytes+=q.byteLength;while(bytes>MAX&&buf.length)bytes-=buf.shift().byteLength;schedule()}function flush(s){if(ws!==s||s.readyState!==1||!buf.length)return;const p=buf.shift();bytes-=p.byteLength;try{s.send(p.buffer)}catch{buf.unshift(p);bytes+=p.byteLength;return}if(buf.length)flushTimer=setTimeout(()=>flush(s),80)}function schedule(){if(!run||manual||timer||attempt>=MAX_RETRY)return;timer=setTimeout(()=>{timer=null;if(run&&!manual)connect()},RETRY);stat('⏳ Flux disconnected — microphone remains active…')}function closeWS(){const s=ws;ws=null;if(flushTimer){clearTimeout(flushTimer);flushTimer=null}if(s)try{s.close(1000,'client')}catch{}}function connect(){if(!run||manual||!k()||ws&&(ws.readyState===0||ws.readyState===1))return;clearTimer();attempt++;stat('🔌 Connecting to Deepgram Flux…');log('Opening Flux attempt '+attempt+'/'+MAX_RETRY);const url='wss://api.deepgram.com/v2/listen?model=flux-general-en&encoding=linear16&sample_rate=16000&eot_threshold=0.70&eager_eot_threshold=0.50&eot_timeout_ms=7000';let s;try{s=new WebSocket(url,['token',k()])}catch(e){log('WebSocket error: '+e.message);schedule();return}ws=s;s.binaryType='arraybuffer';s.onopen=()=>{if(ws!==s)return;attempt=0;stat('🟢 Flux connected — speak now.');log('Flux connected — URL thresholds used, no Configure message');flush(s)};s.onmessage=e=>{if(ws!==s||typeof e.data!=='string')return;let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='Connected'){log('Connected '+(m.request_id||''));return}if(m.type==='TurnInfo'){let t=(m.transcript||'').trim();if(t)transcript.textContent=t;if(m.event==='Update'||m.event==='TurnResumed'){stat('🎧 Listening…');if(m.event==='TurnResumed')last=''}else if(m.event==='EndOfTurn'&&t&&t!==last){last=t;speak(t)}}if(m.type==='ConfigureFailure'||m.type==='ConfigureSuccess')log('Unexpected Configure response: '+m.type);if(m.type==='Error'||m.type==='FatalError'){log('Flux '+m.type+': '+JSON.stringify(m));try{s.close()}catch{}}};s.onerror=()=>{if(ws===s)log('Flux WebSocket error')};s.onclose=e=>{if(ws!==s)return;ws=null;log('Flux CLOSED code='+e.code+(e.reason?' reason='+e.reason:''));if(run&&!manual)schedule()}}function build(a){let p=pcm(a),m;if(carry.length){m=new Uint8Array(carry.length+p.length);m.set(carry);m.set(p,carry.length)}else m=p;let i=0;while(i+PACKET<=m.length){queue(m.slice(i,i+PACKET));i+=PACKET}carry=m.slice(i)}async function speak(text){if(!run||!k())return;let id=++ttsId;try{stat('🔊 Speaking…');audio.pause();if(ttsUrl)URL.revokeObjectURL(ttsUrl);const q='https://api.deepgram.com/v1/speak?model='+encodeURIComponent(voice.value)+(format.value==='mp3'?'&encoding=mp3':'&encoding=linear16&sample_rate=24000');let r=await fetch(q,{method:'POST',headers:{Authorization:'Token '+k(),'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error('TTS HTTP '+r.status);let b=await r.blob();if(id!==ttsId||!run)return;ttsUrl=URL.createObjectURL(b);audio.src=ttsUrl;audio.onended=()=>{if(id===ttsId&&run)stat('🎧 Listening…');if(ttsUrl){URL.revokeObjectURL(ttsUrl);ttsUrl=null}};await audio.play()}catch(e){log('TTS error: '+e.message)}}async function begin(){if(run)return;if(!k())return stat('Enter a Deepgram API key first.');manual=false;attempt=0;buf=[];bytes=0;carry=new Uint8Array(0);last='';try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:false,autoGainControl:false}});ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await ctx.resume();src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);run=true;start.disabled=true;stop.disabled=false;transcript.textContent='Listening…';log('Microphone started — no Flux Configure control is sent');connect();proc.onaudioprocess=e=>{if(!run)return;let a=e.inputBuffer.getChannelData(0),sum=0;for(let i=0;i<a.length;i++)sum+=a[i]*a[i];meter.style.width=Math.min(100,Math.max(1,Math.sqrt(sum/a.length)*420))+'%';build(down(a,ctx.sampleRate,RATE))}}catch(e){log('Start error: '+e.message);end()}}function end(){manual=true;run=false;clearTimer();if(flushTimer)clearTimeout(flushTimer);closeWS();ttsId++;audio.pause();if(ttsUrl){URL.revokeObjectURL(ttsUrl);ttsUrl=null}if(proc){proc.onaudioprocess=null;try{proc.disconnect()}catch{}proc=null}if(src){try{src.disconnect()}catch{}src=null}if(gain){try{gain.disconnect()}catch{}gain=null}if(ctx){try{ctx.close()}catch{}ctx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}buf=[];bytes=0;meter.style.width='0';start.disabled=false;stop.disabled=true;stat('Stopped.')}save.onclick=()=>{let v=key.value.trim();if(!v)return stat('Enter a Deepgram API key first.');localStorage.setItem(S,v);stat('API key saved locally.')};start.onclick=begin;stop.onclick=end;window.addEventListener('online',()=>{if(run&&!ws)schedule()});document.addEventListener('visibilitychange',()=>{if(run&&document.visibilityState==='visible'){ctx?.resume().catch(()=>{});if(!ws)schedule()}});window.addEventListener('beforeunload',end)})()</script></body></html>
