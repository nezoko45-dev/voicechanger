<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceChanger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="title">🎙️ VoiceChanger</div>
    <div class="sub">Microphone → AssemblyAI Universal-3.5 Pro WebSocket</div>
    <div class="controls">
      <button id="start">🎤 Start</button>
      <button id="stop" class="alt" disabled>⏹ Stop</button>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div id="status" class="status">Ready — press Start.</div>
    <div class="grid">
      <section class="panel"><div class="label">Transcript</div><div id="transcript" class="text">—</div></section>
      <section class="panel"><div class="label">Voice</div><div id="voice" class="text">Waiting…</div></section>
    </div>
    <div id="debug" class="debug">WebSocket: idle</div>
    <div class="note">Uses a short-lived AssemblyAI token from the Supabase Edge Function. Your permanent AssemblyAI API key is never sent to the browser.</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
