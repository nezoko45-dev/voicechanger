<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepgram Flux + Aura TTS + Tone.js</title>
<script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
<style>
body{margin:0;background:#080b11;color:#fff;font:16px Arial}main{max-width:650px;margin:40px auto;padding:20px}.card{background:#121824;border:1px solid #303a4d;border-radius:18px;padding:24px}
input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 14px;background:#080d15;color:#fff;border:1px solid #40506a;border-radius:10px}
button{padding:13px 18px;border:0;border-radius:10px;background:#765cff;color:white;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.45}.danger{background:#a43d55}.row{display:flex;align-items:center;gap:12px;margin:14px 0}.row input{margin:0}.box{margin-top:14px;padding:13px;background:#080d15;border-radius:10px;white-space:pre-wrap}
</style></head><body><main><div class="card">
<h1>Flux + Deepgram TTS</h1><p>Deepgram Flux STT → Deepgram Aura TTS → Tone.js pitch</p>
<label>Deepgram API key / temporary token</label><input id="key" type="password" placeholder="Paste Deepgram key or token">
<label>Pitch: <span id="pitchValue">1.00x</span></label>
<div class="row"><input id="pitch" type="range" min="0.70" max="1.50" step="0.01" value="1"></div>
<button id="start">Start listening</button><button id="stop" class="danger" disabled>Stop</button>
<div id="status" class="box">Ready.</div><div id="transcript" class="box">—</div>
</div></main>
<script>
(function(){
"use strict";
var running=false,ctx=null,mic=null,proc=null,stt=null,player=null,sourceNode=null,queue=[],busy=false,last="",audioToken=0;
function $(x){return document.getElementById(x)}
function status(x){$("status").textContent=x}
function clean(x){var a=x.trim().split(/\s+/),o=[];for(var i=0;i<a.length;i++){var c=a[i],p=o[o.length-1]||"";if(c.replace(/[.,!?;:]+$/,"").toLowerCase()===p.replace(/[.,!?;:]+$/,"").toLowerCase())continue;o.push(c)}return o.join(" ")}
function sentence(x){var m=x.match(/^\s*(.+?[.!?](?:["'”’)]*)?)(?:\s|$)/);return m?m[1].trim():""}
function b64(b){var x=atob(b),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
function down(a,r){var q=r/16000,n=Math.floor(a.length/q),o=new Int16Array(n);for(var i=0;i<n;i++){var p=i*q,j=Math.floor(p),f=p-j,x=(a[j]||0)+((a[j+1]||a[j]||0)-(a[j]||0))*f;o[i]=Math.max(-32768,Math.min(32767,Math.round(x*32767)))}return o.buffer}
function pcm(bytes){
 if(!ctx||!running)return Promise.resolve();
 var n=bytes.byteLength-bytes.byteLength%2;if(n<4)throw Error("TTS returned no usable audio");
 var pcm=new Int16Array(bytes.buffer,bytes.byteOffset,n/2),f=new Float32Array(pcm.length);
 for(var i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;
 var buf=ctx.createBuffer(1,f.length,24000);buf.copyToChannel(f,0);
 var src=ctx.createBufferSource();src.buffer=buf;
 var gain=ctx.createGain();gain.gain.value=1;
 src.connect(gain);gain.connect(ctx.destination);sourceNode=gain;
 var pitch=parseFloat($("pitch").value);src.playbackRate.value=pitch;
 status("Deepgram TTS playing • pitch "+pitch.toFixed(2)+"x");
 return new Promise(function(resolve){
   var token=++audioToken;
   src.onended=function(){if(token===audioToken)resolve()};
   src.start();
 });
}
async function tts(text){
 var key=$("key").value.trim();if(!key)return;
 busy=true;status("Deepgram Aura TTS generating…");
 try{
  var r=await fetch("https://api.deepgram.com/v1/speak?model=aura-2-thalia-en&encoding=linear16&sample_rate=24000",{
   method:"POST",headers:{"Authorization":"Token "+key,"Content-Type":"application/json"},
   body:JSON.stringify({text:text})
  });
  if(!r.ok)throw Error("Deepgram TTS "+r.status+": "+await r.text());
  await pcm(new Uint8Array(await r.arrayBuffer()));
 }catch(e){status("TTS error: "+e.message)}
 busy=false;next();
}
function speak(x){queue.push(x);next()}
function next(){if(busy||!queue.length||!running)return;tts(queue.shift())}
function flux(key){
 return new Promise(function(resolve,reject){
  var q=new URLSearchParams({model:"flux-general-en",encoding:"linear16",sample_rate:"16000"});
  stt=new WebSocket("wss://api.deepgram.com/v2/listen?"+q,["token",key]);
  stt.onopen=function(){status("Flux connected — listening continuously.");resolve()};
  stt.onerror=function(){reject(Error("Deepgram Flux WebSocket failed"))};
  stt.onclose=function(){if(running)status("Flux disconnected.")};
  stt.onmessage=function(e){
   var m;try{m=JSON.parse(e.data)}catch(_){return}
   if(m.type==="TurnInfo"){
    var t=clean(String(m.transcript||""));if(!t)return;
    var s=sentence(t);
    if(s){s=clean(s);var id=s.toLowerCase().replace(/\s+/g," ");if(id!==last){last=id;$("transcript").textContent=s;speak(s)}}
    else $("transcript").textContent=t;
   }
   if(m.type==="Error")status("Flux error: "+(m.description||"Unknown error"));
  };
 })
}
async function start(){
 if(running)return;var key=$("key").value.trim();if(!key){status("Enter your Deepgram key or temporary token.");$("key").focus();return}
 $("start").disabled=true;$("stop").disabled=false;running=true;queue=[];last="";
 try{
  await Tone.start();
  ctx=new AudioContext({latencyHint:"interactive"});await ctx.resume();
  mic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  await flux(key);
  var src=ctx.createMediaStreamSource(mic);proc=ctx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess=function(e){if(running&&stt&&stt.readyState===1)stt.send(down(e.inputBuffer.getChannelData(0),ctx.sampleRate))};
  var mute=ctx.createGain();mute.gain.value=0;src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  status("RUNNING — Flux STT + Deepgram Aura TTS + Tone.js.");
 }catch(e){stop();status("Start failed: "+e.message)}
}
function stop(){
 running=false;queue=[];busy=false;last="";audioToken++;
 try{if(stt&&stt.readyState===1)stt.send(JSON.stringify({type:"CloseStream"}))}catch(_){}
 try{if(proc)proc.disconnect()}catch(_){}
 try{if(mic)mic.getTracks().forEach(function(t){t.stop()})}catch(_){}
 try{if(ctx)ctx.close()}catch(_){}
 try{if(stt)stt.close()}catch(_){}
 stt=null;proc=null;mic=null;ctx=null;
 $("start").disabled=false;$("stop").disabled=true;status("Stopped. Ready.")
}
$("pitch").oninput=function(){$("pitchValue").textContent=parseFloat(this.value).toFixed(2)+"x"};
$("start").onclick=start;$("stop").onclick=stop;
})();
</script></body></html>
