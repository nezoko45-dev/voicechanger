<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenVoice V2 Clone</title>
<style>
body{margin:0;background:#080b11;color:#fff;font:16px Arial}main{max-width:620px;margin:50px auto;padding:20px}
.card{background:#121824;border:1px solid #303a4d;border-radius:18px;padding:26px}
input{width:100%;box-sizing:border-box;padding:13px;margin:10px 0 16px;background:#080d15;color:#fff;border:1px solid #40506a;border-radius:10px}
button{padding:13px 20px;border:0;border-radius:10px;background:#765cff;color:#fff;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.45;cursor:not-allowed}.box{margin-top:14px;padding:13px;background:#080d15;border-radius:10px;white-space:pre-wrap}
small{color:#aeb8c9;line-height:1.55}
</style></head><body><main><div class="card">
<h1>OpenVoice V2 Voice Clone</h1>
<p>Reference WAV → reusable OpenVoice voice embedding.</p>
<input id="voice" type="file" accept=".wav,audio/wav">
<button id="clone" disabled>Clone this voice</button>
<div id="status" class="box">Choose a WAV file.</div>
<div class="box"><small>No Flask, no web server, no external API. This page only prepares the selected WAV for the local clone program.</small></div>
</div></main>
<script>
(function(){
"use strict";
var voice=document.getElementById("voice"),btn=document.getElementById("clone"),status=document.getElementById("status");
function setStatus(s){status.textContent=s}
voice.onchange=function(){
 btn.disabled=!voice.files.length;
 setStatus(voice.files.length?"Ready: "+voice.files[0].name:"Choose a WAV file.");
};
btn.onclick=function(){
 if(!voice.files.length)return;
 setStatus("Reference selected.\nRun clone.bat to process this WAV with OpenVoice V2.");
};
})();
</script></body></html>
