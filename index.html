<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceChanger — Deepgram Flux</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#25143c,#09070d 55%);color:#fff;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:rgba(18,15,25,.96);border:1px solid #3b3048;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}.logo{font-size:34px;font-weight:800}.sub{color:#aaa;margin:6px 0 22px}.row{display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}button.secondary{background:#292330}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#15121b;color:#bdb5c8}.panel{margin-top:18px;padding:16px;border:1px solid #302837;border-radius:16px;background:#100d15}.label{font-size:12px;color:#8f8799;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.text{min-height:30px;font-size:18px}.meter{height:8px;background:#28232e;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#a855f7;transition:width .08s}.hint{color:#888;font-size:13px;margin-top:18px;line-height:1.5}.api{margin-top:18px}.api summary{cursor:pointer;font-weight:700;padding:4px 0}.api-grid{display:grid;gap:12px;margin-top:14px}.api-grid label{font-size:12px;color:#aaa}.api-grid input{width:100%;margin-top:6px;background:#0b0910;color:#fff;border:1px solid #3b3048;border-radius:10px;padding:12px;font-size:14px}.api-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.small{padding:10px 14px;font-size:14px}.saved{font-size:12px;color:#9f8daf;margin-top:8px}
</style>
</head>
<body>
<main class="card">
<div class="logo">🎙️ VoiceChanger</div><div class="sub">🎤 Live microphone → Deepgram Flux → 📝 Live transcript</div>
<div class="row"><button id="start">🎤 Start Deepgram Flux</button><button id="stop" class="secondary" disabled>⏹ Stop</button></div>
<div class="meter"><div id="bar" class="bar"></div></div><div id="status" class="status">Ready.</div>
<div class="panel"><div class="label">Live transcript</div><div id="transcript" class="text">—</div></div>
<details class="api" id="api"><summary>🔑 Deepgram API key</summary><div class="api-grid">
<label>Deepgram API key<input id="deepgramKey" type="password" autocomplete="off" placeholder="Enter Deepgram API key"></label>
</div><div class="api-actions"><button id="saveKeys" class="small">💾 Save for this session</button><button id="clearKeys" class="secondary small">🗑 Clear</button></div><div id="saved" class="saved">Key is held in this browser session.</div></details>
<div class="hint">Deepgram Flux only. No OpenRouter, Fish Audio, or other API is used.</div>
</main>
<script>
let running=false,stream=null,audioContext=null,processor=null,source=null,fluxSocket=null,reconnectTimer=null,reconnectAttempt=0;
const $=id=>document.getElementById(id),start=$('start'),stop=$('stop'),status=$('status'),transcript=$('transcript'),bar=$('bar'),deepgramKey=$('deepgramKey'),saved=$('saved'),api=$('api');
let key='';
function loadKey(){try{sessionStorage.removeItem('voicechanger_keys');sessionStorage.removeItem('voicechanger_openrouter');sessionStorage.removeItem('voicechanger_fish');key=sessionStorage.getItem('voicechanger_deepgram')||''}catch{};deepgramKey.value='';saved.textContent=key?'🔒 Session key loaded.':'Key is not saved.'}
$('saveKeys').onclick=()=>{const d=deepgramKey.value.trim();if(!d){saved.textContent='⚠️ Enter your Deepgram API key first.';return}key=d;sessionStorage.setItem('voicechanger_deepgram',d);deepgramKey.value='';saved.textContent='🔒 Saved in session memory. Input cleared.'};
$('clearKeys').onclick=()=>{key='';sessionStorage.removeItem('voicechanger_deepgram');sessionStorage.removeItem('voicechanger_keys');sessionStorage.removeItem('voicechanger_openrouter');sessionStorage.removeItem('voicechanger_fish');deepgramKey.value='';saved.textContent='🗑 Session key cleared.'};loadKey();
function setStatus(t,p=0){status.textContent=t;bar.style.width=p+'%'}
start.onclick=async()=>{try{if(!key){api.open=true;saved.textContent='⚠️ Save your Deepgram API key first.';return}stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});running=true;reconnectAttempt=0;start.disabled=true;stop.disabled=false;setStatus('🔌 Connecting to Deepgram Flux…',20);connectFlux()}catch(e){stopLive();setStatus('❌ Microphone error: '+e.message,0)}};
stop.onclick=()=>stopLive();
function connectFlux(){if(!running)return;clearTimeout(reconnectTimer);const url='wss://api.deepgram.com/v2/listen?model=flux-general-en&encoding=linear16&sample_rate=16000';try{fluxSocket=new WebSocket(url,['token',key]);}catch(e){setStatus('❌ Could not open Deepgram Flux: '+e.message,0);scheduleReconnect();return}
fluxSocket.binaryType='arraybuffer';fluxSocket.onopen=()=>{reconnectAttempt=0;setStatus('🎤 Deepgram Flux connected — listening live…',100);startAudioStream()};
fluxSocket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='TurnInfo'&&d.transcript){transcript.textContent=d.transcript;setStatus('📝 Flux turn detected',100)}else if(d.type==='Connected'){setStatus('🎤 Deepgram Flux connected — listening live…',100)}else if(d.type==='Error'){setStatus('❌ Flux error: '+(d.description||d.code||'Unknown error'),0)}}catch{}};
fluxSocket.onerror=()=>setStatus('⚠️ Deepgram Flux socket error — reconnecting…',20);
fluxSocket.onclose=e=>{if(!running)return;setStatus('🔄 Flux disconnected ('+e.code+') — reconnecting…',15);cleanupAudio();scheduleReconnect()};
}
function scheduleReconnect(){if(!running)return;clearTimeout(reconnectTimer);const delay=Math.min(30000,Math.max(500,1000*Math.pow(2,reconnectAttempt++)));reconnectTimer=setTimeout(()=>{if(running){setStatus('🔌 Reconnecting to Deepgram Flux…',25);connectFlux()}},delay)}
function startAudioStream(){if(!running||!stream||!fluxSocket)return;if(audioContext){try{audioContext.close()}catch{}}audioContext=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});source=audioContext.createMediaStreamSource(stream);processor=audioContext.createScriptProcessor(1280,1,1);processor.onaudioprocess=e=>{if(!running||!fluxSocket||fluxSocket.readyState!==WebSocket.OPEN)return;const input=e.inputBuffer.getChannelData(0);if(!input.length)return;const pcm=new Int16Array(input.length);for(let i=0;i<input.length;i++)pcm[i]=Math.max(-1,Math.min(1,input[i]))*32767;try{fluxSocket.send(pcm.buffer)}catch{}};source.connect(processor);processor.connect(audioContext.destination)}
function cleanupAudio(){if(processor){try{processor.disconnect()}catch{}processor=null}if(source){try{source.disconnect()}catch{}source=null}if(audioContext){try{audioContext.close()}catch{}audioContext=null}}
function stopLive(){running=false;clearTimeout(reconnectTimer);cleanupAudio();if(fluxSocket){try{if(fluxSocket.readyState===WebSocket.OPEN)fluxSocket.send(JSON.stringify({type:'CloseStream'}));fluxSocket.close(1000,'User stopped')}catch{}fluxSocket=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}start.disabled=false;stop.disabled=true;setStatus('Ready.',0)}
</script>
</body></html>
