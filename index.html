<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Female Voice Changer</title><style>
body{margin:0;background:#111;color:#eee;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(680px,92vw);background:#1b1b1f;border:1px solid #333;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}h1{margin:0 0 6px;font-size:25px}.sub{color:#aaa;margin-bottom:22px}label{display:block;margin:14px 0 6px;color:#bbb}select,input[type=range],button{width:100%;box-sizing:border-box}select{background:#101014;color:#fff;border:1px solid #444;border-radius:10px;padding:11px}input[type=file]{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:20px}button{border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}.start{background:#f0a6ff;color:#171019}.stop{background:#333;color:#fff}.status{margin-top:18px;padding:12px;border-radius:10px;background:#101014;color:#bbb}.ok{color:#9cffbd}.bad{color:#ff8f8f}small{color:#888}</style></head><body><div class="card"><h1>🎀 Local Female Voice Changer</h1><div class="sub">HTML/JS control panel → native Windows audio → local Hugging Face Seed-VC</div><label>Female reference voice</label><input id="ref" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*"><small>Use a clean 3–10 second female speech clip. It stays local.</small><div class="row"><div><label>Microphone</label><select id="input"></select></div><div><label>Output</label><select id="output"></select></div></div><label>Conversion steps</label><input id="steps" type="range" min="4" max="12" value="8"><div class="row"><small>4 = lower latency</small><small style="text-align:right">12 = more processing</small></div><div class="actions"><button class="start" id="start">Start Voice Changer</button><button class="stop" id="stop">Stop</button></div><div class="status" id="status">Loading local model…</div></div><script src="/app.js"></script></body></html>
