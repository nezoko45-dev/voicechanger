<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Voice Changer</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:16px;background:#111;color:#eee}
section{background:#1b1b1b;padding:20px;border-radius:14px;margin-bottom:16px}
label{display:block;margin-top:14px}select,input,button{width:100%;padding:10px;margin-top:6px;box-sizing:border-box}
button{cursor:pointer;font-weight:700}.status{text-align:center;margin-top:14px}
</style>
</head>
<body>
<section>
<h1>Web Voice Changer</h1>
<p>Local Chrome audio processing. No external libraries or services.</p>
<label>Microphone</label>
<select id="mic"></select>
<label>Pitch: <span id="pitchText">0</span> semitones</label>
<input id="pitch" type="range" min="-12" max="12" step="0.1" value="0">
<label>Volume: <span id="gainText">100</span>%</label>
<input id="gain" type="range" min="0" max="200" value="100">
<button id="start">Start</button>
<button id="stop" disabled>Stop</button>
<div id="status" class="status">Ready</div>
</section>
<script>
"use strict";
const mic=document.getElementById("mic");
const pitch=document.getElementById("pitch");
const gain=document.getElementById("gain");
const startButton=document.getElementById("start");
const stopButton=document.getElementById("stop");
const status=document.getElementById("status");
let audioContext=null;
let stream=null;
let source=null;
let shifter=null;
let running=false;

function setStatus(text){status.textContent=text;}

async function loadMicrophones(){
  if(!navigator.mediaDevices){setStatus("Microphone API unavailable.");return;}
  const devices=await navigator.mediaDevices.enumerateDevices();
  mic.innerHTML="";
  const inputs=devices.filter(function(d){return d.kind==="audioinput";});
  inputs.forEach(function(d,i){
    const option=document.createElement("option");
    option.value=d.deviceId;
    option.textContent=d.label||("Microphone "+(i+1));
    mic.appendChild(option);
  });
  if(inputs.length===0){
    const option=document.createElement("option");
    option.value="";
    option.textContent="Default microphone";
    mic.appendChild(option);
  }
}

function createProcessor(context){
  const processor=context.createScriptProcessor(1024,1,1);
  let phase=0;
  processor.onaudioprocess=function(event){
    const input=event.inputBuffer.getChannelData(0);
    const output=event.outputBuffer.getChannelData(0);
    const ratio=Math.pow(2,Number(pitch.value)/12);
    const level=Number(gain.value)/100;
    for(let i=0;i<output.length;i++){
      const index=Math.min(input.length-1,Math.floor(i*ratio+phase));
      output[i]=input[index]*level;
    }
    phase=(phase+input.length*ratio)%input.length;
  };
  return processor;
}

async function start(){
  if(running)return;
  try{
    const constraints={audio:{
      channelCount:1,
      echoCancellation:false,
      noiseSuppression:false,
      autoGainControl:false
    }};
    if(mic.value)constraints.audio.deviceId={exact:mic.value};
    stream=await navigator.mediaDevices.getUserMedia(constraints);
    audioContext=new AudioContext();
    await audioContext.resume();
    source=audioContext.createMediaStreamSource(stream);
    shifter=createProcessor(audioContext);
    source.connect(shifter);
    shifter.connect(audioContext.destination);
    running=true;
    startButton.disabled=true;
    stopButton.disabled=false;
    setStatus("Live — speak normally.");
  }catch(error){
    stop();
    setStatus("Could not start: "+error.message);
  }
}

function stop(){
  running=false;
  if(source)source.disconnect();
  if(shifter)shifter.disconnect();
  if(stream)stream.getTracks().forEach(function(track){track.stop();});
  if(audioContext)audioContext.close();
  source=null;
  shifter=null;
  stream=null;
  audioContext=null;
  startButton.disabled=false;
  stopButton.disabled=true;
}

pitch.addEventListener("input",function(){document.getElementById("pitchText").textContent=Number(pitch.value).toFixed(1);});
gain.addEventListener("input",function(){document.getElementById("gainText").textContent=gain.value;});
startButton.addEventListener("click",start);
stopButton.addEventListener("click",function(){stop();setStatus("Stopped.");});
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener){
  navigator.mediaDevices.addEventListener("devicechange",loadMicrophones);
}
loadMicrophones().catch(function(error){setStatus("Could not list microphones: "+error.message);});
</script>
</body>
</html>
