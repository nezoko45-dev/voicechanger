<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local WAV Voice Agent</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#111;color:#eee;font:15px system-ui,Segoe UI,sans-serif;display:grid;place-items:center}
    .card{width:min(680px,92vw);padding:28px;border:1px solid #333;border-radius:18px;background:#191919;box-shadow:0 20px 60px #0008}
    h1{margin:0 0 6px;font-size:25px}.sub{color:#aaa;margin:0 0 24px}
    label{display:block;color:#aaa;font-size:13px;margin:14px 0 6px}
    select,input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a3a;background:#101010;color:#fff}
    button{margin-top:18px;cursor:pointer;font-weight:700;background:#292929}
    button:disabled{opacity:.45;cursor:not-allowed}
    #start{background:#6b2cff;border-color:#7b43ff}
    .status{margin-top:18px;padding:12px;border-radius:10px;background:#101010;color:#aaa;min-height:44px}
    .heard{margin-top:14px;padding:14px;border-radius:10px;background:#101010;min-height:60px}
    .heard strong{display:block;color:#8f8f8f;font-size:12px;margin-bottom:5px}
    .small{font-size:12px;color:#777;margin-top:12px;line-height:1.5}
  </style>
</head>
<body>
<main class="card">
  <h1>Local WAV Voice Agent</h1>
  <p class="sub">Local STT → local agent → PocketTTS voice clone</p>

  <label>Reference voice</label>
  <input id="reference" value="Recording (10).wav" readonly>

  <label>Microphone</label>
  <select id="mic"><option>Loading microphones…</option></select>

  <label>Output</label>
  <select id="output"><option>Default output</option></select>

  <button id="start">START</button>
  <button id="stop" disabled>STOP</button>

  <div class="status" id="status">Checking local engine…</div>
  <div class="heard"><strong>HEARD</strong><span id="heard">—</span></div>
  <div class="small">Everything after START is processed by the local server. The reference WAV stays in this repo and is used by PocketTTS for voice cloning.</div>
</main>
<script src="app.js"></script>
</body>
</html>
