<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceChanger</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#25143c,#09070d 55%);color:#fff;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:rgba(18,15,25,.94);border:1px solid #3b3048;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}.logo{font-size:34px;font-weight:800}.sub{color:#aaa;margin:6px 0 26px}.row{display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}button.secondary{background:#292330}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#15121b;color:#bdb5c8}.panel{margin-top:18px;padding:16px;border:1px solid #302837;border-radius:16px;background:#100d15}.label{font-size:12px;color:#8f8799;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.text{min-height:30px;font-size:18px}.meter{height:8px;background:#28232e;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#a855f7;transition:width .08s}.hint{color:#888;font-size:13px;margin-top:18px;line-height:1.5}audio{width:100%;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">🎙️ VoiceChanger</div>
<div class="sub">🎤 Microphone → Deepgram → Fish Audio → 🔊 Voice</div>
<div class="row"><button id="start">🎤 Start recording</button><button id="stop" class="secondary" disabled>⏹ Stop & convert</button></div>
<div class="meter"><div id="bar" class="bar"></div></div>
<div id="status" class="status">Ready.</div>
<div class="panel"><div class="label">Transcript</div><div id="transcript" class="text">—</div></div>
<div class="panel"><div class="label">Converted voice</div><audio id="audio" controls></audio></div>
<div class="hint">The page records your microphone in the browser. A Netlify serverless function securely sends the audio to Deepgram and the text to Fish Audio, so your API keys never appear in the browser.</div>
</main>
<script>
let recorder=null,chunks=[];
const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),transcript=document.getElementById('transcript'),audio=document.getElementById('audio'),bar=document.getElementById('bar');
start.onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';recorder=new MediaRecorder(stream,{mimeType:type});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());await convert(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}))};recorder.start();start.disabled=true;stop.disabled=false;status.textContent='🎤 Listening...';bar.style.width='100%'}catch(e){status.textContent='❌ Microphone error: '+e.message}};
stop.onclick=()=>{if(recorder&&recorder.state!=='inactive'){recorder.stop();stop.disabled=true;start.disabled=false;status.textContent='⏳ Sending to Deepgram...';bar.style.width='55%'}};
async function convert(blob){try{const r=await fetch('/.netlify/functions/convert',{method:'POST',headers:{'Content-Type':blob.type||'audio/webm'},body:blob});const data=await r.json();if(!r.ok)throw new Error(data.error||'Conversion failed');transcript.textContent=data.transcript||'—';if(data.audio){audio.src='data:audio/mpeg;base64,'+data.audio;audio.play().catch(()=>{});}status.textContent='✅ Voice converted!';bar.style.width='100%'}catch(e){status.textContent='❌ '+e.message;bar.style.width='0%'}}
</script>
</body>
</html>
