<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepgram WebSocket STT</title>
<style>
body{margin:0;background:#080b11;color:#fff;font:16px Arial,sans-serif}
main{max-width:600px;margin:50px auto;padding:20px}
.card{background:#121824;border:1px solid #303a4d;border-radius:18px;padding:24px}
input{width:100%;padding:13px;margin:8px 0 16px;box-sizing:border-box;background:#080d15;color:#fff;border:1px solid #40506a;border-radius:10px}
button{padding:14px 20px;border:0;border-radius:10px;background:#765cff;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#stop{background:#a43d55;margin-left:8px}
#status,#transcript{margin-top:16px;padding:13px;background:#080d15;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<main><div class="card">
<h1>Deepgram WebSocket STT</h1>
<p>Chrome microphone → Deepgram Flux WebSocket. Continuous listening only.</p>
<label>Deepgram API key / temporary token</label>
<input id="key" type="password" placeholder="Paste your Deepgram key or token">
<button id="start" type="button">Start listening</button>
<button id="stop" type="button" disabled>Stop</button>
<div id="status">Ready.</div>
<div id="transcript">—</div>
</div></main>

<script>
(function(){
"use strict";
var running=false,ctx=null,stream=null,source=null,processor=null,stt=null;

function $(id){return document.getElementById(id)}
function status(s){$("status").textContent=s}
function auth(k){return ["token",k]}

function downsample(a,rate){
  var ratio=rate/16000,n=Math.floor(a.length/ratio),o=new Int16Array(n);
  for(var i=0;i<n;i++){
    var p=i*ratio,j=Math.floor(p),f=p-j;
    var x=(a[j]||0)+((a[j+1]||a[j]||0)-(a[j]||0))*f;
    o[i]=Math.max(-32768,Math.min(32767,Math.round(x*32767)));
  }
  return o.buffer;
}

function connectSTT(key){
  return new Promise(function(resolve,reject){
    var q=new URLSearchParams({
      model:"flux-general-en",
      encoding:"linear16",
      sample_rate:"16000"
    });

    stt=new WebSocket(
      "wss://api.deepgram.com/v2/listen?"+q.toString(),
      auth(key)
    );

    stt.binaryType="arraybuffer";

    stt.onopen=function(){
      status("Connected to Deepgram WebSocket — listening continuously.");
      resolve();
    };

    stt.onmessage=function(e){
      if(typeof e.data!=="string")return;
      var m;
      try{m=JSON.parse(e.data)}catch(_){return}

      if(m.type==="Connected"){
        status("Deepgram Flux WebSocket connected.");
      }

      if(m.type==="TurnInfo"){
        var text=String(m.transcript||"").trim();
        if(text)$("transcript").textContent=text;
      }

      if(m.type==="Error"){
        status("Deepgram error: "+(m.description||"Unknown error"));
      }
    };

    stt.onerror=function(){
      reject(new Error("Deepgram WebSocket connection failed"));
    };

    stt.onclose=function(){
      if(running)status("Deepgram WebSocket disconnected.");
    };
  });
}

async function start(){
  if(running)return;

  var key=$("key").value.trim();
  if(!key){
    status("Enter your Deepgram API key or temporary token first.");
    $("key").focus();
    return;
  }

  $("start").disabled=true;
  $("stop").disabled=false;
  running=true;

  try{
    ctx=new AudioContext({latencyHint:"interactive"});
    await ctx.resume();

    stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        channelCount:1,
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });

    source=ctx.createMediaStreamSource(stream);

    await connectSTT(key);

    processor=ctx.createScriptProcessor(4096,1,1);

    processor.onaudioprocess=function(e){
      if(!running||!stt||stt.readyState!==WebSocket.OPEN)return;
      stt.send(
        downsample(
          e.inputBuffer.getChannelData(0),
          ctx.sampleRate
        )
      );
    };

    var mute=ctx.createGain();
    mute.gain.value=0;

    source.connect(processor);
    processor.connect(mute);
    mute.connect(ctx.destination);

    status("RUNNING — continuous Deepgram Flux WebSocket STT.");
  }catch(e){
    stop();
    status("Start failed: "+(e.message||e));
  }
}

function stop(){
  running=false;

  try{
    if(stt&&stt.readyState===WebSocket.OPEN)
      stt.send(JSON.stringify({type:"CloseStream"}));
  }catch(_){}

  try{if(processor)processor.disconnect()}catch(_){}
  try{if(source)source.disconnect()}catch(_){}
  try{if(stream)stream.getTracks().forEach(function(t){t.stop()})}catch(_){}
  try{if(ctx)ctx.close()}catch(_){}
  try{if(stt)stt.close()}catch(_){}

  stt=null;
  processor=null;
  source=null;
  stream=null;
  ctx=null;

  $("start").disabled=false;
  $("stop").disabled=true;
  status("Stopped. Ready.");
}

window.addEventListener("DOMContentLoaded",function(){
  $("start").disabled=false;
  $("stop").disabled=true;
  $("start").onclick=start;
  $("stop").onclick=stop;
});
})();
</script>
</body>
</html>
