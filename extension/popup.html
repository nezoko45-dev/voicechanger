<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fish Audio Call Again</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><div class="mark">↻</div><div><h1>Call Again</h1><p>Fish Audio helper</p></div></header>
    <section class="panel">
      <div class="toggle-row">
        <div><strong>Auto-click</strong><p>Click Call again as each result becomes ready.</p></div>
        <label class="switch"><input id="enabled" type="checkbox"><span></span></label>
      </div>
    </section>
    <section class="panel">
      <label for="delay">Click delay <span id="delayValue">1.0 s</span></label>
      <input id="delay" type="range" min="0" max="5" step="0.5" value="1">
      <div class="range-labels"><span>Instant</span><span>5 seconds</span></div>
      <button id="once">Click once</button>
    </section>
    <div id="status" role="status" aria-live="polite">Checking active tab…</div>
    <footer>Only automates the visible Fish Audio button.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
