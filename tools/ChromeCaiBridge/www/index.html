<!doctype html><meta charset="utf-8"><title>Chrome Speech Bridge</title><style>body{font:16px system-ui;max-width:720px;margin:30px auto}button{padding:10px}#txt{white-space:pre-wrap;border:1px solid #aaa;padding:12px;min-height:70px}</style><h2>Chrome Speech → Character.AI</h2><p id="s">Initializing…</p><button id="start">Start listening</button> <button id="stop">Stop</button><div id="txt"></div><script>
const s=document.querySelector('#s'),txt=document.querySelector('#txt');let enabled=true,r=null,delay=700;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function start(){if(!enabled||r||!SR)return;r=new SR();r.continuous=true;r.interimResults=true;r.lang='en-US';r.onstart=()=>{s.textContent='Listening';delay=700};r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal&&t){txt.textContent=t;fetch('/transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})}).catch(()=>s.textContent='Local bridge connection failed');}else interim+=t;}if(interim)s.textContent='Hearing: '+interim;};r.onerror=e=>s.textContent='Recognition error: '+e.error+' (retrying)';r.onend=()=>{r=null;if(enabled){s.textContent='Recognizer ended; restarting…';setTimeout(start,delay);delay=Math.min(delay*1.5,5000)}};try{r.start()}catch{r=null;setTimeout(start,delay)}}
if(!SR)s.textContent='Chrome SpeechRecognition unavailable. Open this page in desktop Chrome.';
document.querySelector('#start').onclick=()=>{enabled=true;start()};document.querySelector('#stop').onclick=()=>{enabled=false;if(r){r.onend=null;r.stop();r=null}s.textContent='Stopped'};start();
</script>
