<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome WAV Voice Changer</title><style>body{font-family:system-ui;background:#0b0d12;color:#eee;max-width:820px;margin:24px auto;padding:18px}.card{background:#151922;border:1px solid #303644;border-radius:14px;padding:18px;margin:12px 0}button,select,input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #454c5c;background:#0c1017;color:#fff;font:inherit}button{cursor:pointer;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:#7657ff}.danger{background:#5a2028}.small{color:#9da6b5;font-size:13px;line-height:1.5}.status{white-space:pre-wrap;background:#080a0e;padding:12px;border-radius:9px;margin-top:10px}.meter{height:8px;background:#252a35;border-radius:9px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#6ee7a0}.ok{color:#7ff0ac}</style></head><body><h1>🎙️ Chrome WAV Voice Changer</h1><p class="small">Chrome-only voice cloning. Your WAV is used as the cloned voice. Speech is transcribed and sent unchanged to the browser TTS engine.</p><div class="card"><label>Voice reference WAV</label><input id="wav" type="file" accept="audio/wav,.wav"><div id="wavName" class="small">No WAV selected</div><button id="loadVoice">LOAD / CLONE WAV</button></div><div class="card"><label>Microphone / Input</label><select id="mic"><option value="">Default microphone</option></select><button id="refresh">REFRESH DEVICES</button><button id="cableOut">USE VB-CABLE OUTPUT AS MIC</button><label>Chrome TTS Output</label><select id="out"><option value="">Default output</option></select><button id="cableIn">SEND TTS TO VB-CABLE INPUT</button></div><div class="card"><div class="row"><button id="start" class="primary">START</button><button id="stop" class="danger" disabled>STOP</button></div><button id="test">TEST CLONED VOICE</button><div class="meter"><i id="meter"></i></div><div id="status" class="status">Ready.</div></div><div class="card"><audio id="audio" controls></audio><div class="small">VRChat routing: Chrome output → CABLE Input; VRChat microphone → CABLE Output.</div></div><script type="module" src="./app.js"></script></body></html>
