<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deepgram SDK Repeat Me</title><style>body{font-family:Arial;background:#111;color:#eee;max-width:850px;margin:auto;padding:24px} .card{background:#1d1d1d;padding:18px;border-radius:12px;margin:12px 0}select,input,button{font:inherit;padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{cursor:pointer;background:#292929;color:#fff;border:1px solid #555;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:12px;background:#080808;border-radius:8px;white-space:pre-wrap;min-height:25px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><h1>🎙️ Deepgram Repeat-Me</h1><div class="card"><label>Temporary Deepgram token</label><input id="token" type="password" placeholder="Paste temporary token"><small>Use a temporary token; never put a permanent API key in this page.</small><label>Voice</label><select id="voice"><option value="flux-alexis-en">flux-alexis-en</option><option value="flux-haley-en">flux-haley-en</option></select><button id="start">START AGENT</button><button id="stop" disabled>STOP</button></div><div class="card"><div class="row"><div><label>🎙️ Microphone</label><select id="input"><option>Refresh devices</option></select><button id="cableOut">Use CABLE Output</button></div><div><label>🔊 Output</label><select id="output"><option>Refresh devices</option></select><button id="cableIn">Use CABLE Input</button></div></div><button id="refresh">Refresh Devices</button></div><div class="card"><div id="status" class="status">Ready.</div></div><div class="card"><strong>Conversation</strong><div id="conversation" class="status"></div></div><script type="module" src="sdk-agent.js"></script></body></html>
