<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepgram Repeat-Me Voice Agent</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,Arial,sans-serif;background:#101010;color:#eee;max-width:900px;margin:0 auto;padding:24px}h1{margin-top:0}.card{background:#1b1b1b;border:1px solid #363636;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:10px 0 5px;font-weight:700}input,select,button{font:inherit}input,select{width:100%;box-sizing:border-box;background:#111;color:#eee;border:1px solid #555;border-radius:8px;padding:10px}button{background:#292929;color:#fff;border:1px solid #666;border-radius:8px;padding:10px 14px;margin:5px 5px 5px 0;cursor:pointer}button:hover{background:#383838}button:disabled{opacity:.45;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{background:#080808;border-radius:8px;padding:12px;min-height:22px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#292929;margin:3px}.transcript{background:#090909;border-radius:8px;padding:12px;min-height:90px;white-space:pre-wrap}.meterbg{height:12px;background:#333;border-radius:99px;overflow:hidden;margin-top:10px}.meter{height:100%;width:0;background:#58e39a}small{opacity:.7}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>🎙️ Deepgram Repeat-Me Agent</h1>
<p>Chrome-only voice agent: Flux STT → repeat-me prompt → Deepgram TTS.</p>
<div class="card">
<label for="token">Temporary Deepgram token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste a short-lived Deepgram token">
<small>For a static Chrome/GitHub Pages page, use a short-lived token. The page does not save it.</small>
<label for="voice">Agent voice</label>
<select id="voice"><option value="flux-kit-en">flux-kit-en</option><option value="flux-alexis-en">flux-alexis-en</option><option value="flux-haley-en">flux-haley-en</option></select>
<button id="start">START AGENT</button><button id="stop" disabled>STOP</button>
</div>
<div class="card">
<div class="row">
<div><label for="input">🎙️ Microphone input</label><select id="input"><option>Refresh devices first</option></select><button id="cableOut">Use CABLE Output</button></div>
<div><label for="output">🔊 TTS output</label><select id="output"><option>Refresh devices first</option></select><button id="cableIn">Use CABLE Input</button></div>
</div>
<button id="refresh">Refresh devices</button>
<div id="deviceStatus"><small>Chrome device permissions may be required before labels appear.</small></div>
</div>
<div class="card">
<div><span class="pill" id="connection">Disconnected</span><span class="pill" id="mode">Idle</span></div>
<div class="meterbg"><div class="meter" id="meter"></div></div>
<div class="status" id="status">Ready.</div>
</div>
<div class="card">
<strong>Conversation</strong>
<div class="transcript" id="transcript"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
