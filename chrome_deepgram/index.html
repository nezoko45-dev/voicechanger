<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deepgram Repeat-Me</title><style>body{font-family:system-ui,Arial;background:#101010;color:#eee;max-width:850px;margin:auto;padding:24px}.card{background:#1b1b1b;border:1px solid #383838;border-radius:14px;padding:18px;margin:14px 0}button,select,input{font:inherit;padding:10px;margin:5px 0}button{background:#292929;color:#fff;border:1px solid #666;border-radius:8px;cursor:pointer}button:disabled{opacity:.45}select,input{background:#111;color:#eee;border:1px solid #555;border-radius:8px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{background:#080808;padding:12px;border-radius:8px;min-height:20px}.transcript{white-space:pre-wrap;background:#080808;padding:12px;border-radius:8px;min-height:100px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>🎙️ Deepgram Repeat-Me</h1><div class="card"><label>Temporary Deepgram token</label><input id="token" type="password" placeholder="Paste temporary token"><small>Never put your permanent API key in this page.</small><br><button id="start">START</button><button id="stop" disabled>STOP</button></div><div class="card grid"><div><label>🎙️ Input</label><select id="input"></select><button id="cableOut">Use CABLE Output</button></div><div><label>🔊 Output</label><select id="output"></select><button id="cableIn">Use CABLE Input</button></div></div><div class="card"><button id="refresh">Refresh devices</button><div id="deviceStatus"></div><div class="status" id="status">Ready.</div></div><div class="card"><strong>Conversation</strong><div class="transcript" id="transcript"></div></div><script type="module" src="./app.js"></script></body></html>
