<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTSLab Fast Dictation</title>
<style>*{box-sizing:border-box}body{font:14px/1.45 system-ui,sans-serif;width:300px;margin:0;padding:16px;background:#111827;color:#eef4ff}h1{font-size:18px;margin:0 0 6px}p{color:#c5cee0;margin:8px 0 14px}button{width:100%;min-height:44px;border:0;border-radius:9px;background:#18a879;color:#041b14;font-weight:750;font-size:14px;cursor:pointer}button.stop{background:#ef6461;color:#250909}button:disabled{opacity:.6}#status{background:#202b3e;border-radius:8px;padding:10px;overflow-wrap:anywhere;margin-top:12px}.small{font-size:12px;color:#a7b4cb;margin-bottom:0}</style></head>
<body><h1>TTSLab Fast Dictation</h1><p>Open the TTSLab chat or model page. Start listening, speak naturally, then press Stop listening to send the transcript automatically.</p><button id="toggle" type="button">▶ Start listening</button><div id="status" role="status" aria-live="polite">Ready.</div><p class="small">No tab switching needed. Pause dictation before closing the TTSLab page.</p><script src="popup.js"></script></body></html>
