<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uberduck Dictation</title><style>body{font:14px system-ui,sans-serif;width:260px;padding:14px;color:#222}h3{margin:0 0 8px}p{line-height:1.5}a{color:#6d28d9}</style></head><body><h3>Uberduck Voice Dictation</h3><p>Open <a href="https://uberduck.ai/" target="_blank">uberduck.ai</a>. A floating microphone control appears on the page.</p><p>Click <b>Start dictation</b>, speak your sentence, then pause. The extension enters your words into the TTS box and can click Generate Speech automatically.</p><label><input id="auto" type="checkbox" checked> Auto-generate after speech</label><script src="popup.js"></script></body></html>
