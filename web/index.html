<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartesia VoiceChanger</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07080c;color:#fff;font:16px system-ui,Arial}main{max-width:900px;margin:auto;padding:30px}.card{background:#11141b;border:1px solid #303541;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:42px;margin:0}.sub,.hint{color:#9da1ad}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{color:#ccc}input,select{display:block;width:100%;margin-top:8px;padding:13px;border-radius:10px;border:1px solid #4b5060;background:#080a0f;color:#fff}button{border:1px solid #555b6d;border-radius:10px;background:#20242e;color:#fff;padding:13px 18px;margin:5px;cursor:pointer;font-weight:700;font-size:15px;opacity:1!important}button.primary{background:#7040db}.danger{background:#7b2937}.status,.log{padding:14px;border-radius:10px;background:#090b10;margin-top:14px;white-space:pre-wrap}.meter{height:10px;background:#252a35;border-radius:99px;overflow:hidden;margin:18px 0}.meter div{height:100%;width:0;background:#9b70ff}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><h1>Cartesia VoiceChanger</h1><p class="sub">Microphone → Cartesia STT → Cartesia TTS → Windows/VB-CABLE</p><div id="status" class="status">Ready.</div><section class="card"><h2>Cartesia</h2><div class="grid"><label>API key<input id="key" type="password" placeholder="Cartesia API key"></label><label>Voice ID<input id="voice" placeholder="Cartesia Voice ID"></label></div></section><section class="card"><h2>Audio</h2><div class="grid"><label>Microphone<select id="mic"><option value="">Default microphone</option></select></label><label>Output<select id="out"><option value="default">Default Windows output</option></select></label></div><button id="refresh">Refresh devices</button><button id="choose">Choose output</button><p id="route" class="hint">For ChilloutVR: browser output = CABLE Input, ChilloutVR microphone = CABLE Output.</p></section><section class="card"><h2>Voice</h2><button id="test" class="primary">🔊 TEST VOICE</button><button id="start" class="primary">🎙 START</button><button id="stop" class="danger">⏹ STOP</button><div class="meter"><div id="bar"></div></div><div id="log" class="log">Press TEST VOICE first.</div></section></main><script>
(()=>{const $=x=>document.getElementById(x),API='https://api.cartesia.ai';let token='',out='default',stream,ctx,src,proc,gain,listening=false,speaking=false,busy=false,parts=[],talk=false,silent=0,talkms=0,last=0;
const set=(s)=>$('status').textContent=s,err=e=>{set('ERROR: '+e.message);$('log').textContent=e.message};
async function auth(){if(token)return token;const k=$('key').value.trim();if(!k)throw Error('Enter your Cartesia API key.');const r=await fetch(API+'/access-token',{method:'POST',headers:{Authorization:'Bearer '+k,'Cartesia-Version':'2026-03-01','Content-Type':'application/json'},body:JSON.stringify({grants:{tts:true,stt:true},expires_in:3600})});const t=await r.text();if(!r.ok)throw Error('Cartesia token '+r.status+': '+t.slice(0,300));token=JSON.parse(t).token;if(!token)throw Error('No Cartesia token returned.');return token}
async function speak(text){const v=$('voice').value.trim();if(!v)throw Error('Enter your Cartesia Voice ID.');const r=await fetch(API+'/tts/bytes',{method:'POST',headers:{Authorization:'Bearer '+await auth(),'Cartesia-Version':'2026-03-01','Content-Type':'application/json'},body:JSON.stringify({model_id:'sonic-3.5',transcript:text.slice(0,2000),voice:{mode:'id',id:v},language:'en',output_format:{container:'wav',encoding:'pcm_s16le',sample_rate:48000},generation_config:{volume:1,speed:1}})});if(!r.ok)throw Error('TTS '+r.status+': '+(await r.text()).slice(0,400));const b=await r.arrayBuffer();if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const audio=await ctx.decodeAudioData(b.slice(0));if(ctx.setSinkId&&out!=='default')try{await ctx.setSinkId(out)}catch{}const n=ctx.createBufferSource();n.buffer=audio;const g=ctx.createGain();n.connect(g).connect(ctx.destination);speaking=true;set('Playing voice…');await new Promise((res,rej)=>{n.onended=res;try{n.start()}catch(e){rej(e)}});speaking=false}
function wav(a,r){const b=new ArrayBuffer(44+a.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+a.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,r,true);v.setUint32(28,r*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,a.length*2,true);for(let i=0;i<a.length;i++){let x=Math.max(-1,Math.min(1,a[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}return new Blob([b],{type:'audio/wav'})}
async function trans(blob){const f=new FormData();f.append('file',blob,'speech.wav');f.append('model','ink-whisper');const r=await fetch(API+'/stt',{method:'POST',headers:{Authorization:'Bearer '+await auth(),'Cartesia-Version':'2026-03-01'},body:f});if(!r.ok)throw Error('STT '+r.status+': '+(await r.text()).slice(0,400));return String((await r.json()).text||'').trim()}
async function devices(){const ds=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='<option value="">Default microphone</option>';$('out').innerHTML='<option value="default">Default Windows output</option>';for(const d of ds){if(d.kind==='audioinput')$('mic').add(new Option(d.label||'Microphone',d.deviceId));if(d.kind==='audiooutput')$('out').add(new Option(/cable input|vb-audio/i.test(d.label||'')?'VB-CABLE — CABLE Input':d.label||'Output',d.deviceId))}const c=ds.find(d=>d.kind==='audiooutput'&&/cable input|vb-audio/i.test(d.label||''));if(c){out=c.deviceId;$('out').value=out}$('route').textContent='Output: '+$('out').selectedOptions[0].text+' | ChilloutVR microphone: CABLE Output'}
function merged(){let n=0;for(const a of parts)n+=a.length;const x=new Float32Array(n);let p=0;for(const a of parts){x.set(a,p);p+=a.length}return x}
async function process(){if(busy||!parts.length)return;busy=true;const x=merged();parts=[];try{set('Cartesia STT…');const t=await trans(wav(x,ctx.sampleRate));if(t){$('log').textContent='You said: '+t;await speak(t)}if(listening)set('Listening…')}catch(e){err(e)}finally{busy=false;$('bar').style.width='0%'}}
async function start(){try{if(listening)return;await auth();await devices();const a={channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true};if($('mic').value)a.deviceId={exact:$('mic').value};stream=await navigator.mediaDevices.getUserMedia({audio:a});ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(2048,1,1);gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain).connect(ctx.destination);parts=[];talk=false;silent=talkms=0;last=performance.now();listening=true;set('Listening — speak normally.');proc.onaudioprocess=e=>{if(!listening||speaking||busy)return;const a=new Float32Array(e.inputBuffer.getChannelData(0)),r=Math.sqrt(a.reduce((s,v)=>s+v*v,0)/a.length),now=performance.now(),dt=Math.min(100,Math.max(1,now-last));last=now;if(r>.018){talk=true;talkms+=dt;silent=0;parts.push(a);$('bar').style.width=Math.min(100,20+r*1000)+'%'}else if(talk){parts.push(a);silent+=dt;talkms+=dt;if(silent>=750&&talkms>=350){talk=false;silent=talkms=0;process()}}}}catch(e){await stop();err(e)}}
async function stop(){listening=false;parts=[];if(proc)try{proc.disconnect()}catch{}if(src)try{src.disconnect()}catch{}if(gain)try{gain.disconnect()}catch{}if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)try{await ctx.close()}catch{}proc=src=gain=stream=ctx=null;$('bar').style.width='0%';set('Stopped.')}
$('test').onclick=async()=>{try{await speak('Hello! This is your Cartesia browser voice changer.');$('log').textContent='Test voice completed.'}catch(e){err(e)}};$('start').onclick=start;$('stop').onclick=stop;$('refresh').onclick=()=>devices().catch(err);$('choose').onclick=async()=>{try{if(navigator.mediaDevices.selectAudioOutput){const d=await navigator.mediaDevices.selectAudioOutput();if(d?.deviceId){out=d.deviceId;await devices();$('out').value=d.deviceId}}}catch(e){err(e)}};$('out').onchange=()=>out=$('out').value||'default';devices().catch(()=>{});window.onunhandledrejection=e=>err(e.reason||Error('Unknown error'))})();
</script></body></html>
