<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Echo Guard</title>
  <style>
    body{font:14px/1.45 system-ui,sans-serif;width:300px;padding:16px;margin:0;color:#17202a}
    h1{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px;color:#52606d}
    label{display:flex;align-items:center;gap:9px;font-weight:600;margin:10px 0}
    input{width:18px;height:18px}button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px;background:#1677ff;color:white;font-weight:600;cursor:pointer}
    button.secondary{background:#52606d}#status{font-size:12px;margin-top:10px;color:#52606d;overflow-wrap:anywhere}
    .note{font-size:11px;color:#6b7280}
  </style>
</head>
<body>
  <h1>ChatGPT Echo Guard</h1>
  <p>Compare what your microphone hears with ChatGPT Voice Mode audio using a local Whisper model.</p>
  <label><input id="enabled" type="checkbox"> Arm transcript fallback</label>
  <button id="audioToggle">Start local audio comparison</button>
  <button id="stopAudio" class="secondary">Stop audio comparison</button>
  <div id="status">Loading…</div>
  <p class="note">Audio comparison requires the local transcriber to be running. Audio is sent only to 127.0.0.1 on this computer.</p>
  <script src="popup.js"></script>
</body>
</html>
