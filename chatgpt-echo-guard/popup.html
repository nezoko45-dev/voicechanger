<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Echo Guard</title>
  <style>
    body{font:14px/1.45 system-ui,sans-serif;width:280px;padding:16px;margin:0;color:#17202a}
    h1{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px;color:#52606d}
    label{display:flex;align-items:center;gap:9px;font-weight:600}
    input{width:18px;height:18px}button{margin-top:14px;width:100%;padding:9px;border:0;border-radius:8px;background:#1677ff;color:white;font-weight:600;cursor:pointer}
    #status{font-size:12px;margin-top:10px;color:#52606d}
  </style>
</head>
<body>
  <h1>ChatGPT Echo Guard</h1>
  <p>When armed, it automatically checks each finished assistant response. If it does not exactly repeat your latest words, it opens a new chat and attempts to restart Voice Mode.</p>
  <label><input id="enabled" type="checkbox"> Arm echo guard</label>
  <div id="status">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
