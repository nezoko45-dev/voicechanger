<!doctype html><meta charset="utf-8"><title>CAI Speech Controller</title><style>body{font:16px system-ui;background:#111827;color:#eee;max-width:650px;margin:40px auto;padding:20px}button{font-size:17px;padding:12px;border:0;border-radius:9px;margin:5px;cursor:pointer}#start{background:#2563eb;color:white}#stop{background:#374151;color:white}#status,#last{background:#1f2937;padding:14px;border-radius:9px;margin:12px 0;white-space:pre-wrap}</style><h2>Character.AI Voice Automation</h2><p>Open a CAI chat in the debug Chrome tab. Click Start once, then speak naturally.</p><button id="start">🎙 Start (Voice ON)</button><button id="stop">Stop listening</button><div id="status">Waiting…</div><b>Latest speech</b><div id="last">—</div><small>Speech is transcribed, inserted, and Enter is sent. Voice mode is clicked on at start; the monitor attempts to switch it off after generation ends.</small><script>
const S=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.querySelector('#status'),last=document.querySelector('#last');let r,on=false,startedVoice=false;if(!S)status.textContent='SpeechRecognition unavailable';else{r=new S();r.lang='en-US';r.continuous=true;r.interimResults=false;r.onstart=()=>status.textContent='Listening 🎙';r.onerror=e=>status.textContent='Speech error: '+e.error;r.onend=()=>{if(on){setTimeout(()=>{try{r.start()}catch{}},350)}else status.textContent='Stopped'};r.onresult=async e=>{let t=e.results[e.results.length-1][0].transcript.trim();last.textContent=t;try{let x=await fetch('/transcript',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t})});let j=await x.json();status.textContent=j.ok?'Sent with Enter: '+t:'Send error: '+j.error}catch(e){status.textContent=e.message}}}
document.querySelector('#start').onclick=async()=>{on=true;if(!startedVoice){status.textContent='Turning CAI Voice on…';try{let x=await fetch('/voice-on',{method:'POST'}),j=await x.json();if(!j.ok)throw Error(j.error);startedVoice=true;status.textContent='Voice on; reply monitor active. Starting mic…'}catch(e){status.textContent='Voice toggle issue: '+e.message+' — starting mic anyway'}}try{r.start()}catch{status.textContent='Already listening'}};
document.querySelector('#stop').onclick=()=>{on=false;r?.stop();status.textContent='Stopping mic (CAI Voice left as-is)'};
</script>
