name: Package Seed-VC WAV-MP3 Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seed-vc-reference/**"
      - ".github/workflows/build-seed-vc-reference.yml"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create portable launcher bundle
        shell: pwsh
        run: |
          Compress-Archive -Path seed-vc-reference -DestinationPath Seed-VC-WAV-MP3-Launcher.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Seed-VC-WAV-MP3-Launcher
          path: Seed-VC-WAV-MP3-Launcher.zip
          retention-days: 14
