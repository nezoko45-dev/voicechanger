name: Build VRChat F-Key Attack Sound

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vrchat-f-attack-sound
    paths:
      - 'tools/VRChatFAttackSound/**'
      - '.github/workflows/build-vrchat-f-attack-sound.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish standalone Windows executable
        run: dotnet publish tools/VRChatFAttackSound/VRChatFAttackSound.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/VRChat-F-Attack-Sound-win-x64

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRChat-F-Attack-Sound-win-x64
          path: artifacts/VRChat-F-Attack-Sound-win-x64/
          if-no-files-found: error
          retention-days: 30
