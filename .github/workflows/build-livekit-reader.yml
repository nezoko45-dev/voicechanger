name: Build LiveKit Voice Reader for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - "livekit-reader-desktop/**"
      - ".github/workflows/build-livekit-reader.yml"
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: livekit-reader-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: livekit-reader-desktop/package-lock.json
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LiveKit-Voice-Reader-Windows
          path: livekit-reader-desktop/dist/*.exe
          if-no-files-found: error
