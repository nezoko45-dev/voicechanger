name: Build Character AI Voice Bridge
on:
  push:
    paths:
      - 'cai-voice-bridge/**'
      - '.github/workflows/cai-voice-bridge.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish bridge EXE
        run: dotnet publish cai-voice-bridge/CaiVoiceBridge.csproj --configuration Release --runtime win-x64 --self-contained true --output cai-voice-bridge/out/bridge /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Publish GUI installer EXE
        run: dotnet publish cai-voice-bridge/installer/CaiBridgeInstaller.csproj --configuration Release --runtime win-x64 --self-contained true --output cai-voice-bridge/out/installer /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Package installer, bridge, and extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cai-voice-bridge/package/extension | Out-Null
          Copy-Item cai-voice-bridge/out/bridge/CaiVoiceBridge.exe cai-voice-bridge/package/
          Copy-Item cai-voice-bridge/out/installer/CaiBridgeInstaller.exe cai-voice-bridge/package/
          Copy-Item cai-voice-bridge/extension/* cai-voice-bridge/package/extension/
          Compress-Archive -Path cai-voice-bridge/package/* -DestinationPath cai-voice-bridge/CaiVoiceBridge-GUI-Setup.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CaiVoiceBridge-GUI-Setup
          path: cai-voice-bridge/CaiVoiceBridge-GUI-Setup.zip
          if-no-files-found: error
