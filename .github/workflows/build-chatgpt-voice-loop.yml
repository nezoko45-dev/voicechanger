name: Build ChatGPT Voice Loop Windows EXE

on:
  push:
    branches: [feature/chatgpt-voice-loop-exe]
    paths:
      - 'chatgpt-voice-loop-exe/**'
      - '.github/workflows/build-chatgpt-voice-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore chatgpt-voice-loop-exe/ChatGPTVoiceLoop.csproj -r win-x64
      - name: Build Release
        run: dotnet build chatgpt-voice-loop-exe/ChatGPTVoiceLoop.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained Windows executable
        run: dotnet publish chatgpt-voice-loop-exe/ChatGPTVoiceLoop.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Voice-Loop-Windows-x64
          path: publish/ChatGPTVoiceLoop.exe
          if-no-files-found: error
          retention-days: 14
