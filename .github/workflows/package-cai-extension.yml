name: Package CAI Chrome Extension
on:
  workflow_dispatch:
  push:
    paths:
      - 'cai-extension/**'
      - '.github/workflows/package-cai-extension.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python -m json.tool cai-extension/manifest.json >/dev/null
      - name: Package extension
        run: cd cai-extension && zip -r ../CAI-Voice-Automation-Extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CAI-Voice-Automation-Extension
          path: CAI-Voice-Automation-Extension.zip
          if-no-files-found: error
