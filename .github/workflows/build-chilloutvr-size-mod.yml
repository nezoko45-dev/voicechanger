name: Build ChilloutVR Size Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChilloutVRSizeMod/**'
      - '.github/workflows/build-chilloutvr-size-mod.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore ChilloutVRSizeMod/ChilloutVRSizeMod.csproj

      - name: Build DLL
        run: dotnet build ChilloutVRSizeMod/ChilloutVRSizeMod.csproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRSizeMod
          path: ChilloutVRSizeMod/bin/Release/net6.0/ChilloutVRSizeMod.dll
