name: Build CAI Voice Transmitter
on:
  push:
    branches: [feature/cai-voice-audio-monitor]
    paths:
      - 'cai-voice-transmitter/**'
      - '.github/workflows/build-cai-voice-transmitter.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish standalone EXE
        run: dotnet publish cai-voice-transmitter/CaiVoiceTransmitter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: CAI-Voice-Transmitter
          path: publish/CaiVoiceTransmitter.exe
          if-no-files-found: error