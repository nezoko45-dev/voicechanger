name: Build ONNX Voice Changer EXE

on:
  push:
    paths:
      - ".github/workflows/build-onnx-exe.yml"
      - "onnx-exe/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout voicechanger
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download ONNX realtime engine source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force onnx-exe\engine | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SUC-DriverOld/rvc.onnx/master/realtime_onnx_gui.py" -OutFile "onnx-exe\engine\realtime_onnx_gui.py"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SUC-DriverOld/rvc.onnx/master/onnx_infer.py" -OutFile "onnx-exe\engine\onnx_infer.py"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile sounddevice FreeSimpleGUI onnxruntime-directml pyinstaller

      - name: Download bundled ONNX models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force onnx-exe\engine\assets\hubert_base | Out-Null
          New-Item -ItemType Directory -Force onnx-exe\engine\assets\fcpe | Out-Null
          New-Item -ItemType Directory -Force onnx-exe\engine\assets\weights | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/DogManTC/test-rvc-onnx/resolve/main/vec-768-layer-12.onnx?download=true" -OutFile "onnx-exe\engine\assets\hubert_base\hubert_fp16.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/niobures/FCPE/resolve/main/onnx/fcpe.onnx?download=true" -OutFile "onnx-exe\engine\assets\fcpe\fcpe_fp16.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/DogManTC/test-rvc-onnx/resolve/main/GuraTalkV2.onnx?download=true" -OutFile "onnx-exe\engine\assets\weights\GuraTalkV2.onnx"

      - name: Build Windows EXE folder
        shell: pwsh
        working-directory: onnx-exe\engine
        run: |
          New-Item -ItemType Directory -Force configs | Out-Null
          @'
          {"pth_path":"assets\\weights\\GuraTalkV2.onnx","sg_hostapi":"","sg_wasapi_exclusive":false,"sg_input_device":"","sg_output_device":"","sr_type":"sr_model","threhold":-60,"pitch":0,"rms_mix_rate":0.0,"block_time":0.25,"crossfade_length":0.05,"extra_time":2.0,"hubert_precision":"fp16","fcpe_precision":"fp16","split_mode":false,"device":"auto","speaker":0,"I_noise_reduce":false,"O_noise_reduce":false,"function":"vc"}
          '@ | Set-Content -Encoding UTF8 configs\config.json
          pyinstaller --noconfirm --clean --onedir --windowed --name VoiceChanger-ONNX --collect-all onnxruntime --collect-all onnxruntime_directml --collect-all FreeSimpleGUI --collect-all sounddevice --add-data "assets;assets" --add-data "configs;configs" realtime_onnx_gui.py

      - name: Add launcher
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0VoiceChanger-ONNX\\VoiceChanger-ONNX.exe"
          '@ | Set-Content -Encoding ASCII onnx-exe\dist\Run-VoiceChanger.bat

      - name: Zip EXE package
        shell: pwsh
        run: |
          Compress-Archive -Path "onnx-exe\dist\VoiceChanger-ONNX","onnx-exe\dist\Run-VoiceChanger.bat" -DestinationPath "VoiceChanger-ONNX-Windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-ONNX-Windows
          path: VoiceChanger-ONNX-Windows.zip
          if-no-files-found: error
