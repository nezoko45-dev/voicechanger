name: Build ChilloutVR VoiceChanger Resemble Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'BrowserVoiceChanger/**'
      - 'PythonVoiceChanger/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify Resemble bridge
        shell: pwsh
        run: |
          foreach ($file in @(
            'PythonVoiceChanger/voicechanger.py',
            'PythonVoiceChanger/config.json',
            'BrowserVoiceChanger/index.html',
            'BrowserVoiceChanger/app.js',
            'BrowserVoiceChanger/style.css',
            'VoiceChangerMod/BrowserController.cs'
          )) {
            if (-not (Test-Path $file)) { throw "Missing VoiceChanger asset: $file" }
          }
          $py = Get-Content 'PythonVoiceChanger/voicechanger.py' -Raw
          foreach ($check in @(
            'RESEMBLE_SYNTH',
            'RESEMBLE_STT',
            'RESEMBLE_VOICES',
            'f.cluster.resemble.ai/synthesize',
            '/api/v2/speech-to-text',
            '/api/v2/voices',
            'voice_uuid',
            'Authorization',
            '/stt-tts',
            '/voices'
          )) {
            if ($py.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Resemble STT/TTS bridge check failed: $check"
            }
          }
          foreach ($forbidden in @(
            'elevenlabs.io',
            '/v1/speech-to-speech/',
            '/v1/voices/add',
            'voice_id',
            'resemble:convert',
            'import numpy',
            'import requests',
            'import sounddevice',
            'pitch_shift_chunk',
            'winmm.dll',
            'PlaySound'
          )) {
            if ($py.IndexOf($forbidden, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Legacy voice-conversion reference is present: $forbidden"
            }
          }
          python -m py_compile PythonVoiceChanger/voicechanger.py
          Write-Host 'Resemble STT/TTS Python bridge validation passed.'

      - name: Verify browser UI
        shell: pwsh
        run: |
          $html = Get-Content 'BrowserVoiceChanger/index.html' -Raw
          $js = Get-Content 'BrowserVoiceChanger/app.js' -Raw
          $ui = $html + "`n" + $js
          foreach ($check in @(
            'Resemble API key',
            'Custom voice',
            'Start Voice Changer',
            'Stop',
            '/voices',
            '/stt-tts',
            'getUserMedia',
            'AudioContext',
            'createScriptProcessor',
            'encodeWav',
            'audio/wav'
          )) {
            if ($ui.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Browser STT/TTS UI check failed: $check"
            }
          }
          foreach ($forbidden in @(
            'ElevenLabs API key',
            'Target Voice ID',
            'Source WAV URL',
            'Convert WAV',
            '/convert',
            'voice_id'
          )) {
            if ($ui.IndexOf($forbidden, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Legacy browser voice-conversion reference is present: $forbidden"
            }
          }
          Write-Host 'Resemble STT/TTS browser control panel validation passed.'

      - name: Verify source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          foreach ($check in @('HttpListener', '127.0.0.1:', 'BrowserVoiceChanger', 'PythonVoiceChanger', 'ProcessStartInfo', 'UseShellExecute = true')) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Launcher check failed: $check"
            }
          }
          Write-Host 'Source validation passed.'

      - name: Verify build output
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          if (-not (Test-Path (Join-Path $out 'VoiceChangerMod.dll'))) { throw 'Missing VoiceChangerMod.dll' }
          Write-Host 'VoiceChangerMod.dll build output is present.'

      - name: Stage mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/BrowserVoiceChanger | Out-Null
          New-Item -ItemType Directory -Force -Path package/PythonVoiceChanger | Out-Null
          Copy-Item (Join-Path $out 'VoiceChangerMod.dll') package/VoiceChangerMod.dll.bin -Force
          Copy-Item 'BrowserVoiceChanger/index.html' package/BrowserVoiceChanger/ -Force
          Copy-Item 'BrowserVoiceChanger/app.js' package/BrowserVoiceChanger/ -Force
          Copy-Item 'BrowserVoiceChanger/style.css' package/BrowserVoiceChanger/ -Force
          Copy-Item 'PythonVoiceChanger/voicechanger.py' package/PythonVoiceChanger/ -Force
          Copy-Item 'PythonVoiceChanger/config.json' package/PythonVoiceChanger/ -Force
          @'
          INSTALLATION
          ==========
          This package keeps the Windows DLL as VoiceChangerMod.dll.bin so browsers are less likely to classify the download as a dangerous executable package.

          After extracting the package:
          1. Rename VoiceChangerMod.dll.bin to VoiceChangerMod.dll
          2. Place VoiceChangerMod.dll in the ChilloutVR Mods folder.
          3. Keep BrowserVoiceChanger and PythonVoiceChanger beside the DLL as included.
          '@ | Set-Content package/INSTALL.txt -Encoding UTF8
          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Create safe-download archive
        shell: pwsh
        run: |
          if (Test-Path 'ChilloutVRVoiceChangerResembleMod.zip') { Remove-Item 'ChilloutVRVoiceChangerResembleMod.zip' -Force }
          Compress-Archive -Path package/* -DestinationPath 'ChilloutVRVoiceChangerResembleMod.zip' -CompressionLevel Optimal
          Get-Item 'ChilloutVRVoiceChangerResembleMod.zip' | Select-Object FullName,Length

      - name: Upload Resemble voice changer package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerResembleMod
          path: ChilloutVRVoiceChangerResembleMod.zip
          if-no-files-found: error
