name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify final source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/Main.cs' -Raw
          $checks = @(
            'private const string CablePlaybackName = "CABLE Input";',
            'private static WaveOutEvent? _speaker;',
            'private static WaveFileReader? _reader;',
            'encoding=linear16&container=wav',
            'WaveOut.DeviceCount',
            'WaveOut.GetCapabilities',
            'new WaveOutEvent { DeviceNumber = deviceNumber }',
            'if (_suppressMicProcessing || !_enabled'
          )
          foreach ($check in $checks) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Required VoiceChanger code is missing: $check"
            }
          }
          if ($source.Contains('WasapiOut')) { throw 'WASAPI playback must not be present.' }
          if ($source.Contains('Mp3FileReader')) { throw 'MP3 playback must not be present.' }
          if ($source.Contains('OutputDeviceIndex')) { throw 'Hardcoded output device index must not be present.' }
          Write-Host 'Final source validation passed.'

      - name: Verify and stage complete mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          $required = @('VoiceChangerMod.dll', 'NAudio.dll', 'NAudio.Core.dll', 'NAudio.WinMM.dll', 'Newtonsoft.Json.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              throw "Missing runtime dependency: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out/*.dll" package/ -Force
          Get-ChildItem package -Filter *.dll | Select-Object Name,Length

      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: package/*.dll
          if-no-files-found: error
