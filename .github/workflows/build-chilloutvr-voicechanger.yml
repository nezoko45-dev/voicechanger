name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify runtime dependencies
        shell: pwsh
        run: |
          $out = "VoiceChangerMod/bin/Release/net472"
          $required = @("VoiceChangerMod.dll", "NAudio.dll", "NAudio.Core.dll", "NAudio.WinMM.dll", "Newtonsoft.Json.dll")
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $out $file))) {
              throw "Missing runtime dependency: $file"
            }
          }
          Get-ChildItem $out -Filter *.dll | Select-Object Name,Length

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: VoiceChangerMod/bin/Release/net472/*.dll
          if-no-files-found: error
