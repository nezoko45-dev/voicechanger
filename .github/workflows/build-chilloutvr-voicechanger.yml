name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: VoiceChangerMod/bin/Release/net472/VoiceChangerMod.dll
