name: Build ChilloutVR VoiceChanger Python Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'BrowserVoiceChanger/**'
      - 'PythonVoiceChanger/**'
      - 'ElevenLabs_2026-08-16T20_54_01_Ava – Natural AI Voice_pvc_sp100_s50_sb75_se36_b_e2.wav'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify Python engine
        shell: pwsh
        run: |
          foreach ($file in @(
            'PythonVoiceChanger/voicechanger.py',
            'PythonVoiceChanger/requirements.txt',
            'ElevenLabs_2026-08-16T20_54_01_Ava – Natural AI Voice_pvc_sp100_s50_sb75_se36_b_e2.wav'
          )) {
            if (-not (Test-Path $file)) { throw "Missing Python voice conversion asset: $file" }
          }
          $py = Get-Content 'PythonVoiceChanger/voicechanger.py' -Raw
          foreach ($check in @('/v1/voices/add', '/v1/speech-to-speech/', 'pcm_s16le_16', 'pcm_48000', 'sounddevice')) {
            if ($py.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Python engine check failed: $check"
            }
          }
          Write-Host 'Python live voice conversion engine validation passed.'

      - name: Verify browser files
        shell: pwsh
        run: |
          foreach ($file in @(
            'BrowserVoiceChanger/index.html',
            'BrowserVoiceChanger/app.js',
            'BrowserVoiceChanger/style.css',
            'VoiceChangerMod/BrowserController.cs'
          )) {
            if (-not (Test-Path $file)) { throw "Missing browser file: $file" }
          }
          Write-Host 'Browser control panel files are present.'

      - name: Verify source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          foreach ($check in @('HttpListener', '127.0.0.1:', 'BrowserVoiceChanger', 'PythonVoiceChanger', 'ProcessStartInfo', 'UseShellExecute = true')) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Launcher check failed: $check"
            }
          }
          $allCs = (Get-ChildItem 'VoiceChangerMod' -Filter *.cs -Recurse | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($forbidden in @('UnityEngine', 'NAudio', 'Newtonsoft.Json', 'System.Windows.Forms', 'System.Drawing', 'HarmonyLib', 'WaveOutEvent', 'WaveInEvent', 'WaveFileReader', 'audio_bridge.py')) {
            if ($allCs.IndexOf($forbidden, [StringComparison]::Ordinal) -ge 0) {
              throw "Legacy/native dependency reference is present: $forbidden"
            }
          }
          Write-Host 'Source validation passed.'

      - name: Verify build output
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          foreach ($file in @(
            'BrowserVoiceChanger/index.html',
            'BrowserVoiceChanger/app.js',
            'BrowserVoiceChanger/style.css',
            'PythonVoiceChanger/voicechanger.py',
            'PythonVoiceChanger/requirements.txt',
            'ElevenLabs_2026-08-16T20_54_01_Ava – Natural AI Voice_pvc_sp100_s50_sb75_se36_b_e2.wav'
          )) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { throw "Asset was not copied to build output: $file" }
          }
          Write-Host 'Python, target WAV, and browser assets are present in build output.'

      - name: Stage mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          if (-not (Test-Path (Join-Path $out 'VoiceChangerMod.dll'))) { throw 'Missing VoiceChangerMod.dll' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item (Join-Path $out 'VoiceChangerMod.dll') package/ -Force
          New-Item -ItemType Directory -Force -Path package/BrowserVoiceChanger | Out-Null
          New-Item -ItemType Directory -Force -Path package/PythonVoiceChanger | Out-Null
          Copy-Item 'BrowserVoiceChanger/*' package/BrowserVoiceChanger/ -Force
          Copy-Item 'PythonVoiceChanger/*' package/PythonVoiceChanger/ -Force
          Copy-Item 'ElevenLabs_2026-08-16T20_54_01_Ava – Natural AI Voice_pvc_sp100_s50_sb75_se36_b_e2.wav' package/ -Force
          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Upload Python voice changer package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerPythonMod
          path: package/**
          if-no-files-found: error
