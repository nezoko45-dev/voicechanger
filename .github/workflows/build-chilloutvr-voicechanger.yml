name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'BrowserVoiceChanger/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify browser files
        shell: pwsh
        run: |
          $required = @('BrowserVoiceChanger/index.html', 'BrowserVoiceChanger/app.js', 'BrowserVoiceChanger/style.css')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing browser file: $file" }
          }
          Write-Host 'Browser UI files are present.'

      - name: Verify browser launcher source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          $checks = @('HttpListener', '127.0.0.1:', 'BrowserVoiceChanger', 'ProcessStartInfo', 'UseShellExecute = true')
          foreach ($check in $checks) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) { throw "Browser launcher check failed: $check" }
          }
          Write-Host 'Browser launcher validation passed.'

      - name: Verify source has no obsolete GUI/playback references
        shell: pwsh
        run: |
          $files = Get-ChildItem 'VoiceChangerMod' -Filter *.cs -Recurse
          $source = ($files | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $forbidden = @('UnityEngine', 'Vector2', 'Rect', 'CABLE Input', 'CABLE Output', 'Virtual Audio Cable Line 1', 'FindCableOutputLine1Device', 'DirectSoundOut', 'WasapiOut', 'Mp3FileReader')
          foreach ($check in $forbidden) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -ge 0) { throw "Obsolete dependency/reference is present: $check" }
          }
          Write-Host 'Source validation passed.'

      - name: Stage complete mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          $required = @('VoiceChangerMod.dll', 'NAudio.dll', 'NAudio.Core.dll', 'NAudio.WinMM.dll', 'Newtonsoft.Json.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { throw "Missing runtime dependency: $file" }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out/*.dll" package/ -Force
          New-Item -ItemType Directory -Force -Path package/BrowserVoiceChanger | Out-Null
          Copy-Item 'BrowserVoiceChanger/*' package/BrowserVoiceChanger/ -Force
          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: package/**
          if-no-files-found: error
