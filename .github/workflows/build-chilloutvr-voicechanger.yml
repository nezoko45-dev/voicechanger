name: Build ChilloutVR VoiceChanger Browser Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'BrowserVoiceChanger/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify browser files
        shell: pwsh
        run: |
          $required = @(
            'BrowserVoiceChanger/index.html',
            'BrowserVoiceChanger/app.js',
            'BrowserVoiceChanger/style.css',
            'VoiceChangerMod/BrowserController.cs'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing browser file: $file" }
          }
          Write-Host 'Browser UI and launcher files are present.'

      - name: Verify browser-only source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          foreach ($check in @('HttpListener', '127.0.0.1:', 'BrowserVoiceChanger', 'ProcessStartInfo', 'UseShellExecute = true')) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Browser launcher check failed: $check"
            }
          }

          $allCs = (Get-ChildItem 'VoiceChangerMod' -Filter *.cs -Recurse | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($forbidden in @('UnityEngine', 'NAudio', 'Newtonsoft.Json', 'System.Windows.Forms', 'System.Drawing', 'HarmonyLib', 'WaveOutEvent', 'WaveInEvent', 'WaveFileReader')) {
            if ($allCs.IndexOf($forbidden, [StringComparison]::Ordinal) -ge 0) {
              throw "Legacy dependency/reference is present: $forbidden"
            }
          }
          Write-Host 'Browser-only source validation passed.'

      - name: Verify browser assets are copied to build output
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          foreach ($file in @('BrowserVoiceChanger/index.html', 'BrowserVoiceChanger/app.js', 'BrowserVoiceChanger/style.css')) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { throw "Browser asset was not copied to build output: $file" }
          }
          Write-Host 'Browser assets are present in the build output.'

      - name: Stage mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          if (-not (Test-Path (Join-Path $out 'VoiceChangerMod.dll'))) {
            throw 'Missing VoiceChangerMod.dll'
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item (Join-Path $out 'VoiceChangerMod.dll') package/ -Force
          New-Item -ItemType Directory -Force -Path package/BrowserVoiceChanger | Out-Null
          Copy-Item 'BrowserVoiceChanger/*' package/BrowserVoiceChanger/ -Force
          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Upload browser mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerBrowserMod
          path: package/**
          if-no-files-found: error
