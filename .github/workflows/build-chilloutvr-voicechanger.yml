name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify selectable TTS output routing
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/Main.cs' -Raw
          $checks = @(
            'private const int TtsDesiredLatencyMs = 20;',
            'private static string _selectedOutputDevice = "";',
            'WaveOut.DeviceCount',
            'WaveOut.GetCapabilities(i).ProductName',
            'internal static string[] OutputDeviceNames',
            'private static int FindSelectedOutputDevice()',
            'new WaveOutEvent { DeviceNumber = deviceNumber, DesiredLatency = TtsDesiredLatencyMs, NumberOfBuffers = 2 }',
            'TTS output device',
            'OutputDevice=',
            'if (_suppressMicProcessing || !_enabled'
          )
          foreach ($check in $checks) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Required selectable output code is missing: $check"
            }
          }
          if ($source.Contains('CABLE Input')) { throw 'Obsolete hard-coded CABLE Input routing must not be present.' }
          if ($source.Contains('CABLE Output')) { throw 'Obsolete hard-coded CABLE Output routing must not be present.' }
          if ($source.Contains('Virtual Audio Cable Line 1')) { throw 'Obsolete hard-coded Line 1 routing must not be present.' }
          if ($source.Contains('FindCableOutputLine1Device')) { throw 'Obsolete hard-coded Line 1 device lookup must not be present.' }
          if ($source.Contains('DirectSoundOut')) { throw 'DirectSoundOut routing must not be present.' }
          if ($source.Contains('WasapiOut')) { throw 'WASAPI playback must not be present.' }
          if ($source.Contains('Mp3FileReader')) { throw 'MP3 playback must not be present.' }
          if ($source.Contains('OutputDeviceIndex')) { throw 'Hard-coded output device index must not be present.' }
          Write-Host 'Selectable TTS output source validation passed.'

      - name: Verify and stage complete mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          $required = @('VoiceChangerMod.dll', 'NAudio.dll', 'NAudio.Core.dll', 'NAudio.WinMM.dll', 'Newtonsoft.Json.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              throw "Missing runtime dependency: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out/*.dll" package/ -Force
          Get-ChildItem package -Filter *.dll | Select-Object Name,Length

      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: package/*.dll
          if-no-files-found: error
