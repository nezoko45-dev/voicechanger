name: Build ChilloutVR VoiceChanger Browser Cartesia STT/TTS Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'BrowserVoiceChanger/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify browser-only Cartesia STT/TTS
        shell: pwsh
        run: |
          foreach ($file in @(
            'BrowserVoiceChanger/index.html',
            'BrowserVoiceChanger/app.js',
            'BrowserVoiceChanger/style.css',
            'VoiceChangerMod/BrowserController.cs'
          )) {
            if (-not (Test-Path $file)) { throw "Missing VoiceChanger asset: $file" }
          }

          $html = Get-Content 'BrowserVoiceChanger/index.html' -Raw
          $js = Get-Content 'BrowserVoiceChanger/app.js' -Raw
          $cs = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          $ui = $html + "`n" + $js

          foreach ($check in @(
            'Cartesia API key',
            'Cartesia Voice ID',
            'Start Automatic Voice Changer',
            'getUserMedia',
            'AudioContext',
            'createScriptProcessor',
            'encodeWav',
            'audio/wav',
            '/stt',
            '/tts/bytes',
            'sonic-3.5',
            'speechStarted',
            'silenceMs',
            'transcribeAndSpeak',
            '/cartesia-stt',
            '/cartesia-tts'
          )) {
            if ($ui.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Browser Cartesia STT/TTS check failed: $check"
            }
          }

          foreach ($forbidden in @(
            'Resemble',
            'resemble.ai',
            'PythonVoiceChanger',
            '127.0.0.1:17856',
            'voicechanger.py',
            'fetch(PYTHON',
            'MediaRecorder',
            'elevenlabs.io',
            'resemble:convert',
            '/cartesia-token'
          )) {
            if ($ui.IndexOf($forbidden, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden/legacy browser reference is present: $forbidden"
            }
          }

          foreach ($check in @('HttpListener', 'HandleCartesiaStt', 'HandleCartesiaTts', 'https://api.cartesia.ai/stt', 'https://api.cartesia.ai/tts/bytes', 'Cartesia-Version', 'HttpClient', 'ink-whisper', 'sonic-3.5')) {
            if ($cs.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Cartesia bridge check failed: $check"
            }
          }

          foreach ($forbidden in @('PythonVoiceChanger', 'StartPythonEngine', '_pythonProcess', 'py -3', 'Resemble', 'HandleCartesiaToken', 'api.cartesia.ai/access-token')) {
            if ($cs.IndexOf($forbidden, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Legacy runtime reference is present in BrowserController: $forbidden"
            }
          }

          Write-Host 'Browser-only automatic Cartesia STT/TTS validation passed.'

      - name: Verify source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/BrowserController.cs' -Raw
          foreach ($check in @('HttpListener', '127.0.0.1:', 'BrowserVoiceChanger', 'ProcessStartInfo', 'UseShellExecute = true')) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Launcher check failed: $check"
            }
          }
          Write-Host 'Source validation passed.'

      - name: Verify build output
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          if (-not (Test-Path (Join-Path $out 'VoiceChangerMod.dll'))) { throw 'Missing VoiceChangerMod.dll' }
          Write-Host 'VoiceChangerMod.dll build output is present.'

      - name: Stage mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/BrowserVoiceChanger | Out-Null
          Copy-Item (Join-Path $out 'VoiceChangerMod.dll') package/VoiceChangerMod.dll.bin -Force
          Copy-Item 'BrowserVoiceChanger/index.html' package/BrowserVoiceChanger/ -Force
          Copy-Item 'BrowserVoiceChanger/app.js' package/BrowserVoiceChanger/ -Force
          Copy-Item 'BrowserVoiceChanger/style.css' package/BrowserVoiceChanger/ -Force
          @'
          INSTALLATION
          ==========
          This is the browser-based Cartesia STT/TTS build. No Python installation is required.

          1. Rename VoiceChangerMod.dll.bin to VoiceChangerMod.dll.
          2. Place VoiceChangerMod.dll in the ChilloutVR Mods folder.
          3. Keep BrowserVoiceChanger beside the DLL as included.
          4. Start ChilloutVR and press F8 to open the browser control panel.
          5. Enter your Cartesia API key and Cartesia Voice ID.
          6. Choose CABLE Input as the browser output.
          7. Select CABLE Output as your microphone/input inside ChilloutVR.
          8. Click Connect to Cartesia, test the voice, then start the automatic voice changer.
          9. Speak normally. Silence detection submits each sentence to Cartesia STT; the text is sent to Cartesia Sonic TTS and the browser immediately listens again.
          '@ | Set-Content package/INSTALL.txt -Encoding UTF8
          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Create safe-download archive
        shell: pwsh
        run: |
          if (Test-Path 'ChilloutVRVoiceChangerCartesiaMod.zip') { Remove-Item 'ChilloutVRVoiceChangerCartesiaMod.zip' -Force }
          Compress-Archive -Path package/* -DestinationPath 'ChilloutVRVoiceChangerCartesiaMod.zip' -CompressionLevel Optimal
          Get-Item 'ChilloutVRVoiceChangerCartesiaMod.zip' | Select-Object FullName,Length

      - name: Upload Cartesia browser voice changer package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerCartesiaMod
          path: ChilloutVRVoiceChangerCartesiaMod.zip
          if-no-files-found: error
