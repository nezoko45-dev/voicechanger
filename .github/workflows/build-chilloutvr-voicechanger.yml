name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Configure Voicemeeter Banana Windows-name routing
        shell: pwsh
        run: |
          $file = 'VoiceChangerMod/Main.cs'
          $text = Get-Content -Raw -Path $file

          $text = $text.Replace(
            '    private const int OutputDeviceIndex = 18;',
            '    private const string VoicemeeterWindowsName = "VoiceMeeter Input";'
          )

          $oldLog = '        MelonLogger.Msg("TTS output device index = " + OutputDeviceIndex + " (Voicemeeter Banana target)");'
          $newLog = '        MelonLogger.Msg("TTS target: Windows audio device named VoiceMeeter Input (Voicemeeter Banana default input)");'
          $text = $text.Replace($oldLog, $newLog)

          $oldMethod = @'
    private static void PlayMp3(byte[] audio)
    {
        StopPlayback();
        _audioStream = new MemoryStream(audio, false);
        _reader = new Mp3FileReader(_audioStream);
        _speaker = new WaveOutEvent { DeviceNumber = OutputDeviceIndex };
        MelonLogger.Msg("Playing TTS through audio output device index " + OutputDeviceIndex + ".");
        _speaker.Init(_reader);
        _speaker.PlaybackStopped += (_, _) => { try { _speaker?.Dispose(); } catch { } try { _reader?.Dispose(); } catch { } try { _audioStream?.Dispose(); } catch { } _speaker = null; _reader = null; _audioStream = null; };
        _speaker.Play();
    }
'@

          $newMethod = @'
    private static int FindVoicemeeterBananaDevice()
    {
        for (int i = 0; i < WaveOut.DeviceCount; i++)
        {
            try
            {
                var caps = WaveOut.GetCapabilities(i);
                string name = caps.ProductName ?? "";
                MelonLogger.Msg("Audio output " + i + ": " + name);

                if (name.IndexOf(VoicemeeterWindowsName, StringComparison.OrdinalIgnoreCase) >= 0 &&
                    name.IndexOf("AUX", StringComparison.OrdinalIgnoreCase) < 0)
                {
                    MelonLogger.Msg("Voicemeeter Banana default Windows output found at WaveOut index " + i + ": " + name);
                    return i;
                }
            }
            catch (Exception ex)
            {
                MelonLogger.Warning("Could not inspect audio output " + i + ": " + ex.Message);
            }
        }

        MelonLogger.Error("Voicemeeter Banana default output was not found by Windows device name. Expected a device containing 'VoiceMeeter Input'.");
        return -1;
    }

    private static void PlayMp3(byte[] audio)
    {
        StopPlayback();
        int device = FindVoicemeeterBananaDevice();
        if (device < 0)
        {
            _status = "Voicemeeter Banana output not found";
            NativeGui.Refresh();
            return;
        }

        try
        {
            _audioStream = new MemoryStream(audio, false);
            _reader = new Mp3FileReader(_audioStream);
            _speaker = new WaveOutEvent { DeviceNumber = device };
            MelonLogger.Msg("Playing TTS through Windows device 'VoiceMeeter Input' at WaveOut index " + device + ".");
            _speaker.Init(_reader);
            _speaker.PlaybackStopped += (_, _) =>
            {
                try { _speaker?.Dispose(); } catch { }
                try { _reader?.Dispose(); } catch { }
                try { _audioStream?.Dispose(); } catch { }
                _speaker = null;
                _reader = null;
                _audioStream = null;
            };
            _speaker.Play();
        }
        catch (Exception ex)
        {
            MelonLogger.Error("Could not play TTS through Voicemeeter Banana: " + ex.GetType().Name + ": " + ex.Message);
            StopPlayback();
            _status = "Voicemeeter playback error";
            NativeGui.Refresh();
        }
    }
'@

          if ($text.IndexOf($oldMethod, [StringComparison]::Ordinal) -lt 0) {
            throw 'Expected PlayMp3 method was not found; refusing to modify Main.cs.'
          }

          $text = $text.Replace($oldMethod, $newMethod)

          if ($text.IndexOf('OutputDeviceIndex', [StringComparison]::Ordinal) -ge 0) {
            throw 'Old numeric output-device routing is still present.'
          }
          if ($text.IndexOf('VoicemeeterWindowsName', [StringComparison]::Ordinal) -lt 0) {
            throw 'Voicemeeter Windows-name routing was not inserted.'
          }
          if ($text.IndexOf('FindVoicemeeterBananaDevice', [StringComparison]::Ordinal) -lt 0) {
            throw 'Voicemeeter device resolver was not inserted.'
          }

          Set-Content -Path $file -Value $text -Encoding UTF8
          Write-Host 'Configured TTS to detect Windows device name: VoiceMeeter Input.'

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify and stage complete mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          $required = @('VoiceChangerMod.dll', 'NAudio.dll', 'NAudio.Core.dll', 'NAudio.WinMM.dll', 'Newtonsoft.Json.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              throw "Missing runtime dependency: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out/*.dll" package/ -Force
          Get-ChildItem package -Filter *.dll | Select-Object Name,Length

      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: package/*.dll
          if-no-files-found: error
