name: Build ChilloutVR VoiceChanger Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceChangerMod/**'
      - 'tools/configure-routing.py'
      - '.github/workflows/build-chilloutvr-voicechanger.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Validate routing script
        shell: pwsh
        run: python -m py_compile tools/configure-routing.py

      - name: Configure VB-CABLE routing
        shell: pwsh
        run: python tools/configure-routing.py

      - name: Verify patched source
        shell: pwsh
        run: |
          $source = Get-Content 'VoiceChangerMod/Main.cs' -Raw
          $checks = @(
            'private const string CablePlaybackName = "CABLE Input";',
            'private static IWavePlayer? _speaker;',
            'new WasapiOut(device, AudioClientShareMode.Shared, true, 100)',
            'encoding=linear16&container=wav',
            '_reader = new WaveFileReader(_audioStream);',
            'private static volatile bool _suppressMicProcessing;'
          )
          foreach ($check in $checks) {
            if ($source.IndexOf($check, [StringComparison]::Ordinal) -lt 0) {
              throw "Required TTS/routing code is missing: $check"
            }
          }
          if ($source.Contains('OutputDeviceIndex')) {
            throw 'Old OutputDeviceIndex code is still present.'
          }
          if ($source.Contains('new WaveOutEvent')) {
            throw 'Old WaveOutEvent playback code is still present.'
          }
          Write-Host 'TTS/routing source validation passed.'

      - name: Restore
        run: dotnet restore VoiceChangerMod/VoiceChangerMod.csproj

      - name: Build DLL
        run: dotnet build VoiceChangerMod/VoiceChangerMod.csproj --configuration Release --no-restore

      - name: Verify and stage complete mod package
        shell: pwsh
        run: |
          $out = 'VoiceChangerMod/bin/Release/net472'
          $required = @('VoiceChangerMod.dll', 'NAudio.dll', 'NAudio.Core.dll', 'NAudio.Wasapi.dll', 'NAudio.WinMM.dll', 'Newtonsoft.Json.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              throw "Missing runtime dependency: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out/*.dll" package/ -Force
          Get-ChildItem package -Filter *.dll | Select-Object Name,Length

      - name: Upload complete mod package
        uses: actions/upload-artifact@v4
        with:
          name: ChilloutVRVoiceChangerMod
          path: package/*.dll
          if-no-files-found: error
