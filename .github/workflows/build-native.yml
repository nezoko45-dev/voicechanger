name: Build native Windows voice changer

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVer = '1.23.2'
          $thirdParty = Join-Path $env:GITHUB_WORKSPACE 'native\third_party'
          $zip = Join-Path $env:RUNNER_TEMP 'onnxruntime.zip'
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVer/onnxruntime-win-x64-$ortVer.zip"

          New-Item -ItemType Directory -Force $thirdParty | Out-Null
          Write-Host "Downloading $url"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          Expand-Archive -Force $zip -DestinationPath $thirdParty

          $ortDir = Join-Path $thirdParty "onnxruntime-win-x64-$ortVer"
          if (!(Test-Path (Join-Path $ortDir 'include\onnxruntime_cxx_api.h'))) {
            throw "ONNX Runtime headers were not found at $ortDir"
          }
          if (!(Test-Path (Join-Path $ortDir 'lib\onnxruntime.lib'))) {
            throw "ONNX Runtime library was not found at $ortDir"
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortDir = "$env:GITHUB_WORKSPACE\native\third_party\onnxruntime-win-x64-1.23.2"
          cmake -S native -B native\build -G "Visual Studio 17 2022" -A x64 `
            -DONNXRUNTIME_ROOT="$ortDir" `
            -DDVC_BUILD_EXAMPLES=OFF `
            -DBUILD_TESTING=OFF

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build native\build --config Release --parallel

      - name: Verify native outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'native\build\Release\voicechanger_host.exe',
            'native\build\Release\voicechanger.dll',
            'native\third_party\onnxruntime-win-x64-1.23.2\lib\onnxruntime.dll'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing build output: $file" }
            Write-Host "OK: $file"
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'native\package'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'native\native-voicechanger-win-x64.zip'

          Remove-Item -Recurse -Force $package -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $package | Out-Null

          Copy-Item 'native\build\Release\voicechanger_host.exe' $package
          Copy-Item 'native\build\Release\voicechanger.dll' $package
          Copy-Item 'native\third_party\onnxruntime-win-x64-1.23.2\lib\onnxruntime.dll' $package
          Copy-Item 'native\run_voicechanger.bat' $package
          Copy-Item 'native\README.md' $package

          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-voicechanger-win-x64
          path: native/native-voicechanger-win-x64.zip
          if-no-files-found: error
          retention-days: 7
