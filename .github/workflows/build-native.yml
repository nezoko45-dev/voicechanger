name: Build native Windows bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native -B native\build -G "Visual Studio 17 2022" -A x64 -DDVC_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF

      - name: Build bridge only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build native\build --config Release --target voicechanger_web_bridge --parallel

      - name: Locate existing DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vc = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter 'voicechanger.dll' -File -Recurse | Where-Object { $_.FullName -notmatch '\\build\\' } | Select-Object -First 1
          $ort = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter 'onnxruntime.dll' -File -Recurse | Where-Object { $_.FullName -notmatch '\\build\\' } | Select-Object -First 1
          if (!$vc) { throw 'No committed voicechanger.dll was found. Add the existing binary to the repo; this workflow will not build/replace it.' }
          if (!$ort) { throw 'No committed onnxruntime.dll was found. Add the existing binary to the repo.' }
          "VOICE_DLL=$($vc.FullName)" | Out-File $env:GITHUB_ENV -Append
          "ORT_DLL=$($ort.FullName)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Using existing voicechanger.dll: $($vc.FullName)"
          Write-Host "Using existing onnxruntime.dll: $($ort.FullName)"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'native\package'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'native\native-rvc-pages-win-x64.zip'
          Remove-Item -Recurse -Force $package -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item 'native\build\Release\voicechanger_web_bridge.exe' $package
          Copy-Item $env:VOICE_DLL (Join-Path $package 'voicechanger.dll')
          Copy-Item $env:ORT_DLL (Join-Path $package 'onnxruntime.dll')
          Copy-Item 'native\run_web_bridge.bat' $package
          Copy-Item 'native\README.md' $package
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-rvc-pages-win-x64
          path: native/native-rvc-pages-win-x64.zip
          if-no-files-found: error
          retention-days: 7
