name: Fix Voicemeeter AUX output routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch TTS output routing
        shell: pwsh
        run: |
          $path = "VoiceChangerMod/Main.cs"
          $text = Get-Content $path -Raw

          $text = $text.Replace('using NAudio.Wave;','using NAudio.Wave;`r`nusing NAudio.CoreAudioApi;')

          $old = @'
    private static void PlayMp3(byte[] audio)
    {
        StopPlayback();
        _audioStream = new MemoryStream(audio, false);
        _reader = new Mp3FileReader(_audioStream);
        _speaker = new WaveOutEvent { DeviceNumber = OutputDeviceIndex };
        MelonLogger.Msg("Playing TTS through audio output device index " + OutputDeviceIndex + ".");
        _speaker.Init(_reader);
        _speaker.PlaybackStopped += (_, _) => { try { _speaker?.Dispose(); } catch { } try { _reader?.Dispose(); } catch { } try { _audioStream?.Dispose(); } catch { } _speaker = null; _reader = null; _audioStream = null; };
        _speaker.Play();
    }
'@

          $new = @'
    private static void PlayMp3(byte[] audio)
    {
        StopPlayback();
        _audioStream = new MemoryStream(audio, false);
        _reader = new Mp3FileReader(_audioStream);

        int device = ResolveVoicemeeterAuxWaveOutDevice();
        _speaker = new WaveOutEvent { DeviceNumber = device };
        MelonLogger.Msg("TTS routed to Voicemeeter AUX. WaveOut device index = " + device + ".");
        _speaker.Init(_reader);
        _speaker.PlaybackStopped += (_, _) => { try { _speaker?.Dispose(); } catch { } try { _reader?.Dispose(); } catch { } try { _audioStream?.Dispose(); } catch { } _speaker = null; _reader = null; _audioStream = null; };
        _speaker.Play();
    }

    private static int ResolveVoicemeeterAuxWaveOutDevice()
    {
        try
        {
            if (OutputDeviceIndex >= 0 && OutputDeviceIndex < WaveOut.DeviceCount)
            {
                var preferred = WaveOut.GetCapabilities(OutputDeviceIndex);
                MelonLogger.Msg("Preferred WaveOut index " + OutputDeviceIndex + " = " + preferred.ProductName);
                if (preferred.ProductName.IndexOf("VoiceMeeter AUX", StringComparison.OrdinalIgnoreCase) >= 0 ||
                    preferred.ProductName.IndexOf("Voicemeeter AUX", StringComparison.OrdinalIgnoreCase) >= 0)
                    return OutputDeviceIndex;
            }

            for (int i = 0; i < WaveOut.DeviceCount; i++)
            {
                var caps = WaveOut.GetCapabilities(i);
                string name = caps.ProductName ?? "";
                MelonLogger.Msg("WaveOut device " + i + ": " + name);
                if (name.IndexOf("VoiceMeeter AUX", StringComparison.OrdinalIgnoreCase) >= 0 ||
                    name.IndexOf("Voicemeeter AUX", StringComparison.OrdinalIgnoreCase) >= 0)
                {
                    MelonLogger.Msg("Found Voicemeeter AUX at WaveOut index " + i + ".");
                    return i;
                }
            }

            MelonLogger.Error("Voicemeeter AUX was not found in the WaveOut device list; forcing configured index 18.");
            return OutputDeviceIndex;
        }
        catch (Exception ex)
        {
            MelonLogger.Error("Could not resolve Voicemeeter AUX output: " + ex.Message + ". Forcing index 18.");
            return OutputDeviceIndex;
        }
    }
'@

          if (-not $text.Contains($old)) {
            throw "Expected PlayMp3 block was not found; no changes were committed."
          }

          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceChangerMod/Main.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes needed."; exit 0 }
          git commit -m "Route TTS to Voicemeeter AUX output"
          git push
