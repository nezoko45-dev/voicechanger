name: Build Windows VoiceChanger

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package.json
            desktop/package.json

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build desktop UI
        working-directory: web
        run: npm run build

      - name: Download signed VoiceChanger virtual audio driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverDir = Join-Path $env:GITHUB_WORKSPACE 'desktop\driver'
          $packageDir = Join-Path $driverDir 'package'
          $zip = Join-Path $env:RUNNER_TEMP 'voicechanger-driver.zip'
          if (Test-Path $packageDir) { Remove-Item -Recurse -Force $packageDir }
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $url = 'https://github.com/VirtualDrivers/Virtual-Audio-Driver/releases/download/25.7.14/Virtual.Audio.Driver.Signed.-.25.7.14.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = 'dd10560994de65a7e587fb8b93c0d7e9838292d9c3566a0976c2786d727292bd'
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Driver package SHA256 mismatch. Expected $expected but received $actual." }
          Expand-Archive -Path $zip -DestinationPath $packageDir -Force
          Write-Host 'Bundled VoiceChanger driver package:'
          Get-ChildItem -Path $packageDir -Recurse -Include *.sys,*.inf,*.cat,*.dll | ForEach-Object { Write-Host $_.FullName }

      - name: Build VoiceChanger device installer helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio vswhere.exe was not found.' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat was not found: $vcvars" }
          $source = Join-Path $env:GITHUB_WORKSPACE 'desktop\driver\VoiceChangerDeviceInstaller.cpp'
          $output = Join-Path $env:GITHUB_WORKSPACE 'desktop\driver\VoiceChangerDeviceInstaller.exe'
          $cmd = "call `"$vcvars`" && cl.exe /nologo /O2 /EHsc /MT `"$source`" /link setupapi.lib newdev.lib /OUT:`"$output`""
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "VoiceChangerDeviceInstaller compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $output)) { throw 'VoiceChangerDeviceInstaller.exe was not produced.' }
          Write-Host "Built $output"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run build

      - name: Assemble complete Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'release-package'
          $driverRoot = Join-Path $env:GITHUB_WORKSPACE 'desktop\driver'
          $driverPackage = Join-Path $driverRoot 'package'
          $exe = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'desktop\dist') -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable VoiceChanger EXE was not produced.' }

          if (Test-Path $packageRoot) { Remove-Item -Recurse -Force $packageRoot }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $packageRoot 'driver') -Force | Out-Null

          Copy-Item $exe.FullName (Join-Path $packageRoot $exe.Name) -Force
          Copy-Item (Join-Path $driverRoot 'VoiceChangerDeviceInstaller.exe') (Join-Path $packageRoot 'VoiceChangerDeviceInstaller.exe') -Force
          Copy-Item (Join-Path $driverRoot 'install-voicechanger-driver.ps1') (Join-Path $packageRoot 'install-voicechanger-driver.ps1') -Force
          Copy-Item (Join-Path $driverRoot 'THIRD_PARTY_NOTICES.md') (Join-Path $packageRoot 'THIRD_PARTY_NOTICES.md') -Force
          Copy-Item $driverPackage (Join-Path $packageRoot 'driver\package') -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md') (Join-Path $packageRoot 'README.md') -Force

          @'
          VoiceChanger Desktop - Windows package

          Contents:
          - VoiceChanger-Desktop-*.exe : portable desktop application
          - VoiceChangerDeviceInstaller.exe : virtual audio device installer helper
          - install-voicechanger-driver.ps1 : PowerShell driver installer
          - driver\package\ : signed virtual audio driver files
          - THIRD_PARTY_NOTICES.md : third-party driver notices
          - README.md : project information

          The portable EXE also contains the web UI and bundled driver resources.
          If Windows blocks driver installation, run the installer helper as Administrator.
          '@ | Set-Content (Join-Path $packageRoot 'PACKAGE-README.txt') -Encoding UTF8

          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'VoiceChanger-Desktop-Windows.zip'
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

          Write-Host 'Complete package contents:'
          Get-ChildItem $packageRoot -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          Write-Host "Created $zipPath"

      - name: Upload complete Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Desktop-Windows
          path: VoiceChanger-Desktop-Windows.zip
          if-no-files-found: error
