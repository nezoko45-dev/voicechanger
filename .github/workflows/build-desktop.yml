name: Build Windows VoiceChanger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable Windows app
        working-directory: desktop
        run: npm run build

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-VoiceChanger-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
