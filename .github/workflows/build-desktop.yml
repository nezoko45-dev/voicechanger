name: Build Windows VoiceChanger

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package.json
            desktop/package.json

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build desktop UI
        working-directory: web
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run build

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Desktop-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
