name: Build CAI Voice Automation EXE
# Build and upload the CAI + bridge dual-tab EXE.
on:
  workflow_dispatch:
  push:
    paths:
      - 'cai-voice-automation/**'
      - '.github/workflows/build-cai-voice.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained EXE
        run: dotnet publish cai-voice-automation/CaiVoiceAutomation.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - uses: actions/upload-artifact@v4
        with:
          name: CaiVoiceAutomation-win-x64
          path: cai-voice-automation/bin/Release/net8.0-windows/win-x64/publish/CaiVoiceAutomation.exe
