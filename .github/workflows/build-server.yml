name: Build server.exe
on:
  workflow_dispatch:
  push:
    paths:
      - "server.py"
      - "index.html"
      - "app.js"
      - "install.bat"
      - ".github/workflows/build-server.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --name server server.py
      - shell: pwsh
        run: |
          Copy-Item index.html dist/index.html -Force
          Copy-Item app.js dist/app.js -Force
          Copy-Item install.bat dist/install.bat -Force
          Copy-Item start.bat dist/start.bat -Force
          Compress-Archive -Path dist/* -DestinationPath VoiceChangerServer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceChangerServer
          path: VoiceChangerServer.zip
