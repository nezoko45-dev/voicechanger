name: Deploy Notepad Voice Reader to GitHub Pages

on:
  push:
    branches:
      - naturalreader-voice-dictator
    paths:
      - 'naturalreader-voice-dictator/notepad-voice-reader/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload voice reader site
        uses: actions/upload-pages-artifact@v3
        with:
          path: naturalreader-voice-dictator/notepad-voice-reader
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
