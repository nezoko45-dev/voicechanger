name: Build Pocket Echo for Windows

on:
  push:
    paths:
      - "pocket-echo/**"
      - ".github/workflows/pocket-echo-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download 7-Zip standalone extractor
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile "pocket-echo/bin/7zr.exe"
          if ((Get-Item "pocket-echo/bin/7zr.exe").Length -lt 100000) { throw "7zr.exe download is incomplete." }

      - name: Download FFmpeg audio converter
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          $extract = "$env:RUNNER_TEMP/ffmpeg"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg executable was not found in the downloaded archive." }
          Copy-Item $ffmpeg.FullName "pocket-echo/bin/ffmpeg.exe" -Force

      - name: Restore and publish
        run: dotnet publish pocket-echo/PocketEcho.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o pocket-echo/publish

      - name: Bundle FFmpeg and 7-Zip tools
        shell: pwsh
        run: |
          Copy-Item "pocket-echo/bin/*" "pocket-echo/publish/" -Recurse -Force
          if (-not (Test-Path "pocket-echo/publish/PocketEcho.exe")) { throw "PocketEcho.exe was not produced." }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "pocket-echo/publish/*" -DestinationPath "PocketEcho-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PocketEcho-windows-x64
          path: PocketEcho-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
