name: Build Windows Echo Guard Transcriber EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chatgpt-echo-guard/local-transcriber/**"
      - ".github/workflows/build-echo-guard-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install transcriber and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r chatgpt-echo-guard/local-transcriber/requirements.txt pyinstaller

      - name: Build local transcriber EXE
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name EchoGuardTranscriber
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all huggingface_hub
          --collect-all av
          --collect-all numpy
          chatgpt-echo-guard\local-transcriber\server.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EchoGuardTranscriber-Windows-x64
          path: dist/EchoGuardTranscriber.exe
          if-no-files-found: error
          retention-days: 14
