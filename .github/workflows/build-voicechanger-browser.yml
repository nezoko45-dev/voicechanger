name: Build VoiceChanger Browser EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-browser/**'
      - '.github/workflows/build-voicechanger-browser.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-browser/requirements.txt
      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name VoiceChangerBrowser --collect-all qwen_tts --collect-all torch --add-data "desktop-browser/web;web" --add-data "desktop-browser/tts_engine.py;." desktop-browser/launcher.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VoiceChangerBrowser.exe release/VoiceChangerBrowser.exe
          Copy-Item desktop-browser/README.md release/README.txt
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChangerBrowser-Windows
          path: release/
