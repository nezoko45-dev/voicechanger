name: Build VoiceChanger EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-browser/**'
      - '.github/workflows/build-voicechanger-browser.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build single-file EXE
        working-directory: desktop-browser
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o VoiceChanger.exe .
      - name: Package EXE only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item desktop-browser/VoiceChanger.exe release/VoiceChanger.exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Windows
          path: release/VoiceChanger.exe
