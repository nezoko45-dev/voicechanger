name: Build Local OpenVoice VoiceChanger EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop-browser/VoiceChanger.csproj
      - name: Fix C# build and runtime issues
        shell: pwsh
        run: |
          $p = 'desktop-browser/Program.cs'
          $s = Get-Content -Raw $p
          $old = 'for (var i = 1, j = 0; i < n; i++) { var bit = n >> 1; for (; (j & bit) != 0; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { (re[i], re[j]) = (re[j], re[i]); (im[i], im[j]) = (im[j], im[i]); } }'
          $new = 'var j0 = 0; for (var i = 1; i < n; i++) { var bit = n >> 1; for (; (j0 & bit) != 0; bit >>= 1) j0 ^= bit; j0 ^= bit; if (i < j0) { (re[i], re[j0]) = (re[j0], re[i]); (im[i], im[j0]) = (im[j0], im[i]); } }'
          if ($s.Contains($old)) { $s = $s.Replace($old, $new) }
          $old = @'
            using var synth = new SpeechSynthesizer();
            synth.Rate = 0;
            synth.Volume = 100;
            synth.SetOutputToWaveFile(path);
            synth.Speak(text);
            synth.SetOutputToNull();
            return File.ReadAllBytes(path);
'@
          $new = @'
            byte[] data;
            using (var synth = new SpeechSynthesizer())
            {
                synth.Rate = 0;
                synth.Volume = 100;
                synth.SetOutputToWaveFile(path);
                synth.Speak(text);
                synth.SetOutputToNull();
                data = File.ReadAllBytes(path);
            }
            return data;
'@
          if ($s.Contains($old)) { $s = $s.Replace($old, $new) }
          $old = @'
        using var input = response.Content.ReadAsStream();
        using var output = File.Create(path + ".part");
        input.CopyTo(output);
        output.Flush();
        File.Move(path + ".part", path, true);
'@
          $new = @'
        var part = path + ".part";
        using (var input = response.Content.ReadAsStream())
        using (var output = File.Create(part))
        {
            input.CopyTo(output);
            output.Flush(true);
        }
        File.Move(part, path, true);
'@
          if ($s.Contains($old)) { $s = $s.Replace($old, $new) }
          Set-Content -Path $p -Value $s -NoNewline
      - name: Publish single EXE
        run: dotnet publish desktop-browser/VoiceChanger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Verify
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VoiceChanger.exe)) { throw 'VoiceChanger.exe was not created' }
          Get-Item dist/VoiceChanger.exe | Select-Object Name,Length
      - name: Upload only the EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Local-OpenVoice-V2-ONNX
          path: dist/VoiceChanger.exe
          if-no-files-found: error
