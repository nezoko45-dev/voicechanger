name: Build Local OpenVoice VoiceChanger EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reduce live voice latency
        shell: pwsh
        run: |
          $p = 'desktop-browser/Program.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('endpointing=400', 'endpointing=150')
          $s = $s.Replace('createScriptProcessor(4096,1,1)', 'createScriptProcessor(2048,1,1)')
          Set-Content -Path $p -Value $s -NoNewline
          Write-Host 'Latency tuning applied: Deepgram endpointing 150ms, audio chunks 2048 samples.'

      - name: Restore
        run: dotnet restore desktop-browser/VoiceChanger.csproj

      - name: Compile check
        run: dotnet build desktop-browser/VoiceChanger.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish desktop-browser/VoiceChanger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist --no-restore

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VoiceChanger.exe)) { throw 'VoiceChanger.exe was not created' }
          $file = Get-Item dist/VoiceChanger.exe
          Write-Host "Created $($file.FullName) ($($file.Length) bytes)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Local-OpenVoice-V2-ONNX-LowLatency
          path: dist/VoiceChanger.exe
          if-no-files-found: error
