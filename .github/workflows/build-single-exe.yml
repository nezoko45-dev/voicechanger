name: Build Single VoiceChanger EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build
        working-directory: desktop-browser
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o VoiceChanger.exe .
      - name: Verify
        shell: pwsh
        run: if (-not (Test-Path desktop-browser/VoiceChanger.exe)) { throw 'EXE was not created' }
      - name: Upload only the EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Windows-Single-EXE
          path: desktop-browser/VoiceChanger.exe
