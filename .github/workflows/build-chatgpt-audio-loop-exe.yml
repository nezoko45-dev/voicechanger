name: Build ChatGPT Audio Loop EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'chatgpt-audio-loop-exe/**'
      - '.github/workflows/build-chatgpt-audio-loop-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained EXE
        run: dotnet publish chatgpt-audio-loop-exe/ChatGptAudioLoop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Audio-Loop-Windows-x64
          path: publish/ChatGptAudioLoop.exe
