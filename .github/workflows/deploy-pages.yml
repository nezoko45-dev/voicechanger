# Deploy the repository's GitHub Pages tools.
name: Deploy Voicechanger Pages

on:
  push:
    branches: [main]
    paths:
      - "openrouter-tts-reader/**"
      - "pocket-tts-studio/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          test -s openrouter-tts-reader/index.html
          test -s pocket-tts-studio/index.html
          mkdir -p _site/openrouter-tts-reader _site/pocket-tts-studio
          cp openrouter-tts-reader/index.html _site/index.html
          cp openrouter-tts-reader/index.html _site/openrouter-tts-reader/index.html
          cp pocket-tts-studio/index.html _site/pocket-tts-studio/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
