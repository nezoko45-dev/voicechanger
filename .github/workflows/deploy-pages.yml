# Deploy the repository's GitHub Pages tools.
name: Deploy Voicechanger Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "openrouter-tts-reader/**"
      - "pocket-tts-studio/**"
      - "pocket-tts-webgpu/**"
      - "chatterbox-test/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          test -s index.html
          test -s openrouter-tts-reader/index.html
          test -s pocket-tts-studio/index.html
          test -s pocket-tts-webgpu/index.html
          node --check pocket-tts-webgpu/js/main.js
          node --check pocket-tts-webgpu/js/audio.js
          node --check pocket-tts-webgpu/js/db.js
          node --check pocket-tts-webgpu/js/tts-engine-complete.js
          mkdir -p _site
          cp index.html _site/index.html
          cp -R openrouter-tts-reader _site/openrouter-tts-reader
          cp -R pocket-tts-studio _site/pocket-tts-studio
          cp -R pocket-tts-webgpu _site/pocket-tts-webgpu
          cp -R chatterbox-test _site/chatterbox-test
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
