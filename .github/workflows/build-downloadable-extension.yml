name: Build downloadable Voicechanger extension

on:
  push:
    branches:
      - feature/ttslab-fast-dictation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ttslab-fast-dictation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show build environment
        run: |
          node --version
          npm --version

      - name: Install build dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build extension bundle
        run: npm run build

      - name: Check out F5-TTS browser engine
        uses: actions/checkout@v4
        with:
          repository: nsarang/voice-cloning-f5-tts
          ref: main
          path: f5tts-upstream

      - name: Build F5-TTS browser engine
        working-directory: f5tts-upstream
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build -- --base=./

      - name: Bundle F5-TTS app into extension
        run: |
          test -s f5tts-upstream/dist/index.html
          mkdir -p dist/f5tts
          cp -R f5tts-upstream/dist/. dist/f5tts/
          test -s dist/f5tts/index.html

      - name: Verify unpacked extension
        run: |
          test -s dist/manifest.json
          test -s dist/voice-clone.js
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log('Manifest V3 verified')"

      - name: Prepare installable ZIP
        run: |
          cd dist
          zip -r ../voicechanger-webgpu.zip .

      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: voicechanger-webgpu-extension
          path: voicechanger-webgpu.zip
          if-no-files-found: error
          retention-days: 30
