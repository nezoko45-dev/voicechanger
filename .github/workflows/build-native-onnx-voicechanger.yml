name: Build Native ONNX VoiceChanger

on:
  push:
    paths:
      - ".github/workflows/build-native-onnx-voicechanger.yml"
      - "native/**"
      - "BuildNativeVoiceChanger.bat"
      - "VoiceChanger.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official ONNX Runtime SDK
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          $actual = (Get-FileHash ort.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "78d447051e48bd2e1e778bba378bec4ece11191c9e538cf7b2c4a4565e8f5581"
          if ($actual -ne $expected) { throw "ONNX Runtime checksum mismatch" }
          Expand-Archive ort.zip deps

      - name: Download bundled voice models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/DogManTC/test-rvc-onnx/resolve/main/GuraTalkV2.onnx?download=true" -OutFile models/GuraTalkV2.onnx
          Invoke-WebRequest -Uri "https://huggingface.co/DogManTC/test-rvc-onnx/resolve/main/vec-768-layer-12.onnx?download=true" -OutFile models/vec-768-layer-12.onnx

      - name: Configure native app
        shell: pwsh
        run: |
          $ort = "$env:GITHUB_WORKSPACE/deps/onnxruntime-win-x64-1.20.1"
          cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64 "-DONNXRUNTIME_ROOT=$ort"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build native/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/models | Out-Null
          Copy-Item native/build/Release/VoiceChanger.exe package/VoiceChanger.exe
          Copy-Item native/build/Release/dvc.dll package/dvc.dll
          Copy-Item native/build/Release/onnxruntime.dll package/onnxruntime.dll
          Copy-Item models/GuraTalkV2.onnx package/models/GuraTalkV2.onnx
          Copy-Item models/vec-768-layer-12.onnx package/models/vec-768-layer-12.onnx
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0VoiceChanger.exe"
          '@ | Set-Content -Encoding ASCII package/Run-VoiceChanger.bat
          Compress-Archive -Path package/* -DestinationPath VoiceChanger-Native-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-Native-Windows
          path: VoiceChanger-Native-Windows.zip
          if-no-files-found: error
