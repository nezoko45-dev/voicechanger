name: Build OpenRouter TTS helper
on:
  workflow_dispatch:
  push:
    branches:
      - feature/openrouter-api-tts-reader
    paths:
      - "openrouter-tts-helper/**"
      - ".github/workflows/build-openrouter-tts-helper.yml"
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish openrouter-tts-helper/OpenRouterTTSHelper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/OpenRouterTTSHelper
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenRouterTTSHelper-windows-x64
          path: artifacts/OpenRouterTTSHelper/OpenRouterTTSHelper.exe
          if-no-files-found: error
          retention-days: 14
