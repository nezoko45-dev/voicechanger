name: Build local Whisper runtime

on:
  push:
    branches: [naturalreader-voice-dictator]
    paths:
      - ".github/workflows/build-whisper.yml"
      - "naturalreader-voice-dictator/whisper-worker.js"
      - "naturalreader-voice-dictator/package.json"
      - "naturalreader-voice-dictator/package-lock.json"
      - "naturalreader-voice-dictator/build-whisper.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: naturalreader-voice-dictator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: naturalreader-voice-dictator/package.json
      - name: Install dependencies
        working-directory: naturalreader-voice-dictator
        run: npm install --no-audit --no-fund
      - name: Build packaged runtime
        working-directory: naturalreader-voice-dictator
        run: npm run build
      - name: Verify generated bundle
        run: |
          test -s naturalreader-voice-dictator/whisper-worker.bundle.js
          test -d naturalreader-voice-dictator/assets
      - name: Commit packaged runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naturalreader-voice-dictator/whisper-worker.bundle.js naturalreader-voice-dictator/assets
          if ! git diff --cached --quiet; then
            git commit -m "Build packaged local Whisper runtime"
            git push origin naturalreader-voice-dictator
          fi
