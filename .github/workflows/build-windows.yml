name: Build Windows Voice Changer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build Windows app
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ONNX-Voice-Changer-Windows
          path: dist/*.exe
