name: Deploy Voicechanger GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/cai-voice-audio-monitor
    paths:
      - "index.html"
      - "c-ai-pages/**"
      - "natural-girl-voice/**"
      - "soundboard/**"
      - ".github/workflows/deploy-cai-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: voicechanger-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site (exclude legacy EXE speech bridge)
        run: |
          mkdir -p public
          cp index.html public/index.html
          if [ -d c-ai-pages ]; then
            cp -R c-ai-pages public/c-ai-pages
          fi
          if [ -d natural-girl-voice ]; then
            cp -R natural-girl-voice public/natural-girl-voice
          fi
          if [ -d soundboard ]; then
            cp -R soundboard public/soundboard
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
