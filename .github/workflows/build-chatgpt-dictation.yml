name: Build ChatGPT Dictation EXE
on:
  push:
    branches: [feature/chatgpt-dictation-exe]
    paths: ["dictation-exe/**", ".github/workflows/build-chatgpt-dictation.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows EXE
        run: dotnet build dictation-exe/ChatGPTDictation.csproj -c Release
      - name: Package EXE
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item dictation-exe/bin/Release/ChatGPTDictation.exe artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPTDictation-Windows
          path: artifacts/ChatGPTDictation.exe
          if-no-files-found: error
