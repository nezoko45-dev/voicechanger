name: Build Kokoro Desktop EXE
on:
  workflow_dispatch:
  push:
    branches: [main, kokoro-webgpu-desktop]
    paths:
      - 'desktop-repeater/**'
      - '.github/workflows/build-kokoro-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-repeater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-repeater/package.json
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Kokoro-Voice-Repeater-Windows-EXE
          path: desktop-repeater/dist/*.exe
          if-no-files-found: error
          retention-days: 14
