name: Build OpenRouter TTS Reader EXE

on:
  workflow_dispatch:
  push:
    branches: [feature/openrouter-tts-reader-native-exe]
    paths:
      - 'openrouter-tts-reader-native/**'
      - '.github/workflows/build-openrouter-tts-reader-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build native Edge TTS helper
        shell: pwsh
        run: cargo build --manifest-path openrouter-tts-reader-native/edge-tts-native/Cargo.toml --release --target x86_64-pc-windows-msvc
      - name: Publish self-contained Windows x64 app
        run: dotnet publish openrouter-tts-reader-native/OpenRouterTtsReader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Include native Edge TTS engine
        shell: pwsh
        run: Copy-Item openrouter-tts-reader-native/edge-tts-native/target/x86_64-pc-windows-msvc/release/edge-tts-native.exe publish/edge-tts-native.exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRouter-TTS-Reader-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
