name: Build OpenRouter TTS Reader EXE

on:
  workflow_dispatch:
  push:
    branches: [feature/openrouter-tts-reader-native-exe]
    paths:
      - 'openrouter-tts-reader-native/**'
      - '.github/workflows/build-openrouter-tts-reader-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build bundled Edge TTS engine with v2 handshake
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.3.1 pyinstaller
          $entry = python -c "import edge_tts, pathlib; print(pathlib.Path(edge_tts.__file__).parent / '__main__.py')"
          pyinstaller --onefile --name edge-tts --collect-all edge_tts --collect-all aiohttp --collect-all certifi $entry
      - name: Publish self-contained Windows x64 app
        run: dotnet publish openrouter-tts-reader-native/OpenRouterTtsReader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Include bundled Edge TTS engine
        run: Copy-Item dist/edge-tts.exe publish/edge-tts.exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRouter-TTS-Reader-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30