<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceChanger — STT / TTS Echo</title><style>body{margin:0;background:#090a10;color:#eee;font:15px system-ui,Segoe UI,sans-serif}main{max-width:900px;margin:40px auto;padding:20px}.card{background:#141722;border:1px solid #303547;border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;border-radius:10px;border:1px solid #343a50;padding:11px;background:#0c0f17;color:#eee}button{cursor:pointer;background:#6656d9;font-weight:700}.danger{background:#552638}.wide{width:100%;box-sizing:border-box}.status{padding:12px;border-radius:10px;background:#0c0f17;margin-top:12px}.transcript{font-size:24px;min-height:70px;padding:14px;background:#0c0f17;border-radius:12px;white-space:pre-wrap}.muted{color:#9299aa;font-size:13px}audio{width:100%;margin-top:12px}.voice{display:grid;gap:9px}.small{font-size:12px;color:#9299aa}</style></head><body><main>
<h1>🎙 VoiceChanger Echo</h1><div class="muted">Speak → Deepgram STT → OpenVoice V2 cloned TTS → playback</div>
<div class="card"><h3>Connection</h3><div class="row"><input id="dg" class="wide" type="password" placeholder="Deepgram API key"><input id="backend" value="http://127.0.0.1:8765" placeholder="Backend URL"></div><div class="row" style="margin-top:10px"><button id="start">▶ Start echo</button><button id="stop" class="danger" disabled>■ Stop</button></div><div id="status" class="status">Ready.</div></div>
<div class="card"><h3>Voice cloning</h3><div class="voice"><label>Choose any reference voice file<input id="voice" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac"></label><label>Voice profile<select id="profile"><option value="custom">Custom uploaded voice</option></select></label></div><div id="voiceName" class="small">No voice selected.</div><div class="muted" style="margin-top:8px">Use a voice you own or have permission to clone. A clear 3–15 second sample is recommended.</div></div>
<div class="card"><h3>Live transcript</h3><div id="transcript" class="transcript">Nothing heard yet.</div></div>
<div class="card"><h3>Last generated reply</h3><div id="reply" class="transcript">—</div><audio id="audio" controls></audio></div>
</main><script>
let running=false,accepting=true,stream=null,ws=null,voiceB64=null;
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;
$('voice').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer();let bin='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode(...u.subarray(i,i+0x8000));voiceB64=btoa(bin);$('voiceName').textContent='Selected: '+f.name;$('profile').innerHTML='<option value="custom">'+f.name.replace(/[<>]/g,'')+'</option>';status('Voice profile loaded.')};
function dgUrl(){return 'wss://api.deepgram.com/v1/listen?model=nova-3&language=en-US&smart_format=true&interim_results=true&endpointing=450&utterance_end_ms=1000'}
async function generate(text){if(!voiceB64){status('Choose a clone/reference voice first.');return}accepting=false;status('Generating cloned voice…');try{const r=await fetch($('backend').value.replace(/\/$/,'')+'/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,reference_base64:voiceB64,reference_name:$('voice').files[0]?.name||'voice.wav'})});if(!r.ok)throw Error(await r.text());const d=await r.json();$('reply').textContent=text;$('audio').src='data:audio/wav;base64,'+d.audio_base64;$('audio').onended=()=>{if(running){accepting=true;status('Listening… say something.')}};await $('audio').play();if($('audio').paused){accepting=true;status('Audio ready — press play if autoplay was blocked.')}}catch(e){accepting=true;status('TTS error: '+e.message)}}
$('start').onclick=async()=>{try{const key=$('dg').value.trim();if(!key)throw Error('Enter your Deepgram API key.');if(!voiceB64)throw Error('Choose a voice sample first.');stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ws=new WebSocket(dgUrl(),['token',key]);ws.binaryType='arraybuffer';ws.onopen=()=>{running=true;accepting=true;$('start').disabled=true;$('stop').disabled=false;status('Listening… say something.');const rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(running&&ws.readyState===1&&e.data.size)ws.send(e.data)};rec.start(250);window._rec=rec};ws.onmessage=e=>{const d=JSON.parse(e.data),a=d.channel?.alternatives?.[0];if(!a)return;const t=(a.transcript||'').trim();if(t){$('transcript').textContent=t;if(d.is_final&&t.length>1&&accepting)generate(t)}};ws.onerror=()=>status('Deepgram connection error. Check the key and network.');ws.onclose=e=>{if(running)status('Deepgram disconnected ('+e.code+').')}}catch(e){status('Start error: '+e.message)}};
$('stop').onclick=()=>{running=false;accepting=false;try{window._rec?.stop()}catch{}stream?.getTracks().forEach(t=>t.stop());try{ws?.close()}catch{}ws=null;$('start').disabled=false;$('stop').disabled=true;status('Stopped.')};
</script></body></html>
