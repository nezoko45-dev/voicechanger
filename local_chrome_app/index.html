<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Pocket TTS Voice Changer</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:760px;margin:32px auto;padding:20px}.card{border:1px solid #444;border-radius:14px;padding:18px;margin:14px 0;background:#181818}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:240px}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}button{cursor:pointer}button:disabled{opacity:.45}#status{padding:10px;border-radius:8px;background:#222}.ok{background:#16351e!important}.err{background:#401b1b!important}.hint{font-size:13px;opacity:.75}.meter{height:8px;background:#333;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#7fdc88}#log{white-space:pre-wrap;font-size:12px;opacity:.8;max-height:240px;overflow:auto}</style></head>
<body><h1>Local Pocket TTS</h1><p>Chrome mic → local speech recognition → Pocket TTS → cloned WAV → automatic audio player/output.</p>
<div class="card"><div id="status">Loading Pocket TTS…</div><div class="meter"><i id="progress"></i></div>
<div class="row"><label>Microphone<select id="mic"><option value="">Click Refresh / allow microphone</option></select></label><label>Output<select id="out"><option value="default">Default output</option></select></label></div>
<div class="row"><button id="refresh">🔄 Refresh audio devices</button><button id="pickout">🔊 Choose speaker</button></div>
<label>Reference WAV<input id="wav" type="file" accept=".wav,audio/wav"></label>
<div class="row"><button id="start" disabled>START</button><button id="stop" disabled>STOP</button><button id="clear">Clear model cache</button></div></div>
<div class="card"><b>Transcript</b><div id="text"></div></div><div class="card"><b>Generated audio — auto plays after each detected utterance</b><audio id="player" controls autoplay playsinline></audio></div><div id="log"></div>
<script type="module">
import {PocketTTS} from '../pocket-tts/index.js';
import {StreamingPlayer,chunksToWavBlob} from '../pocket-tts/player.js';
const $=id=>document.getElementById(id);let tts=null,streamPlayer=null,rec=null,stream=null,running=false,voiceRef=null,chunks=[];let selectedOutput='default',playToken=0;
const log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight};
const status=(x,c='')=>{$('status').textContent=x;$('status').className=c};
function addOutput(id,label){if(!id)return;let o=[...$('out').options].find(x=>x.value===id);if(!o){o=new Option(label||'Selected speaker',id);$('out').add(o)}$('out').value=id;selectedOutput=id}
async function devices(){try{const ds=await navigator.mediaDevices.enumerateDevices();const oldMic=$('mic').value;const oldOut=selectedOutput||'default';const ins=ds.filter(d=>d.kind==='audioinput'),outs=ds.filter(d=>d.kind==='audiooutput');$('mic').innerHTML='';$('out').innerHTML='';if(!ins.length)$('mic').add(new Option('No microphones found',''));for(const d of ins)$('mic').add(new Option(d.label||`Microphone ${$('mic').length+1}`,d.deviceId));$('out').add(new Option('Default output','default'));for(const d of outs)if(d.deviceId!=='default')addOutput(d.deviceId,d.label||`Output ${$('out').length+1}`);if(oldMic&&[...$('mic').options].some(o=>o.value===oldMic))$('mic').value=oldMic;if(oldOut&&[...$('out').options].some(o=>o.value===oldOut))$('out').value=oldOut;log(`Audio devices: ${ins.length} microphone(s), ${outs.length} output(s)`)}catch(e){log('Device error: '+e.message)}}
async function requestMic(){const id=$('mic').value;stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await devices()}
async function chooseOutput(){try{if(!navigator.mediaDevices?.selectAudioOutput){status('Speaker picker unavailable in this Chrome build.','err');log('selectAudioOutput() unavailable; using Default output.');return}status('🔊 Choose your Windows speaker…');const d=await navigator.mediaDevices.selectAudioOutput();addOutput(d.deviceId,d.label||'Selected speaker');if(streamPlayer)await streamPlayer.setSinkId(d.deviceId);status('🔊 Speaker selected: '+(d.label||d.deviceId),'ok');log('Selected output: '+(d.label||d.deviceId))}catch(e){log('Output picker: '+e.name+': '+e.message);status('Speaker selection cancelled','err')}}
async function refresh(){try{await requestMic();await devices()}catch(e){status('🔴 Audio permission failed','err');log(e.stack||e.message)}}
async function init(){try{tts=new PocketTTS({language:'english_2026-04',quantized:true,voiceCloning:true,cache:true,maxThreads:1,maxReferenceSeconds:6});await tts.load(i=>{if(i.total)$('progress').style.width=Math.round(i.loaded/i.total*100)+'%';if(i.label)status('Loading '+i.label+'…')});status('Pocket TTS ready. Choose a WAV.','ok');$('start').disabled=false;await devices()}catch(e){status('🔴 Pocket TTS load error','err');log('LOAD ERROR: '+(e.stack||e.message))}}
async function clone(){const f=$('wav').files[0];if(!f)throw Error('Choose a WAV reference first.');if(!tts?.ready)throw Error('Pocket TTS is not ready yet.');status('Cloning WAV…');log('Cloning '+f.name+' ('+Math.round(f.size/1024)+' KB)…');const ctx=new AudioContext();try{const b=await ctx.decodeAudioData(await f.arrayBuffer());const mono=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){const ch=b.getChannelData(c);for(let i=0;i<b.length;i++)mono[i]+=ch[i]/b.numberOfChannels}log(`Reference decoded: ${b.sampleRate} Hz, ${b.numberOfChannels} channel(s), ${b.duration.toFixed(2)} sec`);voiceRef=await tts.cloneVoice(mono,{inputSampleRate:b.sampleRate,name:'local-reference'});log('Voice embedding created: '+voiceRef);await tts.finishLoad();log('Synthesis models ready: '+String(!!tts.bundle?.synthesisReady));status('Voice cloned. Ready.','ok')}finally{await ctx.close()}}
function recognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)throw Error('Chrome SpeechRecognition is unavailable.');const r=new R();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onstart=()=>status('🟢 Listening','ok');r.onresult=async e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const text=e.results[i][0].transcript.trim();if(text){$('text').textContent=text;await speak(text)}}};r.onerror=e=>log('STT error: '+e.error);r.onend=()=>{if(running)setTimeout(()=>{try{r.start()}catch{}},120)};return r}
async function speak(text){if(!voiceRef||!running)return;const myToken=++playToken;try{status('🔊 Generating…','ok');log('TTS request: '+text);chunks=[];if(streamPlayer)streamPlayer.reset();const metrics=await tts.generate(text,{voice:voiceRef,onChunk:a=>{const x=a instanceof Float32Array?a:new Float32Array(a);chunks.push(x.slice());if(streamPlayer){try{streamPlayer.play(x)}catch(e){log('Audio playback error: '+e.message)}}}});if(myToken!==playToken||!running)return;const blob=chunksToWavBlob(chunks,tts.sampleRate);const old=$('player').src;if(old)URL.revokeObjectURL(old);$('player').src=URL.createObjectURL(blob);$('player').currentTime=0;try{await $('player').play();log('🔊 Audio player auto-played.')}catch(e){log('Audio player autoplay blocked: '+e.message+' — click the player once to authorize audio.')}log(`TTS complete: ${metrics.audioDuration.toFixed(2)} sec audio, ${metrics.genTime.toFixed(2)} sec generation, RTFx ${metrics.rtfx.toFixed(2)}`);status('🟢 Listening','ok')}catch(e){log('TTS ERROR: '+(e.stack||e.message));status('🔴 TTS failed: '+e.message,'err')}}
$('wav').onchange=async()=>{try{await clone()}catch(e){log('CLONE ERROR: '+(e.stack||e.message));status('🔴 Clone failed: '+e.message,'err')}};$('refresh').onclick=refresh;$('pickout').onclick=chooseOutput;$('mic').onchange=async()=>{try{await requestMic()}catch(e){log('Mic error: '+e.message)}};$('out').onchange=async()=>{selectedOutput=$('out').value;try{if(streamPlayer)await streamPlayer.setSinkId(selectedOutput)}catch(e){log('Output error: '+e.message)}};
$('start').onclick=async()=>{try{if(!voiceRef)await clone();await requestMic();if(!streamPlayer)streamPlayer=new StreamingPlayer({sampleRate:tts.sampleRate,playbackRate:1});await streamPlayer.resume();if(selectedOutput)await streamPlayer.setSinkId(selectedOutput);rec=recognition();running=true;rec.start();$('start').disabled=true;$('stop').disabled=false;status('🟢 Listening','ok')}catch(e){log('START ERROR: '+(e.stack||e.message));status('🔴 '+e.message,'err')}};
$('stop').onclick=async()=>{running=false;++playToken;try{rec?.stop()}catch{};stream?.getTracks().forEach(t=>t.stop());try{await tts.stop()}catch{};streamPlayer?.stop();$('player').pause();$('start').disabled=false;$('stop').disabled=true;status('Stopped')};$('clear').onclick=async()=>{await PocketTTS.clearCache();location.reload()};navigator.mediaDevices?.addEventListener('devicechange',devices);devices();init();
</script></body></html>
