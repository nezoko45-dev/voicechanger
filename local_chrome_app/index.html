<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Pocket TTS Voice Changer</title><style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:760px;margin:32px auto;padding:20px}.card{border:1px solid #444;border-radius:14px;padding:18px;margin:14px 0;background:#181818}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:4px;flex:1}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}button{cursor:pointer}button:disabled{opacity:.45}#status{padding:10px;border-radius:8px;background:#222}.ok{background:#16351e!important}.err{background:#401b1b!important}#log{white-space:pre-wrap;font-size:12px;opacity:.7;max-height:180px;overflow:auto}.meter{height:8px;background:#333;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#7fdc88}</style></head><body><h1>Local Pocket TTS</h1><p>Chrome mic → speech recognition → Pocket TTS → cloned WAV → selected output.</p><div class="card"><div id="status">Loading Pocket TTS…</div><div class="meter"><i id="progress"></i></div><div class="row"><label>Microphone<select id="mic"></select></label><label>Output<select id="out"></select></label></div><label>Reference WAV<input id="wav" type="file" accept=".wav,audio/wav"></label><div class="row"><button id="start" disabled>START</button><button id="stop" disabled>STOP</button><button id="clear">Clear model cache</button></div></div><div class="card"><b>Transcript</b><div id="text"></div></div><div class="card"><b>Generated audio</b><audio id="player" controls></audio></div><div id="log"></div><script type="module">
import {PocketTTS} from '../pocket-tts/index.js';
import {StreamingPlayer,chunksToWavBlob} from '../pocket-tts/player.js';
const $=id=>document.getElementById(id);let tts=null,player=null,rec=null,stream=null,running=false,voiceRef=null,chunks=[];
const log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight};const status=(x,c='')=>{$('status').textContent=x;$('status').className=c};
async function devices(){try{const ds=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';$('out').innerHTML='';for(const d of ds){if(d.kind==='audioinput')$('mic').add(new Option(d.label||'Microphone',d.deviceId));if(d.kind==='audiooutput')$('out').add(new Option(d.label||'Default output',d.deviceId));}}catch(e){log('Device error: '+e.message)}}
async function init(){try{tts=new PocketTTS({language:'english_2026-04',quantized:true,voiceCloning:true,cache:true,maxThreads:1,maxReferenceSeconds:6});await tts.load(i=>{if(i.total)$('progress').style.width=Math.round(i.loaded/i.total*100)+'%';status('Loading '+(i.label||'Pocket TTS')+'…')});status('Pocket TTS ready. Choose a WAV.','ok');$('start').disabled=false;await devices()}catch(e){status('Pocket TTS load error','err');log(e.stack||e.message)}}
async function clone(){const f=$('wav').files[0];if(!f)throw Error('Choose a WAV reference first.');status('Cloning WAV…');const ctx=new AudioContext();const b=await ctx.decodeAudioData(await f.arrayBuffer());const mono=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){const ch=b.getChannelData(c);for(let i=0;i<b.length;i++)mono[i]+=ch[i]/b.numberOfChannels}voiceRef=await tts.cloneVoice(mono,{inputSampleRate:b.sampleRate,name:'local-reference'});await tts.finishLoad();await ctx.close();status('Voice cloned. Ready.','ok');log('Cloned '+f.name)}
function recognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)throw Error('Chrome SpeechRecognition is unavailable.');const r=new R();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onstart=()=>status('🟢 Listening','ok');r.onresult=async e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const text=e.results[i][0].transcript.trim();if(text){$('text').textContent=text;await speak(text)}}};r.onerror=e=>log('STT: '+e.error);r.onend=()=>{if(running)setTimeout(()=>{try{r.start()}catch{}},120)};return r}
async function speak(text){if(!voiceRef||!running)return;try{status('🔊 '+text,'ok');chunks=[];player.reset();await tts.generate(text,{voice:voiceRef,onChunk:a=>{const x=a instanceof Float32Array?a:new Float32Array(a);chunks.push(x.slice());player.play(x)}});$('player').src=URL.createObjectURL(chunksToWavBlob(chunks,tts.sampleRate));status('🟢 Listening','ok')}catch(e){log('TTS error: '+(e.stack||e.message));status('🔴 TTS failed','err')}}
$('wav').onchange=async()=>{try{await clone()}catch(e){log(e.stack||e.message);status('🔴 Clone failed','err')}};
$('start').onclick=async()=>{try{if(!voiceRef)await clone();stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});player=new StreamingPlayer({sampleRate:tts.sampleRate,playbackRate:1});await player.resume();if($('out').value)await player.setSinkId($('out').value);rec=recognition();running=true;rec.start();$('start').disabled=true;$('stop').disabled=false}catch(e){log(e.stack||e.message);status('🔴 '+e.message,'err')}};
$('stop').onclick=async()=>{running=false;try{rec?.stop()}catch{};stream?.getTracks().forEach(t=>t.stop());try{await tts.stop()}catch{};player?.stop();$('start').disabled=false;$('stop').disabled=true;status('Stopped')};$('out').onchange=()=>player?.setSinkId($('out').value).catch(e=>log(e.message));$('clear').onclick=async()=>{await PocketTTS.clearCache();location.reload()};navigator.mediaDevices?.addEventListener('devicechange',devices);devices();init();
</script></body></html>
