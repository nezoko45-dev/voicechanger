<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenVoice V2 Streaming</title><style>body{margin:0;background:#111;color:#eee;font:15px system-ui,sans-serif}main{max-width:760px;margin:30px auto;padding:24px;background:#1b1b1b;border-radius:16px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#242424;color:#fff;margin:5px 0}button{cursor:pointer}.row{display:grid;gap:7px;margin:14px 0}.buttons{display:flex;gap:10px}.status{margin-top:15px;padding:12px;background:#0d0d0d;border-radius:9px;white-space:pre-wrap}.ok{color:#8cff9a}.warn{color:#ffd36b}.bad{color:#ff7d7d}</style></head><body><main><h1>🎙️ OpenVoice V2 Streaming Voice Changer</h1><div class="row"><label>Reference voice</label><input id="ref" type="file" accept="audio/*"></div><div class="row"><label>Microphone</label><select id="mic"></select></div><div class="row"><label>Chrome output</label><select id="out"><option value="default">Default output</option></select></div><div class="buttons"><button id="refresh">Refresh</button><button id="start">START</button><button id="stop" disabled>STOP</button></div><div id="status" class="status">Loading…</div></main><script>
const $=x=>document.getElementById(x);const SR=16000,WINDOW=.608,TARGET=SR*WINDOW,PREBUFFER=.15,MAX_BUFFER=.40;let stream,ctx,outCtx,src,proc,gain,ws,pcm=new Int16Array(0),stopped=true,busy=false,ring=new Float32Array(0),playing=false,playerNode=null;
const status=(x,c='')=>{$('status').textContent=x;$('status').className='status '+c};
async function refresh(){try{await navigator.mediaDevices.getUserMedia({audio:true});const d=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';d.filter(x=>x.kind==='audioinput').forEach(x=>{let o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||'Microphone';$('mic').append(o)});$('out').innerHTML='<option value="default">Default output</option>';d.filter(x=>x.kind==='audiooutput').forEach(x=>{let o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||'Output';$('out').append(o)});status('Chrome audio devices ready.','ok')}catch(e){status('Device error: '+e,'bad')}}
function wav(samples,sr){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*(samples[i]<0?32768:32767),true);return new Blob([b],{type:'audio/wav'})}
async function ref(){let f=$('ref').files[0];if(!f)throw Error('Choose a reference audio file first');let a=new AudioContext(),d=await a.decodeAudioData(await f.arrayBuffer());await a.close();let n=Math.round(d.duration*22050),x=new Float32Array(n);for(let i=0;i<n;i++){let p=i*(d.length-1)/(n-1||1),q=Math.floor(p),r=Math.min(q+1,d.length-1),t=p-q,s=0;for(let c=0;c<d.numberOfChannels;c++){let z=d.getChannelData(c);s+=z[q]*(1-t)+z[r]*t}x[i]=s/d.numberOfChannels}let fd=new FormData();fd.append('file',wav(x,22050),'reference.wav');let r=await fetch('/reference',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text())}
function append(a){let n=new Int16Array(pcm.length+a.length);n.set(pcm);n.set(a,pcm.length);pcm=n}
function worklet(){return `class M extends AudioWorkletProcessor{process(i){let x=i[0]?.[0];if(x){let b=new ArrayBuffer(x.length*2),v=new DataView(b);for(let n=0;n<x.length;n++){let s=Math.max(-1,Math.min(1,x[n]));v.setInt16(n*2,s<0?s*32768:s*32767,true)}this.port.postMessage(b,[b])}return true}}registerProcessor('m',M)`}
function appendConverted(buf){let a=new Float32Array(buf);let peak=0;for(let i=0;i<a.length;i++)peak=Math.max(peak,Math.abs(a[i]));if(peak>0.00001){const target=.78/peak;const scale=Math.min(target,4.0);for(let i=0;i<a.length;i++)a[i]*=scale}let n=new Float32Array(ring.length+a.length);n.set(ring);n.set(a,ring.length);if(n.length>SR*MAX_BUFFER)n=n.slice(n.length-SR*MAX_BUFFER);ring=n;status(`StreamingPlayer buffer: ${(ring.length/SR*1000).toFixed(0)} ms\nOutput normalized for clear volume.`,'ok')}
function player(){if(!playing&&!stopped&&ring.length>=SR*PREBUFFER){playing=true;playerNode=outCtx.createScriptProcessor(1024,0,1);playerNode.onaudioprocess=e=>{let o=e.outputBuffer.getChannelData(0),n=Math.min(o.length,ring.length);o.fill(0);if(n)o.set(ring.subarray(0,n));if(n<o.length&&ring.length){}if(n)ring=ring.slice(n);if(stopped){playerNode.disconnect();playerNode=null;playing=false}};playerNode.connect(outCtx.destination)}}
async function start(){try{await ref();outCtx=new AudioContext({sampleRate:SR});await outCtx.resume();if(outCtx.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){}stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:SR});await ctx.resume();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet()],{type:'application/javascript'})));src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'m');gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);ws=new WebSocket(`ws://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onopen=()=>{stopped=false;ws.send(JSON.stringify({sampleRate:SR,windowSeconds:WINDOW}));status('OpenVoice ready — amplified continuous StreamingPlayer active at 608ms windows.','warn')};proc.port.onmessage=e=>{append(new Int16Array(e.data));pump()};ws.onmessage=async e=>{if(typeof e.data==='string'){busy=false;status(e.data);pump();return}busy=false;try{const ab=await outCtx.decodeAudioData(e.data.slice(0));appendConverted(ab.getChannelData(0));player();pump()}catch(err){status('Converted audio decode failed: '+err,'bad');pump()}};ws.onerror=()=>{busy=false;status('WebSocket error','bad');pump()};ws.onclose=()=>{if(!stopped)status('Converter connection closed','warn')};$('start').disabled=true;$('stop').disabled=false}catch(e){status('Start failed: '+e,'bad');stop()}}
function pump(){if(!busy&&!stopped&&ws?.readyState===1&&pcm.length>=TARGET){busy=true;let x=pcm.slice(0,TARGET);pcm=pcm.slice(TARGET);ws.send(x.buffer)}}
function stop(){stopped=true;busy=false;playing=false;pcm=new Int16Array(0);ring=new Float32Array(0);try{playerNode?.disconnect();proc?.disconnect();src?.disconnect();gain?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();outCtx?.close();ws?.close()}catch(e){}playerNode=null;$('start').disabled=false;$('stop').disabled=true}$('refresh').onclick=refresh;$('start').onclick=start;$('stop').onclick=stop;$('out').onchange=async()=>{if(outCtx?.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){status('Output selection failed: '+e,'bad')}};refresh();</script></body></html>
