<!doctype html><html lang="en"><body style="background:#111;color:#eee;font:15px system-ui;padding:24px"><h1>OpenVoice V2 Chrome Audio</h1><input id="ref" type="file" accept="audio/*"><br><select id="mic"></select><br><select id="out"><option value="default">Default output</option></select><br><button id="refresh">Refresh</button><button id="start">START</button><button id="stop" disabled>STOP</button><pre id="status">Loading…</pre><script>
const $=x=>document.getElementById(x);let stream,ctx,outCtx,src,proc,gain,ws,pcm=new Int16Array(0),busy=false,stopped=true,nextPlay=0;const WINDOW=.608;
const status=(x,c='')=>{$('status').textContent=x;$('status').className=c};
async function refresh(){try{await navigator.mediaDevices.getUserMedia({audio:true});let ds=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';ds.filter(d=>d.kind==='audioinput').forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Microphone';$('mic').append(o)});$('out').innerHTML='<option value="default">Default output</option>';ds.filter(d=>d.kind==='audiooutput').forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Output';$('out').append(o)});status('Chrome microphone/output devices ready.')}catch(e){status('Device error: '+e)}}
function wav(samples,sr){let n=samples.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){let s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(44+i*2,s<0?s*32768:s*32767,true)}return new Blob([b],{type:'audio/wav'})}
async function ref(){let f=$('ref').files[0];if(!f)throw Error('Choose reference audio first');let a=new AudioContext(),d;try{d=await a.decodeAudioData(await f.arrayBuffer())}finally{await a.close()}let sr=22050,n=Math.max(1,Math.round(d.duration*sr)),x=new Float32Array(n);for(let i=0;i<n;i++){let p=i*(d.length-1)/(n-1||1),q=Math.floor(p),r=Math.min(q+1,d.length-1),t=p-q,sum=0;for(let c=0;c<d.numberOfChannels;c++){let ch=d.getChannelData(c);sum+=ch[q]*(1-t)+ch[r]*t}x[i]=sum/d.numberOfChannels}let fd=new FormData();fd.append('file',wav(x,sr),'reference.wav');let r=await fetch('/reference',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());status('Reference loaded.','ok')}
async function play(bytes){if(stopped)return;if(outCtx.state==='suspended')await outCtx.resume();let ab=await outCtx.decodeAudioData(bytes.slice(0));if(!ab.duration)throw Error('Converted WAV has zero duration');let s=outCtx.createBufferSource();s.buffer=ab;s.connect(outCtx.destination);let now=outCtx.currentTime;let t=Math.max(nextPlay,now+.005);s.start(t);nextPlay=t+ab.duration;status(`Converted WAV received: ${(bytes.byteLength/1024).toFixed(0)} KB\nPlaying through Chrome output: ${$('out').selectedOptions[0]?.textContent||'Default'}\nAudio duration: ${ab.duration.toFixed(3)}s`,'ok')}
function append(a){let n=new Int16Array(pcm.length+a.length);n.set(pcm);n.set(a,pcm.length);pcm=n}
function pump(){let n=Math.floor(16000*WINDOW);if(!busy&&!stopped&&ws?.readyState===1&&pcm.length>=n){busy=true;let x=pcm.slice(0,n);pcm=pcm.slice(n);ws.send(x.buffer)}}
function worklet(){return `class M extends AudioWorkletProcessor{process(i){let x=i[0]?.[0];if(x){let b=new ArrayBuffer(x.length*2),v=new DataView(b);for(let n=0;n<x.length;n++){let s=Math.max(-1,Math.min(1,x[n]));v.setInt16(n*2,s<0?s*32768:s*32767,true)}this.port.postMessage(b,[b])}return true}}registerProcessor('m',M)`}
async function start(){try{await ref();outCtx=new AudioContext({sampleRate:22050});await outCtx.resume();if(outCtx.setSinkId)await outCtx.setSinkId($('out').value||'default');nextPlay=outCtx.currentTime+.02;stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:16000});await ctx.resume();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet()],{type:'application/javascript'})));src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'m');gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.binaryType='arraybuffer';ws.onopen=()=>{stopped=false;ws.send(JSON.stringify({sampleRate:16000,windowSeconds:WINDOW}));status('OpenVoice V2 connected. Converting 608ms windows…','warn')};proc.port.onmessage=e=>{append(new Int16Array(e.data));pump()};ws.onmessage=async e=>{if(typeof e.data==='string'){busy=false;status(e.data,e.data.toLowerCase().includes('error')?'bad':'warn');pump();return}try{busy=false;await play(e.data);pump()}catch(err){busy=false;status('Chrome playback error: '+err,'bad');pump()}};ws.onerror=()=>{busy=false;status('WebSocket error','bad');pump()};ws.onclose=()=>{busy=false;if(!stopped)status('Converter connection closed','bad')};$('start').disabled=true;$('stop').disabled=false}catch(e){status('Start failed: '+e,'bad');stop()}}
function stop(){stopped=true;busy=false;pcm=new Int16Array(0);nextPlay=0;try{proc?.disconnect();src?.disconnect();gain?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();outCtx?.close();ws?.close()}catch(e){}proc=src=gain=stream=ctx=outCtx=ws=null;$('start').disabled=false;$('stop').disabled=true}
$('refresh').onclick=refresh;$('start').onclick=start;$('stop').onclick=stop;$('out').onchange=async()=>{if(outCtx?.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){status('Output selection error: '+e,'bad')}};refresh();</script></body></html>
