<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenVoice V2 Chrome Audio Voice Changer</title><style>body{margin:0;background:#111;color:#eee;font:15px system-ui,sans-serif}main{max-width:760px;margin:30px auto;padding:24px;background:#1b1b1b;border-radius:16px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#242424;color:#fff;margin:5px 0}button{cursor:pointer}.row{display:grid;gap:7px;margin:14px 0}.buttons{display:flex;gap:10px}.status{margin-top:15px;padding:12px;background:#0d0d0d;border-radius:9px;white-space:pre-wrap}.ok{color:#8cff9a}.warn{color:#ffd36b}.bad{color:#ff7d7d}small{color:#aaa}</style></head><body><main><h1>🎙️ OpenVoice V2 Chrome Audio Voice Changer</h1><p>Chrome handles microphone capture and converted-audio playback. The local server is only the OpenVoice inference bridge.</p><div class="row"><label>Reference WAV / audio</label><input id="ref" type="file" accept="audio/*"><small>Reference is normalized to mono 22.05 kHz PCM WAV.</small></div><div class="row"><label>Microphone</label><select id="mic"><option>Click Refresh Devices</option></select></div><div class="row"><label>Chrome audio output</label><select id="out"><option value="default">Default output</option></select></div><div class="buttons"><button id="refresh">Refresh devices</button><button id="start">START</button><button id="stop" disabled>STOP</button></div><div id="status" class="status">Checking local OpenVoice server…</div></main><script>
const $=id=>document.getElementById(id);let stream,ctx,outCtx,src,proc,gain,ws,pcm=new Int16Array(0),busy=false,stopped=true,nextPlay=0;
function status(t,c=''){ $('status').textContent=t;$('status').className='status '+c }
async function refresh(){try{await navigator.mediaDevices.getUserMedia({audio:true});const ds=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';ds.filter(d=>d.kind==='audioinput').forEach(d=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Microphone';$('mic').appendChild(o)});$('out').innerHTML='<option value="default">Default output</option>';ds.filter(d=>d.kind==='audiooutput').forEach(d=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Output';$('out').appendChild(o)});status('Chrome audio devices ready.','ok')}catch(e){status('Device error: '+e,'bad')}}
function pcmToWav(samples,sr){const ab=new ArrayBuffer(44+samples.length*2),v=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+samples.length*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,samples.length*2,true);let p=44;for(const x of samples){const s=Math.max(-1,Math.min(1,x));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function normalizedReference(){const f=$('ref').files[0];if(!f)throw Error('Choose a reference audio file first');const raw=await f.arrayBuffer(),ac=new AudioContext();let decoded;try{decoded=await ac.decodeAudioData(raw.slice(0))}finally{await ac.close()}const target=22050,channels=decoded.numberOfChannels,frames=Math.max(1,Math.round(decoded.duration*target)),samples=new Float32Array(frames);for(let i=0;i<frames;i++){const pos=i*(decoded.length-1)/(frames-1||1),a=Math.floor(pos),b=Math.min(a+1,decoded.length-1),t=pos-a;let sum=0;for(let c=0;c<channels;c++){const ch=decoded.getChannelData(c);sum+=ch[a]*(1-t)+ch[b]*t}samples[i]=sum/channels}return pcmToWav(samples,target)}
async function uploadRef(){status('Normalizing reference audio…','warn');const wav=await normalizedReference(),fd=new FormData();fd.append('file',wav,'reference_normalized.wav');const r=await fetch('/reference',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());return r.json()}
async function scheduleConverted(bytes){try{if(stopped)return;if(outCtx.state==='suspended')await outCtx.resume();if(outCtx.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){}const ab=await outCtx.decodeAudioData(bytes.slice(0));const source=outCtx.createBufferSource();source.buffer=ab;source.connect(outCtx.destination);const now=outCtx.currentTime;const startAt=Math.max(nextPlay,now+0.015);source.start(startAt);nextPlay=startAt+ab.duration;status(`Chrome audio playback active\nConverted audio: ${ab.duration.toFixed(2)}s\nPlayback lead: ${Math.max(0,nextPlay-now).toFixed(2)}s`,'ok')}catch(e){status('Chrome converted-audio playback failed: '+e,'bad')}}
function appendPCM(a){const n=new Int16Array(pcm.length+a.length);n.set(pcm);n.set(a,pcm.length);pcm=n}
function takeWindow(n){if(pcm.length>n*2)pcm=pcm.slice(pcm.length-n);if(pcm.length<n)return null;const x=pcm.slice(0,n);pcm=pcm.slice(n);return x.buffer}
function worklet(){return `class MicProcessor extends AudioWorkletProcessor{process(i){const x=i[0]&&i[0][0];if(x){let b=new ArrayBuffer(x.length*2),v=new DataView(b);for(let n=0;n<x.length;n++){let s=Math.max(-1,Math.min(1,x[n]));v.setInt16(n*2,s<0?s*32768:s*32767,true)}this.port.postMessage(b,[b])}return true}}registerProcessor('mic-processor',MicProcessor)`}
async function start(){try{await uploadRef();const h=await fetch('/health');if(!h.ok)throw Error('Local OpenVoice server health check failed');outCtx=new AudioContext({sampleRate:22050});await outCtx.resume();if(outCtx.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){}nextPlay=outCtx.currentTime+0.05;stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:16000});await ctx.resume();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet()],{type:'application/javascript'})));src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'mic-processor');gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.binaryType='arraybuffer';ws.onopen=()=>{stopped=false;ws.send(JSON.stringify({sampleRate:16000}));status('OpenVoice V2 loading…','warn')};ws.onmessage=e=>{if(typeof e.data==='string'){busy=false;const isError=e.data.toLowerCase().includes('error');status(e.data,isError?'bad':'ok');pump();return}busy=false;scheduleConverted(e.data);pump()};ws.onerror=()=>{busy=false;status('WebSocket error. Make sure start_openvoice.bat is running.','bad');pump()};ws.onclose=()=>{busy=false;if(!stopped)status('Converter connection closed.','warn')};proc.port.onmessage=e=>{appendPCM(new Int16Array(e.data));pump()};$('start').disabled=true;$('stop').disabled=false}catch(e){status('Start failed: '+e,'bad');stop()}}
function pump(){const need=Math.floor(16000*0.50);if(!busy&&ws&&ws.readyState===1&&pcm.length>=need&&!stopped){busy=true;ws.send(takeWindow(need))}}
function stop(){stopped=true;busy=false;pcm=new Int16Array(0);nextPlay=0;if(proc)proc.disconnect();if(src)src.disconnect();if(gain)gain.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();if(outCtx)outCtx.close();if(ws)ws.close();proc=src=gain=stream=ctx=outCtx=ws=null;$('start').disabled=false;$('stop').disabled=true}
$('refresh').onclick=refresh;$('start').onclick=start;$('stop').onclick=stop;$('out').onchange=async()=>{if(outCtx?.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){status('Chrome output selection failed: '+e,'bad')}};$('ref').onchange=()=>status('Reference selected.','ok');refresh();</script></main></body></html>
