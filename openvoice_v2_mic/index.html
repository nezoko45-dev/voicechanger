<!doctype html><html><body><h1>OpenVoice V2 Chrome Audio</h1><input id="ref" type="file" accept="audio/*"><select id="mic"></select><select id="out"><option value="default">Default output</option></select><button id="refresh">Refresh</button><button id="start">START</button><button id="stop" disabled>STOP</button><pre id="status">Loading…</pre><script>
const $=x=>document.getElementById(x);let stream,ctx,outCtx,src,proc,gain,ws,pcm=new Int16Array(0),busy=false,stopped=true,nextPlay=0;const WINDOW=.5;
const status=(x,c='')=>{$('status').textContent=x;$('status').className=c};
async function refresh(){try{await navigator.mediaDevices.getUserMedia({audio:true});let ds=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';ds.filter(d=>d.kind==='audioinput').forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Microphone';$('mic').append(o)});$('out').innerHTML='<option value="default">Default output</option>';ds.filter(d=>d.kind==='audiooutput').forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Output';$('out').append(o)});status('Chrome audio ready')}catch(e){status('Device error: '+e)}}
async function ref(){let f=$('ref').files[0];if(!f)throw Error('Choose reference audio first');let a=new AudioContext(),d=await a.decodeAudioData(await f.arrayBuffer());await a.close();let sr=22050,n=Math.round(d.duration*sr),x=new Float32Array(n);for(let i=0;i<n;i++){let p=i*(d.length-1)/(n-1||1),q=Math.floor(p),r=Math.min(q+1,d.length-1),t=p-q,s=Array.from({length:d.numberOfChannels},(_,c)=>d.getChannelData(c)[q]*(1-t)+d.getChannelData(c)[r]*t);x[i]=s.reduce((a,b)=>a+b,0)/s.length}let b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,x[i]))*(x[i]<0?32768:32767),true);let fd=new FormData();fd.append('file',new Blob([b],{type:'audio/wav'}),'reference.wav');let r=await fetch('/reference',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text())}
async function start(){try{await ref();outCtx=new AudioContext({sampleRate:22050});await outCtx.resume();if(outCtx.setSinkId)await outCtx.setSinkId($('out').value||'default');stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:16000});await ctx.resume();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([`class M extends AudioWorkletProcessor{process(i){let x=i[0]?.[0];if(x){let b=new ArrayBuffer(x.length*2),v=new DataView(b);for(let n=0;n<x.length;n++){let s=Math.max(-1,Math.min(1,x[n]));v.setInt16(n*2,s<0?s*32768:s*32767,true)}this.port.postMessage(b,[b])}return true}}registerProcessor('m',M)`],{type:'application/javascript'})));src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'m');gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);ws=new WebSocket(`ws://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onopen=()=>{stopped=false;ws.send(JSON.stringify({sampleRate:16000,windowSeconds:WINDOW}));status('OpenVoice ready; converting 500ms windows…')};proc.port.onmessage=e=>{let a=new Int16Array(pcm.length+e.data.byteLength/2);a.set(pcm);a.set(new Int16Array(e.data),pcm.length);pcm=a;pump()};ws.onmessage=async e=>{if(typeof e.data==='string'){busy=false;status(e.data);pump();return}busy=false;let b=await outCtx.decodeAudioData(e.data.slice(0)),s=outCtx.createBufferSource();s.buffer=b;s.connect(outCtx.destination);let t=Math.max(outCtx.currentTime+.01,nextPlay);s.start(t);nextPlay=t+b.duration;status(`Converted WAV received: ${(e.data.byteLength/1024).toFixed(0)} KB`);pump()};ws.onerror=()=>{busy=false;status('WebSocket error');pump()};$('start').disabled=true;$('stop').disabled=false}catch(e){status('Start failed: '+e);stop()}}
function pump(){let n=16000*WINDOW;if(!busy&&!stopped&&ws?.readyState===1&&pcm.length>=n){busy=true;let x=pcm.slice(0,n);pcm=pcm.slice(n);ws.send(x.buffer)}}function stop(){stopped=true;busy=false;pcm=new Int16Array;nextPlay=0;try{proc?.disconnect();src?.disconnect();gain?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();outCtx?.close();ws?.close()}catch(e){}$('start').disabled=false;$('stop').disabled=true}$('refresh').onclick=refresh;$('start').onclick=start;$('stop').onclick=stop;refresh();</script></body></html>
