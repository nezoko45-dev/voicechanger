<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenVoice V2 Voice Changer</title><style>body{margin:0;background:#111;color:#eee;font:15px system-ui,sans-serif}main{max-width:760px;margin:30px auto;padding:24px;background:#1b1b1b;border-radius:16px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #444;background:#242424;color:#fff;margin:5px 0}button{cursor:pointer}.row{display:grid;gap:7px;margin:14px 0}.buttons{display:flex;gap:10px}.status{margin-top:15px;padding:12px;background:#0d0d0d;border-radius:9px;white-space:pre-wrap;line-height:1.45}.ok{color:#8cff9a}.warn{color:#ffd36b}.bad{color:#ff7d7d}small{color:#aaa}</style></head><body><main><h1>🎙️ OpenVoice V2 Voice Changer</h1><div class="row"><label>Reference voice</label><input id="ref" type="file" accept="audio/wav,audio/*"><small>Reference audio is uploaded directly to the local converter.</small></div><div class="row"><label>Microphone</label><select id="mic"></select></div><div class="row"><label>Chrome output</label><select id="out"><option value="default">Default output</option></select></div><div class="buttons"><button id="refresh">Refresh</button><button id="start">START</button><button id="stop" disabled>STOP</button></div><div id="status" class="status">Loading…</div></main><script>
const $=x=>document.getElementById(x),SR=16000,WINDOW=.608,TARGET=Math.floor(SR*WINDOW),MAX_INPUT=TARGET*3;let stream,ctx,outCtx,src,proc,gain,ws,pcm=new Int16Array(0),stopped=true,busy=false,nextPlay=0,reconnectTimer=null,starting=false;
const status=(x,c='')=>{$('status').textContent=x;$('status').className='status '+c};
async function refresh(){try{const p=await navigator.mediaDevices.getUserMedia({audio:true});p.getTracks().forEach(t=>t.stop());const d=await navigator.mediaDevices.enumerateDevices();$('mic').innerHTML='';d.filter(x=>x.kind==='audioinput').forEach((x,i)=>{let o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||`Microphone ${i+1}`;$('mic').append(o)});$('out').innerHTML='<option value="default">Default output</option>';d.filter(x=>x.kind==='audiooutput').forEach((x,i)=>{let o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||`Output ${i+1}`;$('out').append(o)});status('Chrome audio devices ready.','ok')}catch(e){status('Device error: '+e,'bad')}}
async function uploadReference(){const f=$('ref').files[0];if(!f)throw Error('Choose a reference audio file first');const fd=new FormData();fd.append('file',f,f.name||'reference.wav');const r=await fetch('/reference',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text())}
function worklet(){return `class M extends AudioWorkletProcessor{process(i){let x=i[0]?.[0];if(x){let b=new ArrayBuffer(x.length*2),v=new DataView(b);for(let n=0;n<x.length;n++){let s=Math.max(-1,Math.min(1,x[n]));v.setInt16(n*2,s<0?s*32768:s*32767,true)}this.port.postMessage(b,[b])}return true}}registerProcessor('m',M)`}
function append(a){let n=new Int16Array(pcm.length+a.length);n.set(pcm);n.set(a,pcm.length);pcm=n;if(pcm.length>MAX_INPUT)pcm=pcm.slice(pcm.length-TARGET)}
async function playChunk(bytes){if(stopped)return;try{if(outCtx.state==='suspended')await outCtx.resume();const now=outCtx.currentTime;if(nextPlay-now>1.15)nextPlay=now+.02;const ab=await outCtx.decodeAudioData(bytes.slice(0));const s=outCtx.createBufferSource();s.buffer=ab;s.connect(outCtx.destination);const at=Math.max(nextPlay,outCtx.currentTime+.01);s.start(at);nextPlay=at+ab.duration;status(`Converted audio playing\nChunk: ${ab.duration.toFixed(2)}s\nPlayback lead: ${Math.max(0,nextPlay-outCtx.currentTime).toFixed(2)}s`,'ok')}catch(e){status('Chrome playback failed: '+e,'bad')}}
function openSocket(){if(stopped||starting)return;if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onopen=()=>{ws.send(JSON.stringify({sampleRate:SR,windowSeconds:WINDOW}));status('Connected — loading OpenVoice V2…','warn')};ws.onmessage=async e=>{if(typeof e.data==='string'){if(e.data==='KEEPALIVE')return;status(e.data,e.data.toLowerCase().includes('error')?'bad':'warn');if(e.data.toLowerCase().includes('ready')){busy=false;pump()}return}busy=false;await playChunk(e.data);pump()};ws.onerror=()=>status('Local converter WebSocket error.','bad');ws.onclose=()=>{if(stopped)return;busy=false;status('Converter disconnected — reconnecting…','warn');clearTimeout(reconnectTimer);reconnectTimer=setTimeout(openSocket,800)}}
function pump(){if(!busy&&!stopped&&ws?.readyState===WebSocket.OPEN&&pcm.length>=TARGET){busy=true;const x=pcm.slice(0,TARGET);pcm=pcm.slice(TARGET);ws.send(x.buffer)}}
async function start(){if(starting||!stopped)return;starting=true;try{await uploadReference();outCtx=new AudioContext({sampleRate:SR});await outCtx.resume();if(outCtx.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){}stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('mic').value?{exact:$('mic').value}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:SR});await ctx.resume();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet()],{type:'application/javascript'})));src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'m');gain=ctx.createGain();gain.gain.value=0;src.connect(proc);proc.connect(gain);gain.connect(ctx.destination);proc.port.onmessage=e=>{if(!stopped){append(new Int16Array(e.data));pump()}};pcm=new Int16Array(0);nextPlay=0;busy=false;stopped=false;$('start').disabled=true;$('stop').disabled=false;openSocket()}catch(e){status('Start failed: '+e,'bad');stop()}finally{starting=false}}
function stop(){stopped=true;starting=false;busy=false;pcm=new Int16Array(0);nextPlay=0;clearTimeout(reconnectTimer);try{proc?.disconnect();src?.disconnect();gain?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();outCtx?.close();ws?.close()}catch(e){}proc=src=gain=stream=ctx=outCtx=ws=null;$('start').disabled=false;$('stop').disabled=true;status('Stopped.','warn')}
$('refresh').onclick=refresh;$('start').onclick=start;$('stop').onclick=stop;$('out').onchange=async()=>{if(outCtx?.setSinkId)try{await outCtx.setSinkId($('out').value||'default')}catch(e){status('Output selection failed: '+e,'bad')}};refresh();</script></body></html>
