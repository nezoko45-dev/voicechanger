<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceChanger</title>
<style>body{font-family:system-ui;background:#101116;color:#eee;max-width:900px;margin:0 auto;padding:28px}h1{margin-top:0}.card{background:#191b22;border:1px solid #30333d;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button{font:inherit;border-radius:9px;border:1px solid #3a3d48;background:#0e1015;color:#eee;padding:10px}input,textarea{width:100%;box-sizing:border-box}button{cursor:pointer;background:#272b35}.row{display:grid;gap:12px}.status{padding:10px;border-radius:9px;background:#0e1015}.ok{color:#9ff0ae}.err{color:#ff9a9a}audio{width:100%}small{color:#9da3b1}</style>
</head>
<body>
<h1>🎙️ VoiceChanger</h1><p>Chrome-backed desktop mode — no Electron window and no VB-CABLE.</p>
<div class="card row"><label>Deepgram API key<input id="key" type="password" placeholder="Paste your Deepgram API key"></label><button id="save">Save key</button><div id="status" class="status">Ready.</div></div>
<div class="card row"><label>Voice reference WAV/MP3<input id="ref" type="file" accept="audio/*"></label><label>Reference transcript (optional)<textarea id="refText" rows="2" placeholder="Leave blank for speaker-embedding mode"></textarea></label></div>
<div class="card row"><button id="start">Start microphone + Deepgram</button><button id="stop" disabled>Stop</button><div><strong>Transcript:</strong><div id="transcript" class="status"></div></div><audio id="player" controls></audio></div>
<script>
const $=id=>document.getElementById(id); let ws=null, audioCtx=null, processor=null, source=null, stream=null, active=false;
function status(t,err=false){$('status').textContent=t;$('status').className='status '+(err?'err':'ok')}
$('save').onclick=async()=>{const key=$('key').value.trim();if(!key)return status('Enter a Deepgram API key.',true);localStorage.setItem('vc.dg',key);const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deepgram_key:key})});status(r.ok?'Deepgram key saved.':'Could not save key.',!r.ok)};
if(localStorage.getItem('vc.dg')){$('key').value=localStorage.getItem('vc.dg');fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deepgram_key:localStorage.getItem('vc.dg')})});}
async function start(){const key=localStorage.getItem('vc.dg')||$('key').value.trim();if(!key)return status('Save your Deepgram key first.',true);const token=await (await fetch('/api/deepgram-token')).text();if(token.startsWith('{')){status(token,true);return}stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new AudioContext({sampleRate:16000});source=audioCtx.createMediaStreamSource(stream);processor=audioCtx.createScriptProcessor(4096,1,1);ws=new WebSocket('wss://api.deepgram.com/v1/listen?model=nova-3&encoding=linear16&sample_rate=16000&channels=1&interim_results=true&smart_format=true&endpointing=300',['token',token]);ws.onopen=()=>{active=true;$('start').disabled=true;$('stop').disabled=false;status('Deepgram connected — speak now.')};ws.onmessage=e=>{const d=JSON.parse(e.data);const t=d.channel?.alternatives?.[0]?.transcript||'';if(t){$('transcript').textContent=t;if(d.is_final) synthesize(t)}};ws.onerror=()=>status('Deepgram connection error.',true);ws.onclose=()=>{active=false;$('start').disabled=false;$('stop').disabled=true};processor.onaudioprocess=e=>{if(ws&&ws.readyState===1){const f=e.inputBuffer.getChannelData(0);const b=new ArrayBuffer(f.length*2),v=new DataView(b);for(let i=0;i<f.length;i++){let s=Math.max(-1,Math.min(1,f[i]));v.setInt16(i*2,s<0?s*0x8000:s*0x7fff,true)}ws.send(b)}};source.connect(processor);processor.connect(audioCtx.destination)}
function stop(){active=false;try{ws?.send(JSON.stringify({type:'Finalize'}));ws?.close()}catch{}try{processor?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());audioCtx?.close()}catch{}$('start').disabled=false;$('stop').disabled=true;status('Stopped.')}
async function synthesize(text){const f=$('ref').files[0];if(!f)return;status('Generating cloned voice…');const bytes=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,ref_text:$('refText').value,ref_audio:btoa(s)})});if(!r.ok){status(await r.text(),true);return}const b=atob(await r.text()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:'audio/wav'}));$('player').src=url;$('player').play().catch(()=>{});status('Voice reply ready.')}
$('start').onclick=start;$('stop').onclick=stop;
</script></body></html>
